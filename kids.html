<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habre's Nepali</title>
<meta name="description" content="A picture-and-voice Nepali game for children, with Habre the red panda.">
<meta name="theme-color" content="#e8463a">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one bright playroom screen. Habre (mascot) on the left talks; big tap cards fill the rest. Single sunny theme on purpose. */
:root{
  color-scheme:light;
  --sky:#dcf1ff; --sky-2:#f4fbff; --ink:#2b2140; --soft:#6a6280; --card:#ffffff; --line:#cfe3f2;
  --red:#e8463a; --red-dark:#b8321f; --yellow:#ffc93c; --green:#2fae6e; --blue:#3a7bf2; --purple:#8e5be8; --pink:#ff7eb6;
  --good:#2fae6e; --bad:#e8463a;
  --f:'Baloo 2','Nirmala UI','Mangal',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--sky)}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--sky-2),var(--sky) 60%);color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.3;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.app{max-width:980px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;display:flex;flex-direction:column;gap:14px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.home{background:var(--card);border-radius:999px;padding:6px 16px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.title{font-weight:800;font-size:1.6rem;color:var(--red);margin-right:auto;line-height:1}
.title small{display:block;font-size:.8rem;color:var(--soft);font-weight:500}
.who{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:3px 14px 3px 4px;font-weight:800;box-shadow:0 4px 0 var(--line);max-width:200px}
.who .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:var(--sky)}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{background:var(--yellow);border-radius:999px;padding:4px 14px;font-weight:800;box-shadow:0 4px 0 #e0a800;font-variant-numeric:tabular-nums}
.round{width:52px;height:52px;border-radius:50%;background:var(--card);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;font-size:1.5rem}
.round[aria-pressed="false"]{opacity:.55}

/* stage */
.stage{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.buddy{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.speech{background:var(--card);border-radius:22px;padding:10px 14px;text-align:center;box-shadow:0 5px 0 var(--line);position:relative;min-height:74px;width:100%;display:flex;flex-direction:column;justify-content:center}
.speech::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-12px;border:12px solid transparent;border-top-color:var(--card);border-bottom:0}
.speech b{font-size:1.25rem;display:block;line-height:1.15}
.speech .dev{font-size:1rem;color:var(--soft)}
.speech .en{font-size:.85rem;color:var(--soft)}
.habre{width:180px;height:190px;cursor:pointer}
.habre svg{width:100%;height:100%;overflow:visible}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}

/* habre animation */
.hb-body{transform-origin:80px 160px;animation:bob 2.6s ease-in-out infinite}
.hb-tail{transform-origin:112px 140px;animation:wag 1.8s ease-in-out infinite}
.hb-eyes{transform-origin:80px 64px;animation:blink 4.2s infinite}
.hb-mouth{transform-origin:80px 86px;transition:transform .1s}
.talking .hb-mouth{animation:talk .22s ease-in-out infinite alternate}
.happy .hb-body{animation:jump .7s cubic-bezier(.3,1.6,.5,1) 2}
.happy .hb-armL{transform-origin:50px 120px;animation:waveL .35s ease-in-out 4 alternate}
.happy .hb-armR{transform-origin:110px 120px;animation:waveR .35s ease-in-out 4 alternate}
.sad .hb-head{transform-origin:80px 100px;animation:tilt 1s ease-in-out}
.wave .hb-armR{transform-origin:110px 120px;animation:waveR .4s ease-in-out 6 alternate}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes wag{50%{transform:rotate(12deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes talk{to{transform:scaleY(1.9)}}
@keyframes jump{40%{transform:translateY(-34px) scale(1.04,.96)}70%{transform:translateY(0) scale(1.06,.94)}}
@keyframes waveL{to{transform:rotate(-38deg)}}
@keyframes waveR{to{transform:rotate(38deg)}}
@keyframes tilt{30%,70%{transform:rotate(-10deg)}}

/* screens */
h1{margin:0;font-size:2rem;line-height:1.1;text-wrap:balance}
h1 small{display:block;font-size:1rem;color:var(--soft);font-weight:500}
h2.sub{margin:0;font-size:1.2rem}
h2.sub small{font-size:.9rem;color:var(--soft);font-weight:500;margin-left:6px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.topic{background:var(--card);border-radius:26px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 7px 0 var(--tc,var(--line));transition:transform .12s;animation:pop .45s cubic-bezier(.3,1.5,.5,1) backwards}
.topic:hover{transform:translateY(-3px)}
.topic:active{transform:translateY(4px);box-shadow:0 3px 0 var(--tc)}
.topic .ic{font-size:3.2rem;line-height:1.1}
.topic b{font-size:1.45rem;line-height:1}
.topic .dev{color:var(--soft)}
.topic .en{font-size:.85rem;color:var(--soft)}
.medals{display:flex;gap:4px;font-size:1.1rem;margin-top:2px}
.medals span{filter:grayscale(1);opacity:.3}
.medals span.on{filter:none;opacity:1}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lv{background:var(--card);border-radius:22px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 5px 0 var(--line);border:4px solid transparent}
.lv span{font-size:2rem;line-height:1.1}
.lv b{font-size:1.2rem;line-height:1.1}
.lv small{font-size:.8rem;color:var(--soft)}
.lv .best{font-weight:700;color:#b98900}
.lv[aria-pressed="true"]{border-color:var(--lc);box-shadow:0 5px 0 var(--lc)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cards{background:#00a6b8}
.rule{display:flex;gap:10px;align-items:center;text-align:left;background:#fff7d6;border-radius:20px;padding:10px 14px;box-shadow:0 4px 0 #f0d77a}
.rule>span:first-child{font-size:2rem}
.rule b{display:block;font-size:1.05rem;line-height:1.25}
.rule small{color:var(--soft);font-size:.95rem}
/* picture grammar */
.sz-l{font-size:1.25em;display:inline-block}
.sz-s{font-size:.5em;display:inline-block}
.place{display:inline-flex;align-items:center;justify-content:center;font-size:.62em;line-height:1}
.place.v{flex-direction:column}
.place.h{gap:.6em}
.place.in{position:relative}
.place.in .inner{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:.5em}
/* kids flashcards */
.kfc{display:block;width:100%;border:0;background:none;padding:0;perspective:1200px;min-height:300px}
.kfc-in{position:relative;display:block;width:100%;min-height:300px;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.kfc.flipped .kfc-in{transform:rotateY(180deg)}
.kfc-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;border-radius:32px;background:var(--card);box-shadow:0 8px 0 var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}
.kfc-back{transform:rotateY(180deg);background:#fff7d6;box-shadow:0 8px 0 #f0d77a}
.kfc-face .pic{font-size:6rem;line-height:1.1}
.kfc-face b{font-size:2.4rem;line-height:1.1}
.kfc-face .dev{font-size:1.5rem;color:var(--soft)}
.kfc-face .en{font-size:1rem;color:var(--soft)}
.kfc-face .hint{position:absolute;bottom:12px;font-size:.9rem;color:var(--soft)}
.kfc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.kfc-top label{display:flex;align-items:center;gap:6px;font-weight:500;font-size:.95rem}
.kfc-top input{width:22px;height:22px;accent-color:var(--red)}
@media (prefers-reduced-motion: reduce){.kfc-in{transition:none}}
.mode{border-radius:28px;padding:20px 12px;color:#fff;font-weight:800;font-size:1.6rem;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.18);animation:pop .45s cubic-bezier(.3,1.5,.5,1) backwards}
.mode span{font-size:3rem;line-height:1}
.mode small{font-size:.95rem;font-weight:500;opacity:.92}
.mode:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.learn{background:var(--blue)} .play{background:var(--green)}

/* profiles */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.person{position:relative;background:var(--card);border-radius:26px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 7px 0 var(--pc,var(--line));animation:pop .45s cubic-bezier(.3,1.5,.5,1) backwards}
.person .av{font-size:3.6rem;line-height:1.1}
.person b{font-size:1.3rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person small{color:#b98900;font-weight:700}
.person.add{box-shadow:0 7px 0 var(--line);border:3px dashed var(--line)}
.person.add .av{color:var(--soft)}
.edit-row{display:flex;gap:8px;justify-content:center;margin-top:4px}
.mini{border-radius:999px;padding:2px 12px;font-size:.9rem;font-weight:700;background:var(--sky);box-shadow:0 3px 0 var(--line)}
.mini.del{color:var(--red)}
.form{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 7px 0 var(--line);display:flex;flex-direction:column;gap:12px}
.form label{font-weight:800;font-size:1.1rem}
.form input[type=text]{font:inherit;font-size:1.4rem;padding:8px 14px;border-radius:16px;border:3px solid var(--line);width:100%;max-width:360px}
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.avatars button{font-size:2.4rem;height:68px;border-radius:18px;background:var(--sky);border:4px solid transparent}
.avatars button[aria-pressed="true"]{border-color:var(--red);background:#ffe9e6}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.warn{background:#fff1ef;border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}

/* learn card */
.big{background:var(--card);border-radius:32px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 var(--line);text-align:center;min-height:300px;justify-content:center}
.big .pic{font-size:7rem;line-height:1.1;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.big b{font-size:2.6rem;line-height:1}
.big .dev{font-size:1.5rem;color:var(--soft)}
.big .en{font-size:1rem;color:var(--soft)}
.swatch{width:150px;height:150px;border-radius:44% 56% 52% 48%/50% 44% 56% 50%;border:5px solid rgba(0,0,0,.08);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.count{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:2.6rem;max-width:360px;line-height:1.1}
.count.many{font-size:1.8rem;max-width:300px}
.count.tens{flex-direction:column;align-items:flex-start;gap:2px;font-size:1.15rem;max-width:none}
.ten-row{display:flex;gap:2px;padding:1px 6px;border-radius:10px;background:var(--sky)}
.count i{font-style:normal;animation:drop .4s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes drop{from{transform:translateY(-40px) scale(.4);opacity:0}}
.digit{font-size:4rem;font-weight:800;line-height:1;color:var(--blue)}
.nav{display:flex;gap:12px;justify-content:center;align-items:center}
.arrow{width:76px;height:76px;border-radius:50%;background:var(--yellow);font-size:2rem;font-weight:800;box-shadow:0 6px 0 #e0a800}
.arrow:active{transform:translateY(4px);box-shadow:0 2px 0 #e0a800}
.listen{background:var(--red);color:#fff;border-radius:999px;padding:12px 26px;font-weight:800;font-size:1.3rem;box-shadow:0 6px 0 var(--red-dark)}
.listen:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red-dark)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}

/* quiz */
.q{background:var(--card);border-radius:26px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 0 var(--line)}
.q .say{font-size:1.8rem;font-weight:800;line-height:1.1}
.q .say small{display:block;font-size:1rem;color:var(--soft);font-weight:500}
.q .again{margin-left:auto;flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;font-size:1.8rem;box-shadow:0 5px 0 var(--red-dark)}
.q.listenonly .again{width:84px;height:84px;font-size:2.4rem;animation:glow 1s ease-in-out infinite alternate}
.progress{height:16px;border-radius:99px;background:var(--card);overflow:hidden;box-shadow:inset 0 2px 0 var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),#ff9f1c);border-radius:99px;transition:width .4s}
.opts{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:14px}
.opt{background:var(--card);border-radius:28px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 7px 0 var(--line);animation:pop .4s cubic-bezier(.3,1.5,.5,1) backwards;transition:transform .12s}
.opt:active{transform:translateY(4px)}
.opt .pic{font-size:5rem;line-height:1.1}
.opt .swatch{width:110px;height:110px}
.opt .digit{font-size:3.6rem}
.opt .w{font-size:1.2rem;font-weight:700;line-height:1.1}
.opt .w-en{font-size:.95rem;color:var(--soft);line-height:1.1}
.opt .lab{font-size:.85rem;color:var(--soft);visibility:hidden}
.opt.right{box-shadow:0 7px 0 var(--good),0 0 0 6px var(--good);animation:yay .6s cubic-bezier(.3,1.6,.5,1)}
.opt.right .lab,.opt.show .lab{visibility:visible}
.opt.wrong{animation:shake .5s;opacity:.55}
.opt.hint{box-shadow:0 7px 0 var(--good),0 0 0 6px var(--yellow);animation:glow 1s ease-in-out infinite alternate}
@keyframes yay{40%{transform:scale(1.15) rotate(-4deg)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes glow{to{transform:scale(1.05)}}
.counter{background:var(--card);border-radius:26px;padding:12px;box-shadow:0 6px 0 var(--line);display:flex;justify-content:center}

/* end */
.end{background:var(--card);border-radius:32px;padding:24px;text-align:center;box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:8px}
.end .trophy{font-size:6rem;line-height:1;animation:jump .8s cubic-bezier(.3,1.6,.5,1) 2}
.end .row{font-size:2.2rem;letter-spacing:3px;line-height:1.2}
.end .row .off{filter:grayscale(1);opacity:.3}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{border-radius:999px;padding:12px 24px;font-weight:800;font-size:1.2rem;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line)}

/* grown-ups */
.grown{background:var(--card);border-radius:24px;padding:16px 18px;box-shadow:0 6px 0 var(--line);display:grid;gap:10px;font-size:1rem}
.grown h2{margin:0;font-size:1.3rem}
.grown p{margin:0;color:var(--soft)}
.grown label{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grown select{font:inherit;font-size:1rem;padding:4px 8px;border-radius:10px;border:2px solid var(--line);max-width:100%}
.grown input[type=checkbox]{width:22px;height:22px;accent-color:var(--red)}
.grown input[type=range]{accent-color:var(--red)}
.progwrap{overflow-x:auto}
.prog{border-collapse:collapse;font-size:.92rem;width:100%}
.prog th,.prog td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.prog th{color:var(--soft);font-weight:500}
.prog td small{color:var(--soft)}
.prog td.pass{color:var(--good);font-weight:800}
.prog td.some{color:#b98900;font-weight:700}
.practise{display:flex;flex-wrap:wrap;gap:8px}
.practise span{background:var(--sky);border-radius:999px;padding:4px 12px;font-size:.95rem}
.practise small{color:var(--soft)}
.practise .dot,.cd .dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;border:1px solid var(--line)}
/* letters and stories */
.letter{font-family:'Mukta','Nirmala UI','Mangal',var(--f);font-size:6.5rem;line-height:1.05;font-weight:700;color:var(--ink);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.opt .letter{font-size:4rem}
.ex{font-size:1.1rem;color:var(--soft)}
.ex b{font-size:1.2rem;color:var(--ink)}
.write{align-self:center;background:var(--purple);box-shadow:0 6px 0 #6a3fbe}
.trace{position:relative;width:min(300px,82vw);aspect-ratio:1;margin:0 auto;background:var(--card);border-radius:24px;box-shadow:0 6px 0 var(--line);overflow:hidden}
.trace canvas{position:absolute;inset:0;width:100%;height:100%}
#trInk{touch-action:none;cursor:crosshair}
#traceBox{display:flex;flex-direction:column;gap:12px;align-items:center}
.story .story-pic{font-size:5.5rem;line-height:1.15;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.story b{font-size:1.9rem;line-height:1.2;text-wrap:balance}
.arrow:disabled{opacity:.35}
.speedrow{display:flex;flex-direction:column;gap:6px}
.speeds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.speeds button{display:flex;flex-direction:column;align-items:center;background:var(--sky);border:3px solid transparent;border-radius:16px;padding:6px 4px;line-height:1.15;box-shadow:0 3px 0 var(--line)}
.speeds button small{color:var(--soft);font-size:.8rem}
.speeds button[aria-checked="true"]{border-color:var(--red);background:#fff}
@media (max-width:680px){.speeds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lvtable{border-collapse:collapse;font-size:.95rem}
.lvtable td,.lvtable th{padding:4px 10px 4px 0;text-align:left;vertical-align:top}
.lvtable th{color:var(--soft);font-weight:500}

/* home: six doors with a progress ring each */
.back{align-self:flex-start;background:var(--card);border-radius:999px;padding:4px 16px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.door{background:var(--card);border-radius:90px 90px 26px 26px;padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 8px 0 var(--dc);transition:transform .12s;animation:pop .45s cubic-bezier(.3,1.5,.5,1) backwards}
.door:hover{transform:translateY(-3px)}
.door:active{transform:translateY(4px);box-shadow:0 4px 0 var(--dc)}
.door b{font-size:1.5rem;line-height:1.05}
.door .dev{color:var(--soft)}
.door .en{font-size:.85rem;color:var(--soft)}
.ring{width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--dc) calc(var(--p)*1%),#e6eef6 0);display:grid;place-items:center;margin-bottom:4px}
.ring>span{width:82px;height:82px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:2.8rem;line-height:1}
.ring>span.lt{font-family:'Nirmala UI','Mangal',var(--f);font-weight:700;color:var(--red)}
.today{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.daily{background:linear-gradient(135deg,#ff9f1c,#e8463a);color:#fff;border-radius:28px;padding:14px 18px;text-align:left;display:flex;align-items:center;gap:14px;box-shadow:0 7px 0 var(--red-dark)}
.daily .ic{font-size:3rem;line-height:1}
.daily b{font-size:1.5rem;display:block;line-height:1.1}
.daily small{display:block;font-size:.9rem}
.daily:active,.wod:active,.reward:active{transform:translateY(4px)}
.wod{background:var(--card);border-radius:28px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 7px 0 var(--line);text-align:left}
.wod .pic{font-size:3.2rem;line-height:1}
.wod .swatch{width:56px;height:56px;animation:none}
.wod small{display:block;color:var(--soft);font-size:.8rem}
.wod b{font-size:1.4rem;display:block;line-height:1.1}
.reward{background:#fff7d6;border-radius:24px;padding:10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 5px 0 #f0d77a;flex-wrap:wrap;text-align:left}
.reward .next{font-size:2.2rem;line-height:1}
.bar2{display:block;height:14px;border-radius:99px;background:#fff;overflow:hidden;margin-top:4px}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#ff9f1c)}
/* topic page: learn, play, check + extras */
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.extras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mode em{font-style:normal;font-size:.85rem;background:#fff;color:var(--green);border-radius:999px;padding:0 10px;font-weight:800}
.memo{background:var(--purple)} .check{background:#ff9f1c}
.ans{font-size:1.4rem;font-weight:800;color:var(--green)}
.ans small{display:block;font-weight:500;font-size:.95rem;color:var(--soft)}
.blank{display:inline-block;min-width:2.2em;border-bottom:4px dashed var(--red);color:var(--red);text-align:center}
.opts.yesno .opt,.opts.ending .opt{min-height:130px}
.opts.ending .w{font-size:2rem}
/* memory match */
.mem{display:grid;grid-template-columns:repeat(var(--mc,4),minmax(0,1fr));gap:10px}
.mc{aspect-ratio:3/4;perspective:800px;padding:0}
.mc-in{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.up .mc-in,.mc.done .mc-in{transform:rotateY(180deg)}
.mc-f{position:absolute;inset:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 5px 0 var(--line);padding:4px;text-align:center;overflow:hidden}
.mc-back{background:repeating-linear-gradient(45deg,#e8463a 0 10px,#f05a4b 10px 20px);color:#fff;font-size:2.2rem;font-weight:800}
.mc-face{background:var(--card);transform:rotateY(180deg)}
.mc-face .pic{font-size:2.8rem;line-height:1.1}
.mc-face .swatch{width:56px;height:56px}
.mc-face .digit{font-size:2.4rem}
.mc-face .letter{font-size:3rem}
.mc-face b{font-size:1rem;line-height:1.1;overflow-wrap:anywhere}
.mc-face .dev{font-size:.8rem;color:var(--soft)}
.mc.done .mc-face{box-shadow:0 5px 0 var(--good),0 0 0 4px var(--good)}

.book h3{margin:0;font-size:1.1rem}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.stk button{height:66px;border-radius:16px;display:grid;place-items:center;background:#fff;box-shadow:0 3px 0 #ecd9b5}
.stk .pic{font-size:2.3rem;line-height:1;animation:none}
.stk .swatch{width:40px;height:40px;border-width:3px;animation:none}
.stk .digit{font-size:1.7rem}

.baskets span{display:inline-flex;align-items:center;gap:4px}
.baskets i{width:12px;height:12px;border-radius:50%;display:inline-block}
.b0{background:var(--red)} .b1{background:var(--yellow)} .b2{background:var(--green)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border-radius:999px;padding:6px 14px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:700;border:3px solid transparent}
.seg button[aria-pressed="true"]{border-color:var(--red)}
/* vakya: sentence train */
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend span{border-radius:999px;padding:3px 12px;color:#fff;font-weight:700;font-size:.95rem}
.legend small{font-weight:500}
.train{display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;gap:16px 6px;padding:14px 0 6px;min-height:96px}
.car{position:relative;min-width:96px;min-height:62px;padding:8px 12px;border-radius:14px;background:var(--rc,#fff);color:#fff;font-weight:800;font-size:1.25rem;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.2);margin-bottom:14px}
.car small{font-size:.8rem;font-weight:500}
.car::before,.car::after{content:"";position:absolute;bottom:-16px;width:18px;height:18px;border-radius:50%;background:#3b3550;border:3px solid #fff}
.car::before{left:12px}.car::after{right:12px}
.car.plain{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}
.car.empty{background:transparent;border:3px dashed var(--rc,#9fb6c8);color:var(--rc,var(--soft));box-shadow:none}
.car.engine{border-top-right-radius:30px}
.car .chim{position:absolute;top:-16px;right:18px;width:16px;height:16px;border-radius:4px 4px 0 0;background:#3b3550}
.car.sel{outline:5px solid var(--yellow);outline-offset:2px}
.car.bad{animation:shake .5s}
.car.good{box-shadow:0 5px 0 rgba(0,0,0,.2),0 0 0 4px var(--good)}

.ansopts{display:grid;gap:12px}
.ansopt{background:var(--card);border-radius:20px;padding:12px 18px;text-align:left;box-shadow:0 5px 0 var(--line);font-size:1.3rem;font-weight:800;line-height:1.2;animation:pop .4s cubic-bezier(.3,1.5,.5,1) backwards}
.ansopt small{display:block;font-weight:500;font-size:.95rem;color:var(--soft)}
.ansopt.right{box-shadow:0 5px 0 var(--good),0 0 0 5px var(--good)}
.ansopt.wrong{animation:shake .5s;opacity:.55}
.ansopt.hint{box-shadow:0 5px 0 var(--good),0 0 0 5px var(--yellow)}

.tok{display:inline;padding:0 3px;border-radius:8px;font:inherit;color:inherit;line-height:inherit;transition:background .15s}
.tok.on,.dtok.on{background:var(--yellow)}
.dtok{border-radius:6px;padding:0 1px}
.story .qpic{color:var(--soft)}
.topic.lock{filter:grayscale(1);opacity:.6}

.wardrobe button[aria-pressed="true"]{border-color:var(--green)}
.wardrobe button:disabled{opacity:.55}
.deckrow{display:flex;gap:10px;flex-wrap:wrap}
.cd{display:flex;flex-wrap:wrap;gap:6px}
.cd label{background:var(--sky);border-radius:999px;padding:3px 12px;gap:6px;font-size:.95rem}
.hbAcc text{font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
@media (max-width:680px){
  .doors{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .today{grid-template-columns:minmax(0,1fr)}

  .door b{font-size:1.25rem}
  .path,.extras{gap:8px}
  .car{min-width:74px;font-size:1.05rem;padding:6px 8px}
  .tile{font-size:1.05rem;padding:8px 12px}
  .mem{gap:6px}
  .mc-face .pic{font-size:2rem}
}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall var(--d) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}

@media (max-width:680px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .buddy{position:static;flex-direction:row;align-items:center}
  .habre{width:110px;height:118px;flex:0 0 auto}
  .speech{order:2}
  .speech::after{left:-10px;top:50%;bottom:auto;margin:-10px 0 0;border:10px solid transparent;border-right-color:var(--card);border-left:0}
  .opts{gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .opt{min-height:130px;border-radius:22px}
  .opt .pic{font-size:3.6rem}
  .opt .swatch{width:76px;height:76px}
  .big .pic{font-size:5.5rem}
  .topics,.people{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .topic .ic{font-size:2.6rem}
  .modes{gap:8px}
  .mode{font-size:1.15rem;padding:14px 4px;border-radius:22px}
  .mode span{font-size:2.2rem}
  .mode small{font-size:.75rem}
  .q .say{font-size:1.4rem}
  .who .nm{max-width:70px}
  .title{font-size:1.3rem}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

// say a Nepali line (Devanagari for a Nepali/Hindi voice, romanized otherwise), then optionally the English
// o.keep: queue after what is already being said; o.onWord(i): called with the index of the word being spoken (-1 at the end),
// from the voice's word boundaries when it reports them, otherwise from a timer that guesses the pace
function say(rom,dev,en,o){
  o=o||{};
  if(!TTS||!S.sound){o.onWord&&o.onWord(-1);return;}
  try{
    if(!o.keep)speechSynthesis.cancel();
    const h=$('#habre'),stop=()=>h.classList.remove('talking');
    const text=npVoice?dev:rom,u=new SpeechSynthesisUtterance(text);
    if(npVoice){u.voice=npVoice;u.lang=npVoice.lang;}
    u.rate=S.rate;u.pitch=1.15;
    u.onstart=()=>h.classList.add('talking');u.onend=stop;u.onerror=stop;
    if(o.onWord){
      const starts=[],toks=[];text.replace(/\S+/g,(m,i)=>{starts.push(i);toks.push(m);return m;});
      let timer=0,byVoice=false,k=0;
      const step=()=>{if(byVoice||k>=toks.length)return;o.onWord(k);const ms=(toks[k].length*(npVoice?95:70)+170)/S.rate;k++;timer=setTimeout(step,ms);};
      const end=()=>{clearTimeout(timer);o.onWord(-1);};
      u.onboundary=e=>{if(e.name&&e.name!=='word')return;byVoice=true;clearTimeout(timer);let j=0;while(j+1<starts.length&&starts[j+1]<=e.charIndex)j++;o.onWord(j);};
      u.addEventListener('start',step);u.addEventListener('end',end);u.addEventListener('error',end);
    }
    speechSynthesis.speak(u);
    if(en&&S.english){
      const e=new SpeechSynthesisUtterance(en);
      if(enVoice){e.voice=enVoice;e.lang=enVoice.lang;}
      e.rate=Math.min(1,S.rate+0.1);e.pitch=1.1;
      e.onstart=()=>h.classList.add('talking');e.onend=stop;e.onerror=stop;
      speechSynthesis.speak(e);
    }
  }catch(err){}
}

// ---------- jodi (memory match): each picture has a twin card with its word ----------
let M=null;
function memFace(x){
  const {t,it}=x.c;
  if(x.side==='pic')return t.kind==='num'?`<span class="digit">${it[3]}</span>`:pictureOf(t,it);
  if(t.kind==='letter')return `<span class="pic" style="font-size:2rem">${it[3]}</span><b>${esc(it[5])}</b><span class="dev" lang="ne">${it[6]}</span>`;
  return `<b>${esc(it[0])}</b><span class="dev" lang="ne">${it[1]}</span>`;
}
function startMemory(cards,o){
  const uniq=shuffle(cards).filter((c,i,a)=>a.findIndex(x=>x.it[3]===c.it[3]||keyOf(x.t,x.it)===keyOf(c.t,c.it))===i);
  const pick=uniq.slice(0,o.pairs||4);
  M={cards,deck:shuffle(pick.flatMap((c,i)=>[{c,i,side:'pic'},{c,i,side:'word'}])),o,open:[],done:0,moves:0,lock:false,pairs:pick.length};
  drawMemory();
}
function drawMemory(){
  screen='memory';const cols=M.deck.length<=6?3:4;
  main.innerHTML=`${backBtn('Back')}<h2 class="sub">🧠 Jodi milau <small>${esc(M.o.title||'')} · find each picture’s word · tries: <span id="mMoves">0</span></small></h2>
   <div class="mem" style="--mc:${cols}">${M.deck.map((x,k)=>`<button class="mc" data-k="${k}" aria-label="Card ${k+1}"><span class="mc-in"><span class="mc-f mc-back" aria-hidden="true">?</span><span class="mc-f mc-face">${memFace(x)}</span></span></button>`).join('')}</div>`;
  $('#backBtn').onclick=M.o.back;
  main.querySelectorAll('.mc').forEach(b=>b.onclick=()=>memFlip(b,+b.dataset.k));
  speech('Jodi milau!','जोडी मिलाऊ!','Find each picture and its word.');say('Jodi milau!','जोडी मिलाऊ!','Find each picture and its word.');mood('wave');
}
function memFlip(b,k){
  if(M.lock||b.classList.contains('up')||b.classList.contains('done'))return;
  b.classList.add('up');M.open.push(k);
  const x=M.deck[k];if(x.side==='word')hearItem(x.c.t,x.c.it);
  if(M.open.length<2)return;
  M.moves++;$('#mMoves').textContent=M.moves;
  const [a,c]=M.open,A=M.deck[a],C=M.deck[c],btns=main.querySelectorAll('.mc');M.open=[];
  if(A.i===C.i){
    btns[a].classList.add('done');btns[c].classList.add('done');M.done++;
    const {t,it}=A.c;speech(t.kind==='letter'?it[5]:it[0],t.kind==='letter'?it[6]:it[1],t.kind==='letter'?it[7]:it[2]);hearItem(t,it);mood('happy');
    if(M.done===M.pairs){const m=M;setTimeout(()=>{if(screen==='memory'&&M===m)memEnd();},1100);}
  }else{M.lock=true;mood('sad');setTimeout(()=>{btns[a].classList.remove('up');btns[c].classList.remove('up');M.lock=false;},1000);}
}
function memEnd(){
  const n=M.moves<=M.pairs+2?3:M.moves<=M.pairs*2+1?2:1,p=P(),o=M.o;let nb=false;
  if(o.key&&n>((p.best||{})[o.key]||0)){p.best=p.best||{};p.best[o.key]=n;nb=true;save();renderTop();}
  endCard(n,3,{newBest:nb,sub:`${M.pairs} pairs in ${M.moves} tries`,again:()=>startMemory(M.cards,o),back:o.back});
}

// every card sits in one of Habre's three baskets: 0 = new / again, 1 = practising, 2 = I know it
const boxOf=(p,c)=>((p.box||{})[keyOf(c.t,c.it)])||0;
const allCards=()=>[...WORD_T(),AKSHAR(),...GRAM_T(),VAKYA_T].flatMap(t=>t.items.map(it=>({t,it})));
function deckSession(cards,p){
  const by=[[],[],[]];cards.forEach(c=>by[boxOf(p,c)].push(c));
  if(!by[0].length&&!by[1].length)return shuffle(cards).slice(0,12);
  return [...shuffle(by[0]),...shuffle(by[1]),...shuffle(by[2]).slice(0,2)].slice(0,12);
}
function trickyCards(p){
  const st=stat(p);
  return Object.keys(st.miss).map(k=>({k,score:(st.miss[k]||0)-(st.right[k]||0)*0.5})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,12).map(x=>findCard(x.k)).filter(Boolean);
}
// story words that are also picture words
function storyWordCards(){

  return out;
}

let KF=null;
function startKCards(cards,back,title,only){
  const p=P();
  KF={cards,back,title,queue:only?shuffle(only):deckSession(cards,p),missed:new Set(),flipped:false,wordFirst:!!S.wordFirst};
  KF.total=KF.queue.length;
  drawKCard();
}
function kPicture(t,it){
  if(t.kind==='num')return countHtml(it[3],COUNT_PICS[it[3]%COUNT_PICS.length],'aria-hidden="true"');
  if(t.kind==='letter')return `${pictureOf(t,it)}<span class="pic" style="font-size:3rem">${it[3]}</span>`;
  return pictureOf(t,it);
}
function drawKCard(){
  screen='kcards';const c=KF.queue[0],p=P();
  if(!c){
    const again=[...KF.missed],n=[0,0,0];KF.cards.forEach(x=>n[boxOf(p,x)]++);
    endCard(0,0,{trophy:'🃏',title:'Sakiyo!',titleDev:'सकियो!',sub:`${KF.title} · ${KF.total} cards · ${KF.total-again.length} you knew straight away`,
      extra:`<div class="baskets" style="width:100%;font-size:1rem"><span><i class="b0"></i> ${n[0]} naya</span><span><i class="b1"></i> ${n[1]} abhyas</span><span><i class="b2"></i> ${n[2]} aayo!</span></div>
        ${again.length?`<button class="btn" style="background:var(--yellow);color:var(--ink)" id="kMissed">🔁 Missed ones (${again.length})</button>`:''}`,
      again:()=>startKCards(KF.cards,KF.back,KF.title),back:()=>{const b=KF.back;KF=null;b();}});
    if(again.length)$('#kMissed').onclick=()=>startKCards(KF.cards,KF.back,KF.title,again);
    return;
  }
  const {t,it}=c,isL=t.kind==='letter',pic=kPicture(t,it),yn=t.kind==='yesno'?ynOf(t,it):null;
  const word=`<b>${esc(it[0])}</b><span class="dev" lang="ne">${isL?it[1]+' · '+it[6]:it[1]}</span>${S.english?`<span class="en">${esc(isL?it[5]+' = '+it[7]:it[2])}</span>`:''}${yn?`<span class="ans">→ ${yn[0]}!</span>`:''}`;
  const front=KF.wordFirst?word:pic,back=KF.wordFirst?pic+`<span class="en">${esc(isL?it[5]:it[2])}</span>`:pic+word;
  const pos=KF.total-KF.queue.length+1;
  main.innerHTML=`<div class="kfc-top"><span>${esc(KF.title)} · ${Math.min(pos,KF.total)}/${KF.total} <span class="baskets" style="display:inline-flex"><span><i class="b${boxOf(p,c)}"></i></span></span></span><label><input type="checkbox" id="kWordFirst" ${KF.wordFirst?'checked':''}> Word first</label></div>
   <button class="kfc ${KF.flipped?'flipped':''}" id="kCard" type="button" aria-label="Tap to flip">
    <span class="kfc-in"><span class="kfc-face">${front}<span class="hint">${KF.wordFirst?'What does it mean? Tap to flip!':'Can you say it in Nepali? Tap to flip!'}</span></span><span class="kfc-face kfc-back">${back}</span></span></button>
   <div class="nav">
    <button class="btn" style="background:var(--yellow);color:var(--ink)" id="kNo">🔁 Pheri <small style="font-weight:500">again</small></button>
    <button class="listen" id="kSay" aria-label="Listen">🔊</button>
    <button class="btn" style="background:var(--green)" id="kYes">⭐ Aayo! <small style="font-weight:500">I knew it</small></button>
   </div>`;
  const hear=()=>hearItem(t,it);
  if(KF.wordFirst)hear();
  $('#kCard').onclick=()=>{KF.flipped=!KF.flipped;$('#kCard').classList.toggle('flipped',KF.flipped);if(KF.flipped&&!KF.wordFirst){hear();mood('happy');}};
  $('#kSay').onclick=hear;
  $('#kWordFirst').onchange=e=>{KF.wordFirst=e.target.checked;S.wordFirst=KF.wordFirst;save();KF.flipped=false;drawKCard();};
  $('#kYes').onclick=()=>kDone(true);$('#kNo').onclick=()=>kDone(false);
  speech(KF.title,'',KF.wordFirst?'What does it mean?':'What is it called?');
}
function kDone(ok){
  const c=KF.queue.shift(),first=!KF.missed.has(c),p=P(),key=keyOf(c.t,c.it);
  if(p&&first){
    const st=stat(p),s=ok?st.right:st.miss;s[key]=(s[key]||0)+1;
    p.box=p.box||{};p.box[key]=ok?Math.min(2,boxOf(p,c)+1):0;save();
  }
  if(ok){mood('happy');}else{KF.missed.add(c);KF.queue.splice(Math.min(3,KF.queue.length),0,c);mood('sad');}
  KF.flipped=false;drawKCard();
}

function lookup(w){
  if(!LEX){LEX={};WORD_T().forEach(t=>t.items.forEach(it=>{if(!/\s/.test(it[0])&&!LEX[it[0]])LEX[it[0]]={t,it};}));}
  w=w.toLowerCase().replace(/[^a-z]/g,'');
  if(LEX[w])return LEX[w];
  for(const e of ENDINGS)if(w.endsWith(e)&&LEX[w.slice(0,-e.length)])return LEX[w.slice(0,-e.length)];
  return null;
}

function goBranch(k){branchK=k;path=[...story.pages,...story.branches[k]];pageI=story.pages.length;renderPage();}
// a story with a choice: each ending found is a star; then try the other way
function branchEnd(){
  const p=P();p.endings=p.endings||{};const f=new Set(p.endings[story.id]||[]);f.add(branchK);p.endings[story.id]=[...f];
  let nb=false;if(f.size>bestOf(p,'kathaa',story.id)){p.best=p.best||{};p.best['kathaa:'+story.id]=f.size;nb=true;}
  save();renderTop();
  const other=1-branchK,o=story.choice[3][other];
  endCard(f.size,2,{trophy:'🌿',title:'Kathaa sakiyo!',titleDev:'कथा सकियो!',sub:f.size>=2?'You found both endings!':'Now try the other way!',newBest:nb,
    extra:`<button class="btn" style="background:var(--purple)" id="otherWay">${o[0]} Arko baato <small style="font-weight:500">the other way</small></button>`,back:openStories,backLabel:'Kathaa'});
  $('#otherWay').onclick=()=>goBranch(other);
}
function storyQuiz(){

  const ask=()=>{speech(rom,dev,en);say(rom,dev,en);};

  });

// put four scenes from the story in order: tap what happened first
function storyOrder(){
  screen='storyo';const pg=story.pages,mid=shuffle(pg.slice(1,-1).map((_,i)=>i+1)).slice(0,2).sort((a,b)=>a-b),pick=[0,...mid,pg.length-1];

  main.innerHTML=`${backBtn('Kathaa')}<h2 class="sub">🧩 Kun pahile? <small>Tap what happened first, then next…</small></h2>
   <div class="order">${cards.map((c,k)=>`<button class="ocard" data-k="${k}" style="animation:pop .45s ${k*80}ms backwards"><span class="pic" aria-hidden="true">${pg[c.pi][0]}</span><span>${esc(pg[c.pi][1])}</span></button>`).join('')}</div>`;
  $('#backBtn').onclick=openStories;
  main.querySelectorAll('.ocard').forEach(b=>b.onclick=()=>{
    const c=cards[+b.dataset.k];if(b.classList.contains('done'))return;
    if(c.ord===nextOrd){
      nextOrd++;b.classList.add('done');b.insertAdjacentHTML('beforeend',`<span class="num">${nextOrd}</span>`);const l=pg[c.pi];say(l[1],l[2],null);mood('happy');
      if(nextOrd===pick.length){
        const p=P();if(!bestOf(p,'krama',story.id)){p.best=p.best||{};p.best['krama:'+story.id]=1;save();renderTop();}
        confetti();speech('Ekdam ramro!','एकदम राम्रो!','You put the story in order!');setTimeout(()=>{say('Ekdam ramro!','एकदम राम्रो!','You put the story in order!');},1400);
        setTimeout(()=>{if(screen==='storyo')openStories();},3600);
      }
    }else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');mood('sad');speech(nextOrd?'Ani ke bhayo?':'Pahile ke bhayo?',nextOrd?'अनि के भयो?':'पहिले के भयो?',nextOrd?'What happened next?':'What happened first?');say(nextOrd?'Ani ke bhayo?':'Pahile ke bhayo?',nextOrd?'अनि के भयो?':'पहिले के भयो?',null);}
  });
  speech('Kun pahile?','कुन पहिले?','What happened first?');say('Kun pahile?','कुन पहिले?','What happened first?');mood('wave');
}

const V_ABOUT={easy:'2-word sentences, the colours show where each word goes',medium:'3-word sentences',hard:'4-word sentences, one extra tile that doesn’t belong'};

let V=null;
function vStart(act){
  const lv=levelOf('vakya');
  if(act==='chitra'){startQuiz({mode:'vchitra',back:openVakya});return;}
  if(act==='grow'){vGrowStart();return;}
  const pool=act==='sodhau'?QA:vSents(lv);
  V={act,lv,list:shuffle(pool).slice(0,V_N),i:0,stars:0,cur:null};
  vNext();
}
function vNext(){if(V.i>=V.list.length){vEnd();return;}V.tries=0;V.cur=null;({build:vBuild,ulto:vSilly,sodhau:vAsk})[V.act]();}
const vBar=()=>`<div class="progress" aria-label="Sentence ${V.i+1} of ${V.list.length}"><i style="width:${V.i/V.list.length*100}%"></i></div>`;
function carHtml(tile,k,n,o){
  const col=tile?(o.colour?ROLES[tile.r][3]:''):(o.hint?ROLES[o.want[k].r][3]:'');
  const cls=['car',tile?'':'empty',tile&&!o.colour?'plain':'',k===n-1?'engine':'',o.cls&&o.cls[k]||''].filter(Boolean).join(' ');
  return `<button class="${cls}" data-c="${k}" ${col?`style="--rc:${col}"`:''} aria-label="${tile?esc(tile.rom):'Empty car '+(k+1)}">${k===n-1?'<span class="chim" aria-hidden="true"></span>':''}${tile?`${esc(tile.rom)}<small lang="ne">${tile.dev}</small>`:(o.hint?`<small>${ROLES[o.want[k].r][0]}</small>`:'')}</button>`;
}
// build: tap the word tiles into the train cars in the right order
function vBuild(){
  screen='vbuild';const s=V.list[V.i],n=s.w.length,colour=V.lv!=='hard',hint=V.lv==='easy';
  if(!V.cur){
    const tiles=[...s.w];
    if(V.lv==='hard'){const dec=shuffle(SENTS.flatMap(x=>x.w)).find(x=>!s.w.some(y=>y.rom===x.rom));if(dec)tiles.push(dec);}
    V.cur={slots:Array(n).fill(null),pool:shuffle(tiles).map(t=>({...t,used:false})),cls:[]};
  }

   <div class="q"><span class="pic" style="font-size:3.4rem;line-height:1" aria-hidden="true">${s.pic}</span><div class="say" style="font-size:1.3rem">${S.english?esc(s.en):'Rel banau!'}<small>Rel banau · build the sentence train</small></div><button class="again" id="again" aria-label="Hear the sentence">🔊</button></div>
   <div class="train">${C.slots.map((t,k)=>carHtml(t&&t.tile,k,n,{colour,hint,want:s.w,cls:C.cls})).join('')}</div>
   <div class="pool">${C.pool.map((t,k)=>t.used?'':`<button class="tile${colour?'':' plain'}" data-p="${k}" ${colour?`style="--rc:${ROLES[t.r][3]}"`:''}>${esc(t.rom)}<small lang="ne">${t.dev}</small></button>`).join('')}</div>`;
  const hear=()=>say(s.rom,s.dev,null);
  $('#backBtn').onclick=openVakya;$('#again').onclick=hear;
  main.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    if(C.done)return;const k=+b.dataset.p,slot=C.slots.findIndex(x=>!x);if(slot<0)return;
    C.pool[k].used=true;C.slots[slot]={tile:C.pool[k],p:k};C.cls=[];say(C.pool[k].rom,C.pool[k].dev,null);
    if(C.slots.every(Boolean))vCheckBuild();else vBuild();
  });
  main.querySelectorAll('.car').forEach(b=>b.onclick=()=>{
    if(C.done)return;const k=+b.dataset.c,x=C.slots[k];if(!x)return;C.pool[x.p].used=false;C.slots[k]=null;C.cls=[];vBuild();
  });
  if(!C.spoke){C.spoke=true;if(V.lv!=='hard')hear();speech('Rel banau!','रेल बनाऊ!','Put the words in the train. The doing word is the engine!');mood('wave');}
}
function vCheckBuild(){
  const s=V.list[V.i],C=V.cur,ok=C.slots.every((x,k)=>x.tile.rom===s.w[k].rom);
  if(ok){
    C.done=true;C.cls=s.w.map(()=>'good');if(V.tries===0)V.stars++;vBuild();confetti();mood('happy');
    const p=rnd(PRAISE);speech(p[0]+' '+s.rom,p[1]+' '+s.dev,s.en);say(s.rom,s.dev,null);
    const v=V;setTimeout(()=>{if(screen==='vbuild'&&V===v){V.i++;vNext();}},2300);return;
  }
  V.tries++;mood('sad');
  if(V.tries>=2){
    C.done=true;C.slots=s.w.map(w=>({tile:C.pool.find(t=>t.rom===w.rom),p:-1}));C.cls=s.w.map(()=>'good');vBuild();
    speech(s.rom,s.dev,'Like this!');say(s.rom,s.dev,null);const v=V;setTimeout(()=>{if(screen==='vbuild'&&V===v){V.i++;vNext();}},3200);return;
  }
  // send the wrong ones back to the pile, keep the right ones
  const engineWrong=C.slots[C.slots.length-1].tile.r!=='d';
  C.cls=C.slots.map((x,k)=>x.tile.rom===s.w[k].rom?'good':'bad');
  C.slots=C.slots.map((x,k)=>{if(x.tile.rom===s.w[k].rom)return x;C.pool[x.p].used=false;return null;});

  else{speech(RETRY[0],RETRY[1],RETRY[2]);say(RETRY[0],RETRY[1],RETRY[2]);}
}

}

function vEnd(){

// grow: a sentence gets one more word each time; tap the gap where it goes
function vGrowStart(){
  const p=P();let i=GROW.findIndex((_,k)=>bestOf(p,'badhau',k)<3);if(i<0)i=Math.floor(Math.random()*GROW.length);
  V={act:'grow',g:i,step:1,stars:0,tries:0};vGrow();
}
function vGrow(){
  screen='vgrow';const g=GROW[V.g],prev=g.steps[V.step-1],next=g.steps[V.step];
  const add=next.find(x=>!prev.some(y=>y.rom===x.rom)),want=next.indexOf(add),n=prev.length,eng=prev[n-1].r==='d'?n:n+1;
  const gap=k=>`<button class="gap${V.tries>=2&&k===want?' hint':''}" data-g="${k}" aria-label="Put it here">+</button>`;
  main.innerHTML=`${backBtn('Vakya')}<div class="progress"><i style="width:${(V.step-1)/(g.steps.length-1)*100}%"></i></div>
   <div class="q"><span class="pic" style="font-size:3.4rem;line-height:1" aria-hidden="true">${g.pic}</span><div class="say" style="font-size:1.3rem">${esc(sRom(prev))}<small lang="ne">${sDev(prev)}${S.english?' · '+esc(g.en[V.step-1]):''}</small></div><button class="again" id="again" aria-label="Hear it">🔊</button></div>
   <div class="train">${gap(0)}${prev.map((t,k)=>carHtml(t,k,eng,{colour:true})+gap(k+1)).join('')}</div>
   <h2 class="sub" style="text-align:center">Yo kahaa jaanchha? <small>Where does this word go?${S.english?' · '+esc(g.en[V.step]):''}</small></h2>
   <div class="pool"><span class="tile new" style="--rc:${ROLES[add.r][3]}">${esc(add.rom)}<small lang="ne">${add.dev}</small></span></div>`;
  $('#backBtn').onclick=openVakya;$('#again').onclick=()=>say(sRom(prev),sDev(prev),null);
  main.querySelectorAll('.gap').forEach(b=>b.onclick=()=>{
    if(+b.dataset.g===want){
      if(V.tries===0)V.stars++;V.step++;V.tries=0;confetti();mood('happy');
      speech(sRom(next),sDev(next),g.en[V.step-1]);say(sRom(next),sDev(next),null);
      const v=V;if(V.step>=g.steps.length){setTimeout(()=>{if(screen==='vgrow'&&V===v)vGrowEnd();},1800);main.querySelectorAll('.gap').forEach(x=>x.disabled=true);}
      else setTimeout(()=>{if(screen==='vgrow'&&V===v)vGrow();},1500);
    }else{V.tries++;b.classList.add('wrong');b.disabled=true;mood('sad');
      if(V.tries>=2)vGrow();
      if(add.r==='d'){speech('Kaam garne shabda antyama!','काम गर्ने शब्द अन्त्यमा!','The doing word goes at the end!');}else speech(RETRY[0],RETRY[1],RETRY[2]);
      say(RETRY[0],RETRY[1],null);}
  });
  if(V.tries===0){say(sRom(prev),sDev(prev),null,{});speech(sRom(prev),sDev(prev),'Let’s make it longer!');}
}
function vGrowEnd(){
  const p=P(),key='badhau:'+V.g,g=GROW[V.g],last=g.steps[g.steps.length-1];let nb=false;
  if(V.stars>((p.best||{})[key]||0)){p.best=p.best||{};p.best[key]=V.stars;nb=true;}

// ---------- letter tracing ----------
// the child traces over a faint letter; it counts when the ink covers most of the letter and stays mostly inside it
function openTrace(it){
  const box=$('#traceBox');box.hidden=false;
  box.innerHTML=`<div class="trace"><canvas id="trGuide" aria-hidden="true"></canvas><canvas id="trInk" aria-label="Trace the letter ${it[1]} with your finger"></canvas></div>
   <div class="btns"><button class="btn ghost" id="trClear">↺ Pheri <small style="font-weight:500">again</small></button><button class="btn" style="background:var(--green)" id="trDone">✔ Sakiyo <small style="font-weight:500">done</small></button></div>`;
  const wrap=box.querySelector('.trace'),size=Math.round(wrap.getBoundingClientRect().width)||260,dpr=window.devicePixelRatio||1;
  const g=$('#trGuide'),k=$('#trInk');[g,k].forEach(c=>{c.width=size*dpr;c.height=size*dpr;});
  const gx=g.getContext('2d'),kx=k.getContext('2d');gx.scale(dpr,dpr);kx.scale(dpr,dpr);
  // a 1x copy of the ink for checking
  const ink=document.createElement('canvas');ink.width=ink.height=size;const ix=ink.getContext('2d');
  const font=`700 ${Math.round(size*0.6)}px 'Baloo 2','Nirmala UI','Mangal',sans-serif`,cy=size*0.56;
  const drawGuide=()=>{gx.clearRect(0,0,size,size);gx.font=font;gx.textAlign='center';gx.textBaseline='middle';
    gx.fillStyle='#e6f1fb';gx.fillText(it[1],size/2,cy);gx.setLineDash([5,6]);gx.lineWidth=2;gx.strokeStyle='#9fbfdc';gx.strokeText(it[1],size/2,cy);};
  (document.fonts&&document.fonts.load?document.fonts.load(font):Promise.resolve()).then(drawGuide,drawGuide);
  const lw=size*0.08;
  [kx,ix].forEach(c=>{c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#e8463a';});
  let down=false,last=null,won=false;
  const pt=e=>{const r=k.getBoundingClientRect();return [(e.clientX-r.left)*size/r.width,(e.clientY-r.top)*size/r.height];};
  const line=(a,b)=>[kx,ix].forEach(c=>{c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();});
  k.onpointerdown=e=>{down=true;k.setPointerCapture(e.pointerId);last=pt(e);line(last,last);};
  k.onpointermove=e=>{if(!down)return;const p=pt(e);line(last,p);last=p;};
  k.onpointerup=k.onpointercancel=()=>{if(!down)return;down=false;if(!won&&check(false))celebrate();};
  function check(loud){
    const m=document.createElement('canvas');m.width=m.height=size;const mx=m.getContext('2d');
    mx.font=font;mx.textAlign='center';mx.textBaseline='middle';mx.fillStyle='#000';mx.fillText(it[1],size/2,cy);
    const d=document.createElement('canvas');d.width=d.height=size;const dx=d.getContext('2d');
    dx.font=font;dx.textAlign='center';dx.textBaseline='middle';dx.fillText(it[1],size/2,cy);dx.lineWidth=lw*1.6;dx.lineJoin='round';dx.strokeText(it[1],size/2,cy);
    const M=mx.getImageData(0,0,size,size).data,D=dx.getImageData(0,0,size,size).data,I=ix.getImageData(0,0,size,size).data;
    let letter=0,covered=0,inkN=0,out=0;
    for(let i=3;i<M.length;i+=4*3){const inL=M[i]>100,inI=I[i]>100;if(inL){letter++;if(inI)covered++;}if(inI){inkN++;if(D[i]<60)out++;}}
    const cov=letter?covered/letter:0,outside=inkN?out/inkN:1;
    if(cov>=0.5&&outside<=0.35)return true;
    if(loud){
      if(cov<0.5){speech('Pura lekha!','पूरा लेख!','Trace all of it!');say('Pura lekha!','पूरा लेख!','Trace all of it!');}
      else{speech('Rekha bhitra lekha!','रेखा भित्र लेख!','Stay inside the lines!');say('Rekha bhitra lekha!','रेखा भित्र लेख!','Stay inside the lines!');}
      mood('sad');
    }
    return false;
  }
  function celebrate(){
    won=true;confetti();mood('happy');
    const p=P();if(p){p.traced=p.traced||{};p.traced[it[1]]=(p.traced[it[1]]||0)+1;save();}
    speech('Syabaas! '+it[0]+'!','स्याबास! '+it[1],'You wrote '+it[0]+'!');say('Syabaas! '+it[0],'स्याबास! '+it[1],null);
  }
  $('#trClear').onclick=()=>{kx.clearRect(0,0,size,size);ix.clearRect(0,0,size,size);won=false;};
  $('#trDone').onclick=()=>{if(won||check(true))celebrate();};
  speech('Lekhaun!','लेखौं!','Trace the letter with your finger.');say('Lekhaun!','लेखौं!','Trace the letter with your finger.');
  wrap.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});
}

// ---------- quiz engine: play, check, today's practice, listen-and-tap flashcards, Vakya picture rounds ----------
// each question is an entry {t, it, pool (entries to draw wrong answers from), lv (level), face (how answers are labelled), hide (listen only)}
const ENDING_DEV={haru:'हरू',ko:'को',ma:'मा',lai:'लाई',le:'ले',sanga:'सँग'};
const ENDING_EN={haru:'many',ko:'whose',ma:'in',lai:'to / for',le:'did it',sanga:'with'};
function questionLine(t,it){
  if(t.kind==='num')return ['Kati wota?','कति वटा?','How many?'];
  if(t.kind==='yesno')return [it[0],it[1],it[2]];
  if(t.kind==='ending')return ['Kun tukra milchha?','कुन टुक्रा मिल्छ?','Which ending fits?'];
  if(t.q==='kun')return [`${cap(it[0])} kun ho?`,`${it[1]} कुन हो?`,`Which one is ${it[2]}?`];
  if(t.q==='phrase')return [`“${cap(it[0])}” — kun chitra?`,`“${it[1]}” — कुन चित्र?`,`Which picture means “${it[2]}”?`];
  if(t.kind==='letter')return [`“${it[0]}” kun akshar?`,`${it[1]}। ${it[1]} कुन अक्षर?`,`Which letter says “${it[0]}”?`];
  return [`${cap(it[0])} kahaa cha?`,`${it[1]} कहाँ छ?`,`Where is the ${it[2]}?`];
}
// a list of n, reshuffled as often as needed, never the same thing twice in a row
function spread(list,n){
  const out=[];while(out.length<n)out.push(...shuffle(list));
  for(let i=1;i<out.length;i++)if(out[i]===out[i-1]){const j=out.findIndex((x,k)=>k>i&&x!==out[i-1]);if(j>0)[out[i],out[j]]=[out[j],out[i]];}
  return out.slice(0,n);
}
function startQuiz(o){
  let entries=[];
  const mk=(t,words,lv,extra)=>spreadOf=>spreadOf.map(it=>({t,it,pool:words.map(w=>({t,it:w})),lv,face:lv,...extra}));
  if(o.mode==='play'){
    const t=o.t,lv=levelOf(t.id),words=wordsFor(t,lv);o.lv=lv;
    entries=mk(t,words,lv,{hide:LEVELS[lv].listen})(spread(words,LEVELS[lv].n));
  }else if(o.mode==='check'){
    const t=o.t;entries=mk(t,t.items,'check',{face:'hard',choices:3})(spread(t.items,CHECK_N));
  }else if(o.mode==='vchitra'){
    const lv=levelOf('vakya'),words=vSents(lv).map(s=>[s.rom,s.dev,s.en,s.pic]);o.lv=lv;
    entries=mk(VAKYA_T,words,lv,{hide:lv==='hard',face:'hard'})(spread(words,V_N));
  }else if(o.mode==='listen'){
    entries=spread(o.cards,Math.min(8,o.cards.length)).map(c=>({...c,pool:o.cards,lv:'listen',face:'hard',hide:true,choices:3,pick:true}));
  }else if(o.mode==='daily'){
    const one=t=>{const lv=levelOf(t.id),w=wordsFor(t,lv);return {t,it:rnd(w),pool:w.map(x=>({t,it:x})),lv,face:lv};};
    const vw=vSents(levelOf('vakya')).map(s=>[s.rom,s.dev,s.en,s.pic]);
    entries=shuffle([...shuffle(WORD_T()).slice(0,4).map(one),...shuffle(GRAM_T()).slice(0,2).map(one),one(AKSHAR()),
      {t:VAKYA_T,it:rnd(vw),pool:vw.map(x=>({t:VAKYA_T,it:x})),lv:levelOf('vakya'),face:'hard'}]);
  }
  Q={...o,o,entries,n:entries.length,i:0,stars:0};
  if(!Q.back)Q.back=o.t?()=>openTopic(o.t):()=>goHome();
  renderQ();
}
function distractors(e,n){
  const k0=keyOf(e.t,e.it);
  const pool=e.pool.filter(x=>keyOf(x.t,x.it)!==k0&&x.it[3]!==e.it[3]).filter((x,i,a)=>a.findIndex(y=>y.it[3]===x.it[3])===i);
  if(e.t.kind!=='num')return shuffle(pool).slice(0,n);
  const near=shuffle(pool.filter(x=>Math.abs(x.it[3]-e.it[3])<=3)),far=shuffle(pool.filter(x=>Math.abs(x.it[3]-e.it[3])>3));
  return [...near,...far].slice(0,n);
}
// what an answer button shows: easy = picture + Nepali + English, medium = picture + Nepali, hard = picture only.
// Whatever is hidden is revealed (.lab) once the button is answered.
function optionFace(t,o,lv){
  if(t.kind==='letter'){
    const ex=`${o[3]} ${o[5]}`;
    return pictureOf(t,o)+(lv!=='hard'?`<span class="w">${o[0]}</span>`:'')+(lv==='easy'?`<span class="w-en">${ex}</span>`:'')
      +(lv==='hard'?`<span class="lab">${o[0]} · ${ex}</span>`:lv==='medium'?`<span class="lab">${ex}</span>`:'');
  }
  const pic=t.kind==='num'?`<span class="digit">${o[3]}</span>`:pictureOf(t,o);
  const np=lv!=='hard'?`<span class="w">${esc(o[0])}</span>`:'';
  const en=lv==='easy'?`<span class="w-en">${esc(o[2])}</span>`:'';
  const hidden=lv==='hard'?`${o[0]} · ${o[2]}`:lv==='medium'?o[2]:'';
  return pic+np+en+(hidden?`<span class="lab">${esc(hidden)}</span>`:'');
}
function renderQ(){
  screen='quiz';const e=Q.entries[Q.i],{t,it}=e;Q.tries=0;Q.lock=false;
  // in listen-and-tap every card becomes "hear it, find the picture"
  const kind=e.pick&&t.kind!=='letter'&&t.kind!=='num'?'pick':t.kind;
  let opts,ans;
  if(kind==='yesno'){opts=[{t,it:[...t.yes,'✅']},{t,it:[...t.no,'❌']}];ans=opts[it[4]?0:1];}
  else if(kind==='ending'){
    const ends=[...new Set(t.items.map(x=>x[5]))];
    opts=shuffle([it[5],...shuffle(ends.filter(x=>x!==it[5])).slice(0,3)]).map(x=>({t,it:['-'+x,ENDING_DEV[x]||x,ENDING_EN[x]||'',''],end:x}));
    ans=opts.find(x=>x.end===it[5]);
  }else{const c=e.choices||LEVELS[e.lv].choices;opts=shuffle([e,...distractors(e,c-1)]);ans=e;}
  Q.opts=opts;Q.ans=ans;
  const [rom,dev,en]=kind==='pick'?[`“${cap(it[0])}” — kun chitra?`,`“${it[1]}” — कुन चित्र?`,`Which picture is “${it[2]}”?`]:questionLine(t,it);
  const hide=e.hide&&canListen()&&!['num','yesno','ending'].includes(kind);
  const showEn=S.english&&e.lv==='easy';
  const face=o=>kind==='yesno'?`<span class="pic">${o.it[3]}</span><span class="w">${o.it[0]}</span>${S.english?`<span class="w-en">${esc(o.it[2])}</span>`:''}`
    :kind==='ending'?`<span class="w">${o.it[0]}</span><span class="w-en" lang="ne">${o.it[1]}${S.english&&e.lv!=='hard'?' · '+esc(o.it[2]):''}</span>`
    :optionFace(o.t,o.it,e.face);
  main.innerHTML=`${Q.back?backBtn('Back'):''}<div class="progress" aria-label="Question ${Q.i+1} of ${Q.n}"><i style="width:${Q.i/Q.n*100}%"></i></div>
   <div class="q${hide?' listenonly':''}"><div class="say" id="qSay">${hide?`Suna ra chhana! <small>सुन र छान · Listen and choose</small>`:`${esc(rom)}<small lang="ne">${dev}${showEn?` · ${esc(en)}`:''}</small>`}</div>
     <button class="again" id="again" aria-label="Say it again">🔊</button></div>
   ${kind==='num'?`<div class="counter">${countHtml(it[3],rnd(COUNT_PICS),`aria-label="${it[3]} things"`)}</div>`:''}
   ${kind==='yesno'||kind==='ending'?`<div class="counter"><span class="pic" style="font-size:4.6rem;line-height:1.1" aria-hidden="true">${it[3]}</span></div>`:''}
   ${kind==='ending'?`<div class="q"><div class="say" id="blankLine" style="margin:0 auto">${esc(it[4]).replace('___','<span class="blank">?</span>')}</div></div>`:''}
   <div class="opts ${kind}${opts.length===3?' three':''}" style="--cols:${opts.length}">${opts.map((o,k)=>`<button class="opt" data-k="${k}" style="animation-delay:${k*90}ms" aria-label="${esc(kind==='num'?o.it[0]:kind==='yesno'||kind==='ending'?o.it[0]:o.it[2])}">${face(o)}</button>`).join('')}</div>`;
  const ask=()=>{if(!hide)speech(rom,dev,en);else speech('Suna ra chhana!','सुन र छान!','Listen and choose!');
    if(kind==='pick')say(it[0],it[1],null);else say(rom,dev,e.lv==='easy'?en:null);};
  if(Q.back)$('#backBtn').onclick=Q.back;
  $('#again').onclick=ask;
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,opts[+b.dataset.k]));
  ask();
}
function qNext(q){if(screen!=='quiz'||(q&&q!==Q))return;Q.i++;if(Q.i<Q.n)renderQ();else endQuiz();}
function pick(b,o){
  if(Q.lock)return;
  const e=Q.entries[Q.i],{t,it}=e,p=P(),st=stat(p),key=keyOf(t,it),ans=Q.ans;
  if(o===ans){
    Q.lock=true;if(Q.tries===0){Q.stars++;st.right[key]=(st.right[key]||0)+1;save();}
    b.classList.add('right');confetti();mood('happy');
    $('#qSay').innerHTML=`${esc(t.kind==='ending'?it[0]:questionLine(t,it)[0])}<small lang="ne">${it[1]} · ${esc(it[2])}</small>`;
    if($('#blankLine'))$('#blankLine').innerHTML=esc(it[4]).replace('___',`<span class="blank" style="color:var(--green);border-color:var(--green)">${it[5]}</span>`);
    const pr=rnd(PRAISE),w=t.kind==='yesno'?ans.it:it;
    speech(pr[0]+' '+cap(w[0])+'!',pr[1]+' '+w[1],pr[2]+' '+cap(w[2])+'!');say(pr[0]+' '+w[0],pr[1]+' '+w[1],null);
    const q=Q;setTimeout(()=>qNext(q),1900);
  }else{
    Q.tries++;b.classList.add('wrong','show');b.disabled=true;mood('sad');
    if(Q.tries===1){st.miss[key]=(st.miss[key]||0)+1;save();}
    const rb=main.querySelector(`.opt[data-k="${Q.opts.indexOf(ans)}"]`),left=[...main.querySelectorAll('.opt')].filter(x=>!x.disabled);
    const show=()=>{rb.classList.add('hint');speech(cap(ans.it[0]),ans.it[1],'This one!');say(ans.it[0],ans.it[1],null);};
    // a check counts the first answer only
    if(Q.mode==='check'){Q.lock=true;show();const q=Q;setTimeout(()=>qNext(q),2200);}
    else if(Q.tries>=2||left.length===1)show();
    else{speech(RETRY[0],RETRY[1],RETRY[2]);say(RETRY[0],RETRY[1],RETRY[2]);}
  }
}
function endQuiz(){
  const p=P(),n=Q.stars,N=Q.n,st=stat(p),o=Q.o;
  st.plays++;st.last=today();
  let key=null;
  if(Q.mode==='play')key=Q.t.id+':'+Q.lv;

    const t=Q.t,lv=Q.lv,L=LEVELS[lv],next=LV_KEYS[LV_KEYS.indexOf(lv)+1],offerNext=next&&n/N>=0.7;

        ${n/N>=0.7&&!checked(p,t)?`<button class="btn" style="background:#ff9f1c" id="toCheck">✅ Jaanch <small style="font-weight:500">check</small></button>`:''}
        <button class="btn" style="background:var(--blue)" id="toLearn">👀 Sikaun <small style="font-weight:500">learn</small></button>`,
      again:()=>startQuiz(o),back:()=>openTopic(t),backLabel:t.np});

    if($('#toCheck'))$('#toCheck').onclick=()=>startQuiz({mode:'check',t});
    $('#toLearn').onclick=()=>{topic=t;learnI=0;renderLearn();};
  }else if(Q.mode==='check'){
    const t=Q.t,ok=n>=CHECK_N-1;
    endCard(n,N,{newBest,trophy:ok?'✅':'🌟',title:ok?'Jaanch paas!':'Ramro kosis!',titleDev:ok?'जाँच पास!':'राम्रो कोसिस!',sub:ok?`You know ${t.en.toLowerCase()}!`:`Get ${CHECK_N-1} right to pass. Play a bit more, then try again.`,
      again:()=>startQuiz(o),back:()=>openTopic(t),backLabel:t.np});
  }else if(Q.mode==='daily'){
    const d=p.daily||{};

  }else{
    endCard(n,N,{sub:`${Q.title} · listen and tap`,again:()=>startQuiz(o),back:Q.back,backLabel:'Patti'});
  }
}

    <div class="btns" style="justify-content:flex-start">
      <button class="btn" style="background:var(--red)" id="vTest">🔊 Test voice</button>
      <button class="btn" style="background:var(--blue)" id="vDone">Done</button>
    </div>
    <h2>Progress</h2>
    ${S.profiles.length?`<label>Player <select id="progSel">${S.profiles.map(x=>`<option value="${x.id}" ${p&&x.id===p.id?'selected':''}>${x.icon} ${esc(x.name)}</option>`).join('')}</select></label>
    <div id="progBody"></div>`:'<p>No players yet.</p>'}
    <h2>Levels</h2>
    <table class="lvtable">${LV_KEYS.map(k=>`<tr><th>${LEVELS[k].icon} ${LEVELS[k].np} (${LEVELS[k].en})</th><td>${LEVELS[k].n} questions, ${LEVELS[k].about}.</td></tr>`).join('')}</table>
    <p>A level’s medal on the home screen lights up at 70% of its stars. Each player keeps their own stars and chosen levels. Everything is saved in this browser only.</p>
    ${p?`<div class="btns" style="justify-content:flex-start"><button class="btn ghost" id="resetP">Reset ${esc(p.name)}’s stars</button></div><div class="warn" id="resetBox" hidden><b>Clear every star ${esc(p.name)} has earned?</b><div class="btns" style="justify-content:flex-start"><button class="btn" style="background:var(--red)" id="resetYes">Yes, clear</button><button class="btn ghost" id="resetNo">Keep</button></div></div>`:''}
  </div>`;
  if($('#progSel')){const show=()=>renderProgress(S.profiles.find(x=>x.id===$('#progSel').value));$('#progSel').onchange=show;show();}
  $('#vSel')&&($('#vSel').onchange=e=>{S.voice=e.target.value;save();loadVoices();});
  $('#vEn').onchange=e=>{S.english=e.target.checked;save();};
  main.querySelectorAll('.speeds button').forEach(b=>b.onclick=()=>{S.rate=+b.dataset.r;save();
    main.querySelectorAll('.speeds button').forEach(x=>x.setAttribute('aria-checked',String(x===b)));
    say('Namaste! Ma Habre hu.','नमस्ते! म हाब्रे हुँ।',null);});
  $('#vTest').onclick=()=>say('Namaste! Ma Habre hu.','नमस्ते! म हाब्रे हुँ।','Hello! I am Habre.');
  $('#vDone').onclick=()=>goHome();
  if(p){
    $('#resetP').onclick=()=>{$('#resetBox').hidden=false;$('#resetNo').focus();};
    $('#resetNo').onclick=()=>{$('#resetBox').hidden=true;};
    $('#resetYes').onclick=()=>{p.best={};p.rw=0;save();renderTop();renderGrown();};
  }
}

$('#homeBtn').onclick=()=>goHome();
$('#whoBtn').onclick=goWho;
$('#grownBtn').onclick=renderGrown;
function renderSound(){const b=$('#soundBtn');b.setAttribute('aria-pressed',String(S.sound));b.setAttribute('aria-label',S.sound?'Sound on':'Sound off');b.textContent=S.sound?'🔊':'🔇';}
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();renderSound();if(!S.sound)speechSynthesis?.cancel?.();};
save();renderSound();renderTop();
// with more than one player (or none yet), ask who is playing first
if(S.profiles.length===1&&P())goHome();else goWho();
</script>
</body>
</html>
