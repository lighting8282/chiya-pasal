// ---------- quiz engine: play, check, today's practice, listen-and-tap flashcards, Vakya picture rounds ----------
// each question is an entry {t, it, pool (entries to draw wrong answers from), lv (level), face (how answers are labelled), hide (listen only)}
const ENDING_DEV={haru:'हरू',ko:'को',ma:'मा',lai:'लाई',le:'ले',sanga:'सँग',s:'धेरै',ing:'गर्दै',ed:'भइसक्यो','’s':'को'};
const ENDING_EN={haru:'many',ko:'whose',ma:'in',lai:'to / for',le:'did it',sanga:'with',s:'many',ing:'doing now',ed:'already happened','’s':'whose'};
function questionLine(t,it){
  if(isLittle()&&t.kind==='pic')return [cap(it[0])+'?',it[1]+'?',cap(it[2])+'?'];
  if(t.kind==='num')return ['Kati wota?','कति वटा?','How many?'];
  if(t.kind==='yesno')return [it[0],it[1],it[2]];
  if(t.kind==='ending')return ['Kun tukra milchha?','कुन टुक्रा मिल्छ?','Which ending fits?'];
  if(t.q==='kun')return [`${cap(it[0])} kun ho?`,`${it[1]} कुन हो?`,`Which one is ${it[2]}?`];
  if(t.q==='phrase')return [`“${cap(it[0])}” — kun chitra?`,`“${it[1]}” — कुन चित्र?`,`Which picture means “${it[2]}”?`];
  if(t.id==='abc')return [`${cap(it[5])}: kun akshar?`,`${it[6]} (${it[5]}) कुन अक्षरबाट सुरु हुन्छ?`,`Which letter does “${it[5]}” start with?`];
  if(t.kind==='letter')return [`“${it[0]}” kun akshar?`,`${it[1]}। ${it[1]} कुन अक्षर?`,`Which letter says “${it[0]}”?`];
  return [`${cap(it[0])} kahaa cha?`,`${it[1]} कहाँ छ?`,whereEn(it[2])];
}
// a list of n, reshuffled as often as needed, never the same thing twice in a row
function spread(list,n){
  const out=[];while(out.length<n)out.push(...shuffle(list));
  for(let i=1;i<out.length;i++)if(out[i]===out[i-1]){const j=out.findIndex((x,k)=>k>i&&x!==out[i-1]);if(j>0)[out[i],out[j]]=[out[j],out[i]];}
  return out.slice(0,n);
}
function startQuiz(o){
  let entries=[];
  const mk=(t,words,lv,extra)=>spreadOf=>spreadOf.map(it=>({t,it,pool:words.map(w=>({t,it:w})),lv,face:lv,...extra}));
  if(o.mode==='play'){
    // a practice round on the trail (o.round, or the stop being played), or a free round at the player's difficulty
    const t=o.t,rd=o.round||(trip&&trip.k==='play'&&trip.t===t.id&&isRound(trip.lv)?trip.lv:null);
    const lv=rd||levelOf(t.id),face=rd?diffOf(P()):lv,words=wordsFor(t,lv);o.lv=lv;
    entries=mk(t,words,face,{hide:LEVELS[face].listen})(spread(words,rd?roundN(rd):LEVELS[lv].n));
  }else if(o.mode==='check'){
    // a check is asked at the player's difficulty, without labels unless that's easy
    const t=o.t,d=diffOf(P());entries=mk(t,t.items,'check',{face:d==='easy'?'easy':'hard',choices:LEVELS[d].choices,hide:LEVELS[d].listen})(spread(t.items,checkN()));
  }else if(o.mode==='vchitra'){
    const lv=levelOf('vakya'),words=vSents(lv).map(s=>[s.rom,s.dev,s.en,s.pic]);o.lv=lv;
    entries=mk(vakyaT(),words,lv,{hide:lv==='hard',face:'hard'})(spread(words,V_N));
  }else if(o.mode==='listen'){
    entries=spread(o.cards,Math.min(8,o.cards.length)).map(c=>({...c,pool:o.cards,lv:'listen',face:'hard',hide:true,choices:3,pick:true}));
  }else if(o.mode==='daily'){
    const one=t=>{const lv=levelOf(t.id),w=wordsFor(t,lv);return {t,it:rnd(w),pool:w.map(x=>({t,it:x})),lv,face:lv};};
    const vw=vSents(levelOf('vakya')).map(s=>[s.rom,s.dev,s.en,s.pic]);
    entries=shuffle([...shuffle(WORD_T()).slice(0,4).map(one),...shuffle(GRAM_ON()).slice(0,2).map(one),...AKSHAR_ON().map(one),
      ...(shelved('vakya')?[one(rnd(WORD_T()))]:[{t:vakyaT(),it:rnd(vw),pool:vw.map(x=>({t:vakyaT(),it:x})),lv:levelOf('vakya'),face:'hard'}])]);
  }else if(o.mode==='yatra'){
    // the big check at the end of a place: words from its stops, each at that stop's level, no word twice
    const used=new Set();
    const d=diffOf(P());
    entries=spread(o.stops,bossN()).map(s=>{const t=T(s.t),w=wordsFor(t,s.lv);let it=rnd(w);
      for(let k=0;k<6&&used.has(keyOf(t,it));k++)it=rnd(w);used.add(keyOf(t,it));
      return {t,it,pool:w.map(x=>({t,it:x})),lv:d,face:d,hide:LEVELS[d].listen};});
  }
  Q={...o,o,entries,n:entries.length,i:0,stars:0};
  if(!Q.back)Q.back=o.t?()=>openTopic(o.t):openMap;
  renderQ();
}
function distractors(e,n){
  const k0=keyOf(e.t,e.it);
  const pool=e.pool.filter(x=>keyOf(x.t,x.it)!==k0&&x.it[3]!==e.it[3]).filter((x,i,a)=>a.findIndex(y=>y.it[3]===x.it[3])===i);
  if(e.t.kind!=='num')return shuffle(pool).slice(0,n);
  const near=shuffle(pool.filter(x=>Math.abs(x.it[3]-e.it[3])<=3)),far=shuffle(pool.filter(x=>Math.abs(x.it[3]-e.it[3])>3));
  return [...near,...far].slice(0,n);
}
// what an answer button shows: easy = picture + Nepali + English, medium = picture + Nepali, hard = picture only.
// Whatever is hidden is revealed (.lab) once the button is answered.
function optionFace(t,o,lv){
  // the alphabet asks which letter a word starts with, so its buttons show only the letter until answered
  if(t.id==='abc')return pictureOf(t,o)+(lv!=='hard'?`<span class="w">${o[0]}</span>`:'')+`<span class="lab">${o[3]} ${o[5]}</span>`;
  if(t.kind==='letter'){
    const ex=`${o[3]} ${o[5]}`;
    return pictureOf(t,o)+(lv!=='hard'?`<span class="w">${o[0]}</span>`:'')+(lv==='easy'?`<span class="w-en">${ex}</span>`:'')
      +(lv==='hard'?`<span class="lab">${o[0]} · ${ex}</span>`:lv==='medium'?`<span class="lab">${ex}</span>`:'');
  }
  // the word being learned, then its help line (English for Nepali learners, Devanagari for English learners)
  const pic=t.kind==='num'?`<span class="digit">${o[3]}</span>`:pictureOf(t,o),[w,help]=EN()?[o[2],o[1]]:[o[0],o[2]];
  const np=lv!=='hard'?`<span class="w">${esc(w)}</span>`:'';
  const en=lv==='easy'?`<span class="w-en"${EN()?' lang="ne"':''}>${esc(help)}</span>`:'';
  const hidden=lv==='hard'?`${w} · ${help}`:lv==='medium'?help:'';
  return pic+np+en+(hidden?`<span class="lab">${esc(hidden)}</span>`:'');
}
function renderQ(){

     <button class="again" id="again" aria-label="Say it again">🔊</button></div>

   <div class="opts ${kind}${opts.length===3?' three':''}" style="--cols:${opts.length}">${opts.map((o,k)=>`<button class="opt" data-k="${k}" style="animation-delay:${k*90}ms" aria-label="${esc(kind==='num'?o.it[0]:kind==='yesno'||kind==='ending'?o.it[0]:o.it[2])}">${face(o)}</button>`).join('')}</div>`;
  const ask=()=>{if(!hide)speech(rom,EN()&&e.lv!=='easy'?'':dev,en);else speech('Suna ra chhana!','सुन र छान!','Listen and choose!');
    if(kind==='pick')sayT(it[0],it[1],it[2]);else say(rom,dev,e.lv==='easy'||EN()?en:null);};

function qNext(q){if(screen!=='quiz'||(q&&q!==Q))return;Q.i++;if(Q.i<Q.n)renderQ();else endQuiz();}
function pick(b,o){
  if(Q.lock)return;
  const e=Q.entries[Q.i],{t,it}=e,p=P(),st=stat(p),key=keyOf(t,it),ans=Q.ans;
  if(o===ans){
    Q.lock=true;if(Q.tries===0){Q.stars++;st.right[key]=(st.right[key]||0)+1;save();}

    if($('#blankLine'))$('#blankLine').innerHTML=esc(it[4]).replace('___',`<span class="blank" style="color:var(--green);border-color:var(--green)">${it[5]}</span>`);
    const pr=rnd(PRAISE),w=t.kind==='yesno'?ans.it:it;
    speech(pr[0]+' '+cap(w[0])+'!',pr[1]+' '+w[1],pr[2]+' '+cap(w[2])+'!');say(pr[0]+' '+w[0],pr[1]+' '+w[1],EN()?pr[2]+' '+cap(w[2])+'!':null);
    const q=Q;setTimeout(()=>qNext(q),1900);
  }else{
    Q.tries++;b.classList.add('wrong','show');b.disabled=true;mood('sad');
    if(Q.tries===1){st.miss[key]=(st.miss[key]||0)+1;save();}
    const rb=main.querySelector(`.opt[data-k="${Q.opts.indexOf(ans)}"]`),left=[...main.querySelectorAll('.opt')].filter(x=>!x.disabled);

    // a check counts the first answer only

    else if(Q.tries>=2||left.length===1)show();

  }
}

   <div class="progwrap"><table class="prog"><thead><tr><th>Section</th>${Object.keys(ROUNDS).map(k=>`<th>${ROUNDS[k].icon} ${ROUNDS[k].en}</th>`).join('')}<th>✅ Check</th><th>🧠 Pairs</th></tr></thead>
    <tbody>${deckTopics.map(t=>`<tr><td>${t.id==='akshar'?'अ':t.icon} ${t.np} <small>${t.en}</small></td>${Object.keys(ROUNDS).map(k=>cell(t,k)).join('')}${ck(t)}<td>${bestOf(p,'jodi',t.id)?'★'.repeat(bestOf(p,'jodi',t.id)):'–'}</td></tr>`).join('')}</tbody></table></div>
   <p><b>Postcards to Hajuraama:</b> ${TRIP_ENDS.filter(te=>sentPostcard(p,te)).map(te=>`${te.souvenir.icon} ${te.place[2]} (sent ${p.postcards[te.id]})`).join(' · ')||'none yet: one is sent each time a map is finished'}</p>
   <p><b>Journey:</b> ${(()=>{const at=yatraAt(p);return starsOf(p)<GATE?`gate opens at ${GATE} ★ (${starsOf(p)} so far)`:at>=STOPS.length?'reached the mountains, every stop done':`stop ${at+1} of ${STOPS.length}, ${STOPS[at].r.icon} ${STOPS[at].r.np} (${STOPS[at].r.en.toLowerCase()}): ${esc(stopFace(STOPS[at])[3])}`;})()}</p>
   <p><b>Stories:</b> ${STORIES.filter(s=>!storyShelved(s.id)).map(s=>{const b=bestOf(p,'kathaa',s.id);return `${s.icon} ${s.np} ${s.choice?(b?`✓ ${b} of 2 endings`:'not yet'):b>=2?'✓ read + quiz'+(bestOf(p,'krama',s.id)?' + order':''):b?'✓ read':'not yet'}`;}).join(' · ')}</p>
   ${shelved('vakya')?'':`<p><b>Sentences:</b> ${V_ACTS.map(a=>`${a.icon} ${a.np} ${LV_KEYS.map(k=>`${LEVELS[k].icon}${bestOf(p,'vakya:'+a.id,k)}/${V_N}`).join(' ')}`).join(' · ')} · 🌱 grown ${grows().filter((_,i)=>bestOf(p,'badhau',i)).length}/${grows().length}</p>`}
   ${shelved('patti')?'':`<p><b>Flashcard baskets:</b> ${bx[0]} new or again · ${bx[1]} practising · ${bx[2]} known (of ${cards.length})</p>`}
   ${shelved('shabda')?'':`<p><b>Stickers:</b> ${stickers}/${stickerItems().length}</p>`}
   <p><b>Gems:</b> 💎 ${gemsOf(p)} to spend · ${ITEMS.filter(x=>owns(p,x)&&!x.free).length} of ${ITEMS.filter(x=>!x.free).length} shop things owned</p>
   ${shelved(AKSHAR().id)?'':`<p><b>Letters written:</b> ${traced.length?traced.join(' '):'none yet'}</p>`}
   <h3>Words to practise</h3>
   ${hard.length?`<div class="practise">${hard.map(x=>`<span>${x.f.t.kind==='color'?`<i class="dot" style="background:${x.f.it[3]}"></i>`:x.f.t.kind==='num'?x.f.it[3]:x.f.t.kind==='letter'?x.f.it[1]:x.f.it[3]} <b>${esc(x.f.it[0])}</b> ${esc(x.f.t.kind==='letter'?x.f.it[5]:x.f.it[2])} <small>missed ${x.miss}×</small></span>`).join('')}</div>`:'<p>Nothing stands out yet. Words show up here when they’re missed more often than they’re got right.</p>'}
   ${shelved('patti')||shelved('custom')?'':`<h3>Your flashcard deck for ${esc(p.name)}</h3>
   <p>Tick words for ${esc(p.name)} to practise. They appear in Patti as the “Thulo maanchhe” (grown-ups’) deck. ${custom.size} chosen.</p>
   <label>Topic <select id="cdTopic">${deckTopics.map(t=>`<option value="${t.id}">${t.id==='akshar'?'अ':t.icon} ${t.np} (${t.en})</option>`).join('')}</select></label>
   <div class="cd" id="cdWords"></div>`}`;
  const drawCd=()=>{const t=TOPICS.find(x=>x.id===$('#cdTopic').value);
    $('#cdWords').innerHTML=t.items.map(it=>{const k=keyOf(t,it);return `<label><input type="checkbox" data-key="${esc(k)}" ${custom.has(k)?'checked':''}> ${t.kind==='color'?`<i class="dot" style="background:${it[3]}"></i>`:t.kind==='num'?it[3]:t.kind==='letter'?it[1]:it[3]} ${esc(it[0])}</label>`;}).join('');
    $('#cdWords').querySelectorAll('input').forEach(c=>c.onchange=()=>{if(c.checked)custom.add(c.dataset.key);else custom.delete(c.dataset.key);p.custom=[...custom];save();});};
  if($('#cdTopic')){$('#cdTopic').onchange=drawCd;drawCd();}
}
// grown-ups panel
function renderGrown(){
  clearTry();screen='grown';
  const list=voices.filter(v=>/^(ne|hi|mr)/i.test(v.lang)),p=P();
  main.innerHTML=`<div class="grown">
    <h2>For grown-ups</h2>
    <p>The voice comes from this device’s browser. Microsoft Edge has real Nepali voices. Chrome usually uses its Hindi voice, which reads the Nepali (Devanagari) words closely. If no Nepali or Hindi voice is installed, the romanized spelling is read with an English voice, which sounds less accurate.</p>
    <p><b>Voice in use:</b> ${!TTS?'none (this browser cannot speak)':npVoice?`${esc(npVoice.name)} (${npVoice.lang})`:'no Nepali or Hindi voice found'}</p>
    ${list.length>1?`<label>Choose voice <select id="vSel">${list.map(v=>`<option value="${esc(v.name)}" ${npVoice&&v.name===npVoice.name?'selected':''}>${esc(v.name)} (${v.lang})</option>`).join('')}</select></label>`:''}
    <label><input type="checkbox" id="vEn" ${S.english?'checked':''}> Show and say the English too</label>
    <div class="speedrow"><b>Voice speed</b><div class="speeds" role="radiogroup" aria-label="Voice speed">${(()=>{const cur=SPEEDS.reduce((a,s)=>Math.abs(s[2]-S.rate)<Math.abs(a[2]-S.rate)?s:a);
      return SPEEDS.map(s=>`<button type="button" role="radio" aria-checked="${s===cur}" data-r="${s[2]}"><b>${s[0]}</b><small>${s[1]}</small></button>`).join('');})()}</div></div>
    <div class="btns" style="justify-content:flex-start">
      <button class="btn" style="background:var(--red)" id="vTest">🔊 Test voice</button>
      <button class="btn" style="background:var(--blue)" id="vDone">Done</button>
    </div>
    <h2>Progress</h2>
    ${S.profiles.length?`<label>Player <select id="progSel">${S.profiles.map(x=>`<option value="${x.id}" ${p&&x.id===p.id?'selected':''}>${x.icon} ${esc(x.name)}</option>`).join('')}</select></label>
    <div id="progBody"></div>`:'<p>No players yet.</p>'}
    <h2>Levels</h2>
    <table class="lvtable">${LV_KEYS.map(k=>`<tr><th>${LEVELS[k].icon} ${LEVELS[k].np} (${LEVELS[k].en})</th><td>${LEVELS[k].n} questions, ${LEVELS[k].about}.</td></tr>`).join('')}</table>
    <p>A level’s medal on the home screen lights up at 70% of its stars. Each player keeps their own stars and chosen levels. Everything is saved in this browser only.</p>
    ${p?`<div class="btns" style="justify-content:flex-start"><button class="btn ghost" id="resetP">Reset ${esc(p.name)}’s stars</button></div><div class="warn" id="resetBox" hidden><b>Clear every star ${esc(p.name)} has earned?</b><div class="btns" style="justify-content:flex-start"><button class="btn" style="background:var(--red)" id="resetYes">Yes, clear</button><button class="btn ghost" id="resetNo">Keep</button></div></div>`:''}
  </div>`;
  if($('#progSel')){const show=()=>renderProgress(S.profiles.find(x=>x.id===$('#progSel').value));$('#progSel').onchange=show;show();}
  $('#vSel')&&($('#vSel').onchange=e=>{S.voice=e.target.value;save();loadVoices();});
  $('#vEn').onchange=e=>{S.english=e.target.checked;save();};
  main.querySelectorAll('.speeds button').forEach(b=>b.onclick=()=>{S.rate=+b.dataset.r;save();
    main.querySelectorAll('.speeds button').forEach(x=>x.setAttribute('aria-checked',String(x===b)));
    say('Namaste! Ma Habre hu.','नमस्ते! म हाब्रे हुँ।',null);});
  $('#vTest').onclick=()=>say('Namaste! Ma Habre hu.','नमस्ते! म हाब्रे हुँ।','Hello! I am Habre.');
  $('#vDone').onclick=()=>openMap();
  if(p){
    $('#resetP').onclick=()=>{$('#resetBox').hidden=false;$('#resetNo').focus();};
    $('#resetNo').onclick=()=>{$('#resetBox').hidden=true;};
    $('#resetYes').onclick=()=>{p.best={};p.rw=0;save();renderTop();renderGrown();};
  }
}

$('#homeBtn').onclick=()=>openMap();
$('#collBtn').onclick=()=>openCollection();
$('#whoBtn').onclick=goWho;
$('#grownBtn').onclick=renderGrown;
$('#gemBtn').onclick=()=>{if(P())openShop();};
function renderSound(){const b=$('#soundBtn');b.setAttribute('aria-pressed',String(S.sound));b.setAttribute('aria-label',S.sound?'Sound on':'Sound off');b.textContent=S.sound?'🔊':'🔇';}
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();renderSound();if(!S.sound)speechSynthesis?.cancel?.();};
scriptObs.observe(document.querySelector('.app'),{subtree:true,childList:true,characterData:true});
save();renderSound();renderTop();
// with more than one player (or none yet), ask who is playing first
if(S.profiles.length===1&&P())openMap();else goWho();
</script>
</body>
</html>
