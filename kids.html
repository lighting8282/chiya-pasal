<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habre's Nepali</title>
<meta name="description" content="A picture-and-voice Nepali game for children, with Habre the red panda.">
<meta name="theme-color" content="#e8463a">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one bright playroom screen. Habre (mascot) on the left talks; big tap cards fill the rest. Single sunny theme on purpose. */
:root{
  color-scheme:light;
  --sky:#dcf1ff; --sky-2:#f4fbff; --ink:#2b2140; --soft:#6a6280; --card:#ffffff; --line:#cfe3f2;
  --red:#e8463a; --red-dark:#b8321f; --yellow:#ffc93c; --green:#2fae6e; --blue:#3a7bf2; --purple:#8e5be8; --pink:#ff7eb6;
  --good:#2fae6e; --bad:#e8463a;
  --f:'Baloo 2','Nirmala UI','Mangal',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--sky)}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--sky-2),var(--sky) 60%);color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.3;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.app{max-width:980px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;display:flex;flex-direction:column;gap:14px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.home{background:var(--card);border-radius:999px;padding:6px 16px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.title{font-weight:800;font-size:1.6rem;color:var(--red);margin-right:auto;line-height:1}
.title small{display:block;font-size:.8rem;color:var(--soft);font-weight:500}
.who{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:3px 14px 3px 4px;font-weight:800;box-shadow:0 4px 0 var(--line);max-width:200px}
.who .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:var(--sky)}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{background:var(--yellow);border-radius:999px;padding:4px 14px;font-weight:800;box-shadow:0 4px 0 #e0a800;font-variant-numeric:tabular-nums}
.round{width:52px;height:52px;border-radius:50%;background:var(--card);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;font-size:1.5rem}
.round[aria-pressed="false"]{opacity:.55}

/* stage */
.stage{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.buddy{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.speech{background:var(--card);border-radius:22px;padding:10px 14px;text-align:center;box-shadow:0 5px 0 var(--line);position:relative;min-height:74px;width:100%;display:flex;flex-direction:column;justify-content:center}
.speech::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-12px;border:12px solid transparent;border-top-color:var(--card);border-bottom:0}
.speech b{font-size:1.25rem;display:block;line-height:1.15}
.speech .dev{font-size:1rem;color:var(--soft)}
.speech .en{font-size:.85rem;color:var(--soft)}
.habre{width:180px;height:190px;cursor:pointer}
.habre svg{width:100%;height:100%;overflow:visible}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}

/* habre animation */
.hb-body{transform-origin:80px 160px;animation:bob 2.6s ease-in-out infinite}
.hb-tail{transform-origin:112px 140px;animation:wag 1.8s ease-in-out infinite}
.hb-eyes{transform-origin:80px 64px;animation:blink 4.2s infinite}
.hb-mouth{transform-origin:80px 86px;transition:transform .1s}
.talking .hb-mouth{animation:talk .22s ease-in-out infinite alternate}
.happy .hb-body{animation:jump .7s cubic-bezier(.3,1.6,.5,1) 2}
.happy .hb-armL{transform-origin:50px 120px;animation:waveL .35s ease-in-out 4 alternate}
.happy .hb-armR{transform-origin:110px 120px;animation:waveR .35s ease-in-out 4 alternate}
.sad .hb-head{transform-origin:80px 100px;animation:tilt 1s ease-in-out}
.wave .hb-armR{transform-origin:110px 120px;animation:waveR .4s ease-in-out 6 alternate}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes wag{50%{transform:rotate(12deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes talk{to{transform:scaleY(1.9)}}
@keyframes jump{40%{transform:translateY(-34px) scale(1.04,.96)}70%{transform:translateY(0) scale(1.06,.94)}}
@keyframes waveL{to{transform:rotate(-38deg)}}
@keyframes waveR{to{transform:rotate(38deg)}}
@keyframes tilt{30%,70%{transform:rotate(-10deg)}}

/* screens */
h1{margin:0;font-size:2rem;line-height:1.1;text-wrap:balance}
h1 small{display:block;font-size:1rem;color:var(--soft);font-weight:500}
h2.sub{margin:0;font-size:1.2rem}
h2.sub small{font-size:.9rem;color:var(--soft);font-weight:500;margin-left:6px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.topic{background:var(--card);border-radius:26px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 7px 0 var(--tc,var(--line));transition:transform .12s;animation:pop .45s cubic-bezier(.3,1.5,.5,1) backwards}
.topic:hover{transform:translateY(-3px)}
.topic:active{transform:translateY(4px);box-shadow:0 3px 0 var(--tc)}
.topic .ic{font-size:3.2rem;line-height:1.1}
.topic b{font-size:1.45rem;line-height:1}
.topic .dev{color:var(--soft)}
.topic .en{font-size:.85rem;color:var(--soft)}
.medals{display:flex;gap:4px;font-size:1.1rem;margin-top:2px}
.medals span{filter:grayscale(1);opacity:.3}
.medals span.on{filter:none;opacity:1}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lv{background:var(--card);border-radius:22px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 5px 0 var(--line);border:4px solid transparent}
.lv span{font-size:2rem;line-height:1.1}
.lv b{font-size:1.2rem;line-height:1.1}
.lv small{font-size:.8rem;color:var(--soft)}
.lv .best{font-weight:700;color:#b98900}
.lv[aria-pressed="true"]{border-color:var(--lc);box-shadow:0 5px 0 var(--lc)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cards{background:#00a6b8}
.rule{display:flex;gap:10px;align-items:center;text-align:left;background:#fff7d6;border-radius:20px;padding:10px 14px;box-shadow:0 4px 0 #f0d77a}
.rule>span:first-child{font-size:2rem}
.rule b{display:block;font-size:1.05rem;line-height:1.25}
.rule small{color:var(--soft);font-size:.95rem}
/* picture grammar */
.sz-l{font-size:1.25em;display:inline-block}
.sz-s{font-size:.5em;display:inline-block}
.place{display:inline-flex;align-items:center;justify-content:center;font-size:.62em;line-height:1}
.place.v{flex-direction:column}
.place.h{gap:.6em}
.place.in{position:relative}
.place.in .inner{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:.5em}
/* kids flashcards */
.kfc{display:block;width:100%;border:0;background:none;padding:0;perspective:1200px;min-height:300px}
.kfc-in{position:relative;display:block;width:100%;min-height:300px;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.kfc.flipped .kfc-in{transform:rotateY(180deg)}
.kfc-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;border-radius:32px;background:var(--card);box-shadow:0 8px 0 var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}
.kfc-back{transform:rotateY(180deg);background:#fff7d6;box-shadow:0 8px 0 #f0d77a}
.kfc-face .pic{font-size:6rem;line-height:1.1}
.kfc-face b{font-size:2.4rem;line-height:1.1}
.kfc-face .dev{font-size:1.5rem;color:var(--soft)}
.kfc-face .en{font-size:1rem;color:var(--soft)}
.kfc-face .hint{position:absolute;bottom:12px;font-size:.9rem;color:var(--soft)}
.kfc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.kfc-top label{display:flex;align-items:center;gap:6px;font-weight:500;font-size:.95rem}
.kfc-top input{width:22px;height:22px;accent-color:var(--red)}
@media (prefers-reduced-motion: reduce){.kfc-in{transition:none}}
.mode{border-radius:28px;padding:20px 12px;color:#fff;font-weight:800;font-size:1.6rem;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.18);animation:pop .45s cubic-bezier(.3,1.5,.5,1) backwards}
.mode span{font-size:3rem;line-height:1}
.mode small{font-size:.95rem;font-weight:500;opacity:.92}
.mode:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.learn{background:var(--blue)} .play{background:var(--green)}

/* profiles */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.person{position:relative;background:var(--card);border-radius:26px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 7px 0 var(--pc,var(--line));animation:pop .45s cubic-bezier(.3,1.5,.5,1) backwards}
.person .av{font-size:3.6rem;line-height:1.1}
.person b{font-size:1.3rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person small{color:#b98900;font-weight:700}
.person.add{box-shadow:0 7px 0 var(--line);border:3px dashed var(--line)}
.person.add .av{color:var(--soft)}
.edit-row{display:flex;gap:8px;justify-content:center;margin-top:4px}
.mini{border-radius:999px;padding:2px 12px;font-size:.9rem;font-weight:700;background:var(--sky);box-shadow:0 3px 0 var(--line)}
.mini.del{color:var(--red)}
.form{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 7px 0 var(--line);display:flex;flex-direction:column;gap:12px}
.form label{font-weight:800;font-size:1.1rem}
.form input[type=text]{font:inherit;font-size:1.4rem;padding:8px 14px;border-radius:16px;border:3px solid var(--line);width:100%;max-width:360px}
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.avatars button{font-size:2.4rem;height:68px;border-radius:18px;background:var(--sky);border:4px solid transparent}
.avatars button[aria-pressed="true"]{border-color:var(--red);background:#ffe9e6}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.warn{background:#fff1ef;border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}

/* learn card */
.big{background:var(--card);border-radius:32px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 var(--line);text-align:center;min-height:300px;justify-content:center}
.big .pic{font-size:7rem;line-height:1.1;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.big b{font-size:2.6rem;line-height:1}
.big .dev{font-size:1.5rem;color:var(--soft)}
.big .en{font-size:1rem;color:var(--soft)}
.swatch{width:150px;height:150px;border-radius:44% 56% 52% 48%/50% 44% 56% 50%;border:5px solid rgba(0,0,0,.08);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.count{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:2.6rem;max-width:360px;line-height:1.1}
.count.many{font-size:1.8rem;max-width:300px}
.count.tens{flex-direction:column;align-items:flex-start;gap:2px;font-size:1.15rem;max-width:none}
.ten-row{display:flex;gap:2px;padding:1px 6px;border-radius:10px;background:var(--sky)}
.count i{font-style:normal;animation:drop .4s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes drop{from{transform:translateY(-40px) scale(.4);opacity:0}}
.digit{font-size:4rem;font-weight:800;line-height:1;color:var(--blue)}
.nav{display:flex;gap:12px;justify-content:center;align-items:center}
.arrow{width:76px;height:76px;border-radius:50%;background:var(--yellow);font-size:2rem;font-weight:800;box-shadow:0 6px 0 #e0a800}
.arrow:active{transform:translateY(4px);box-shadow:0 2px 0 #e0a800}
.listen{background:var(--red);color:#fff;border-radius:999px;padding:12px 26px;font-weight:800;font-size:1.3rem;box-shadow:0 6px 0 var(--red-dark)}
.listen:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red-dark)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}

/* quiz */
.q{background:var(--card);border-radius:26px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 0 var(--line)}
.q .say{font-size:1.8rem;font-weight:800;line-height:1.1}
.q .say small{display:block;font-size:1rem;color:var(--soft);font-weight:500}
.q .again{margin-left:auto;flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;font-size:1.8rem;box-shadow:0 5px 0 var(--red-dark)}
.q.listenonly .again{width:84px;height:84px;font-size:2.4rem;animation:glow 1s ease-in-out infinite alternate}
.progress{height:16px;border-radius:99px;background:var(--card);overflow:hidden;box-shadow:inset 0 2px 0 var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),#ff9f1c);border-radius:99px;transition:width .4s}
.opts{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:14px}
.opt{background:var(--card);border-radius:28px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 7px 0 var(--line);animation:pop .4s cubic-bezier(.3,1.5,.5,1) backwards;transition:transform .12s}
.opt:active{transform:translateY(4px)}
.opt .pic{font-size:5rem;line-height:1.1}
.opt .swatch{width:110px;height:110px}
.opt .digit{font-size:3.6rem}
.opt .w{font-size:1.2rem;font-weight:700;line-height:1.1}
.opt .w-en{font-size:.95rem;color:var(--soft);line-height:1.1}
.opt .lab{font-size:.85rem;color:var(--soft);visibility:hidden}
.opt.right{box-shadow:0 7px 0 var(--good),0 0 0 6px var(--good);animation:yay .6s cubic-bezier(.3,1.6,.5,1)}
.opt.right .lab,.opt.show .lab{visibility:visible}
.opt.wrong{animation:shake .5s;opacity:.55}
.opt.hint{box-shadow:0 7px 0 var(--good),0 0 0 6px var(--yellow);animation:glow 1s ease-in-out infinite alternate}
@keyframes yay{40%{transform:scale(1.15) rotate(-4deg)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes glow{to{transform:scale(1.05)}}
.counter{background:var(--card);border-radius:26px;padding:12px;box-shadow:0 6px 0 var(--line);display:flex;justify-content:center}

/* end */
.end{background:var(--card);border-radius:32px;padding:24px;text-align:center;box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:8px}
.end .trophy{font-size:6rem;line-height:1;animation:jump .8s cubic-bezier(.3,1.6,.5,1) 2}
.end .row{font-size:2.2rem;letter-spacing:3px;line-height:1.2}
.end .row .off{filter:grayscale(1);opacity:.3}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{border-radius:999px;padding:12px 24px;font-weight:800;font-size:1.2rem;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line)}

/* grown-ups */
.grown{background:var(--card);border-radius:24px;padding:16px 18px;box-shadow:0 6px 0 var(--line);display:grid;gap:10px;font-size:1rem}
.grown h2{margin:0;font-size:1.3rem}
.grown p{margin:0;color:var(--soft)}
.grown label{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grown select{font:inherit;font-size:1rem;padding:4px 8px;border-radius:10px;border:2px solid var(--line);max-width:100%}
.grown input[type=checkbox]{width:22px;height:22px;accent-color:var(--red)}
.grown input[type=range]{accent-color:var(--red)}
.progwrap{overflow-x:auto}
.prog{border-collapse:collapse;font-size:.92rem;width:100%}
.prog th,.prog td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.prog th{color:var(--soft);font-weight:500}
.prog td small{color:var(--soft)}
.prog td.pass{color:var(--good);font-weight:800}
.prog td.some{color:#b98900;font-weight:700}
.practise{display:flex;flex-wrap:wrap;gap:8px}
.practise span{background:var(--sky);border-radius:999px;padding:4px 12px;font-size:.95rem}
.practise small{color:var(--soft)}
.practise .dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;border:1px solid var(--line)}
/* letters and stories */
.letter{font-family:'Mukta','Nirmala UI','Mangal',var(--f);font-size:6.5rem;line-height:1.05;font-weight:700;color:var(--ink);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.opt .letter{font-size:4rem}
.ex{font-size:1.1rem;color:var(--soft)}
.ex b{font-size:1.2rem;color:var(--ink)}
.write{align-self:center;background:var(--purple);box-shadow:0 6px 0 #6a3fbe}
.trace{position:relative;width:min(300px,82vw);aspect-ratio:1;margin:0 auto;background:var(--card);border-radius:24px;box-shadow:0 6px 0 var(--line);overflow:hidden}
.trace canvas{position:absolute;inset:0;width:100%;height:100%}
#trInk{touch-action:none;cursor:crosshair}
#traceBox{display:flex;flex-direction:column;gap:12px;align-items:center}
.story .story-pic{font-size:5.5rem;line-height:1.15;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.story b{font-size:1.9rem;line-height:1.2;text-wrap:balance}
.arrow:disabled{opacity:.35}
.speedrow{display:flex;flex-direction:column;gap:6px}
.speeds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.speeds button{display:flex;flex-direction:column;align-items:center;background:var(--sky);border:3px solid transparent;border-radius:16px;padding:6px 4px;line-height:1.15;box-shadow:0 3px 0 var(--line)}
.speeds button small{color:var(--soft);font-size:.8rem}
.speeds button[aria-checked="true"]{border-color:var(--red);background:#fff}
@media (max-width:680px){.speeds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lvtable{border-collapse:collapse;font-size:.95rem}
.lvtable td,.lvtable th{padding:4px 10px 4px 0;text-align:left;vertical-align:top}
.lvtable th{color:var(--soft);font-weight:500}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall var(--d) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}

@media (max-width:680px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .buddy{position:static;flex-direction:row;align-items:center}
  .habre{width:110px;height:118px;flex:0 0 auto}
  .speech{order:2}
  .speech::after{left:-10px;top:50%;bottom:auto;margin:-10px 0 0;border:10px solid transparent;border-right-color:var(--card);border-left:0}
  .opts{gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .opt{min-height:130px;border-radius:22px}
  .opt .pic{font-size:3.6rem}
  .opt .swatch{width:76px;height:76px}
  .big .pic{font-size:5.5rem}
  .topics,.people{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .topic .ic{font-size:2.6rem}
  .modes{gap:8px}
  .mode{font-size:1.15rem;padding:14px 4px;border-radius:22px}
  .mode span{font-size:2.2rem}
  .mode small{font-size:.75rem}
  .q .say{font-size:1.4rem}
  .who .nm{max-width:70px}
  .title{font-size:1.3rem}
}

// say a Nepali line (Devanagari for a Nepali/Hindi voice, romanized otherwise), then optionally the English
function say(rom,dev,en){
  if(!TTS||!S.sound)return;
  try{
    speechSynthesis.cancel();
    const h=$('#habre'),stop=()=>h.classList.remove('talking');
    const u=new SpeechSynthesisUtterance(npVoice?dev:rom);
    if(npVoice){u.voice=npVoice;u.lang=npVoice.lang;}
    u.rate=S.rate;u.pitch=1.15;
    u.onstart=()=>h.classList.add('talking');u.onend=stop;u.onerror=stop;
    speechSynthesis.speak(u);
    if(en&&S.english){
      const e=new SpeechSynthesisUtterance(en);
      if(enVoice){e.voice=enVoice;e.lang=enVoice.lang;}
      e.rate=Math.min(1,S.rate+0.1);e.pitch=1.1;
      e.onstart=()=>h.classList.add('talking');e.onend=stop;e.onerror=stop;
      speechSynthesis.speak(e);
    }
  }catch(err){}
}

function pictureOf(t,it){

  return `<span class="pic">${it[3]}</span>`;
}
// the words a level uses
function wordsFor(t,lv){
  const L=LEVELS[lv];
  if(t.tiers)return t.items.filter(it=>it[4]<=LV_KEYS.indexOf(lv)+1);
  if(t.kind==='num')return t.items.filter(it=>it[3]<=L.count);
  return t.items.slice(0,Math.min(L.words,t.items.length));
}
function countHtml(n,pic,cls){
  // more than 20: rows of ten, so tens can be counted at a glance
  if(n>20){
    const rows=[];for(let r=0;r<n;r+=10)rows.push(Math.min(10,n-r));
    return `<div class="count tens" ${cls||''}>${rows.map((k,r)=>`<div class="ten-row">${Array.from({length:k},()=>`<i style="animation-delay:${Math.min(r,9)*90}ms">${pic}</i>`).join('')}</div>`).join('')}</div>`;
  }
  return `<div class="count${n>10?' many':''}" ${cls||''}>${Array.from({length:n},(_,i)=>`<i style="animation-delay:${Math.min(i,14)*80}ms">${pic}</i>`).join('')}</div>`;
}

let KF=null;
function startKCards(t,back,only){
  const cards=only||wordsFor(t,levelOf(t.id));
  KF={t,back,queue:shuffle(cards),total:cards.length,missed:new Set(),flipped:false,wordFirst:!!S.wordFirst};
  drawKCard();
}
function kPicture(t,it){
  if(t.kind==='num')return countHtml(it[3],COUNT_PICS[it[3]%COUNT_PICS.length],'aria-hidden="true"');
  if(t.kind==='letter')return `${pictureOf(t,it)}<span class="pic" style="font-size:3rem">${it[3]}</span>`;
  return pictureOf(t,it);
}
function drawKCard(){
  screen='kcards';const {t}=KF,it=KF.queue[0];
  if(!it){
    const again=[...KF.missed];confetti();mood('happy');
    main.innerHTML=`<div class="end"><div class="trophy" aria-hidden="true">🃏</div>
     <h1>Sakiyo!<small>${t.np} · ${KF.total} cards · ${KF.total-again.length} you knew straight away</small></h1>
     <div class="btns">${again.length?`<button class="btn" style="background:var(--yellow);color:var(--ink)" id="kMissed">🔁 Missed ones (${again.length})</button>`:''}
      <button class="btn" style="background:var(--green)" id="kAgain">🃏 Pheri <small style="font-weight:500">again</small></button>
      <button class="btn" style="background:var(--red)" id="kBack">⌂ Back</button></div></div>`;
    if(again.length)$('#kMissed').onclick=()=>startKCards(t,KF.back,again);
    $('#kAgain').onclick=()=>startKCards(t,KF.back);
    $('#kBack').onclick=()=>{const b=KF.back;KF=null;b();};
    speech('Sakiyo! Syabaas!','सकियो! स्याबास!','All done! Well done!');say('Sakiyo! Syabaas!','सकियो! स्याबास!',null);return;
  }
  const isL=t.kind==='letter',pic=kPicture(t,it);
  const word=`<b>${isL?it[0]:it[0]}</b><span class="dev" lang="ne">${isL?it[1]+' · '+it[6]:it[1]}</span>${S.english?`<span class="en">${isL?it[5]+' = '+it[7]:it[2]}</span>`:''}`;
  const front=KF.wordFirst?word:pic,back=KF.wordFirst?pic+`<span class="en">${isL?it[5]:it[2]}</span>`:pic+word;
  const pos=KF.total-KF.queue.length+1;
  main.innerHTML=`<div class="kfc-top"><span>${t.icon} ${t.np} · ${Math.min(pos,KF.total)}/${KF.total}</span><label><input type="checkbox" id="kWordFirst" ${KF.wordFirst?'checked':''}> Word first</label></div>
   <button class="kfc ${KF.flipped?'flipped':''}" id="kCard" type="button" aria-label="Tap to flip">
    <span class="kfc-in"><span class="kfc-face">${front}<span class="hint">${KF.wordFirst?'What does it mean? Tap to flip!':'Can you say it in Nepali? Tap to flip!'}</span></span><span class="kfc-face kfc-back">${back}</span></span></button>
   <div class="nav">
    <button class="btn" style="background:var(--yellow);color:var(--ink)" id="kNo">🔁 Pheri <small style="font-weight:500">again</small></button>
    <button class="listen" id="kSay" aria-label="Listen">🔊</button>
    <button class="btn" style="background:var(--green)" id="kYes">⭐ Aayo! <small style="font-weight:500">I knew it</small></button>
   </div>`;
  const hear=()=>{if(isL)say(it[0]+', '+it[5],`${it[1]}। ${it[6]}`,null);else say(it[0],it[1],null);};
  if(KF.wordFirst)hear();
  $('#kCard').onclick=()=>{KF.flipped=!KF.flipped;$('#kCard').classList.toggle('flipped',KF.flipped);if(KF.flipped&&!KF.wordFirst){hear();mood('happy');}};
  $('#kSay').onclick=hear;
  $('#kWordFirst').onchange=e=>{KF.wordFirst=e.target.checked;S.wordFirst=KF.wordFirst;save();KF.flipped=false;drawKCard();};
  $('#kYes').onclick=()=>kDone(true);$('#kNo').onclick=()=>kDone(false);
  speech(t.np,t.dev,KF.wordFirst?'What does it mean?':'What is it called?');
}
function kDone(ok){
  const it=KF.queue.shift(),first=!KF.missed.has(it),p=P(),key=KF.t.id+'|'+it[0];
  if(p&&first){p.stat=p.stat||{plays:0,right:{},miss:{}};const s=ok?p.stat.right:p.stat.miss;s[key]=(s[key]||0)+1;save();}
  if(ok){mood('happy');}else{KF.missed.add(it);KF.queue.splice(Math.min(3,KF.queue.length),0,it);mood('sad');}
  KF.flipped=false;drawKCard();
}

// ---------- letter tracing ----------
// the child traces over a faint letter; it counts when the ink covers most of the letter and stays mostly inside it
function openTrace(it){
  const box=$('#traceBox');box.hidden=false;
  box.innerHTML=`<div class="trace"><canvas id="trGuide" aria-hidden="true"></canvas><canvas id="trInk" aria-label="Trace the letter ${it[1]} with your finger"></canvas></div>
   <div class="btns"><button class="btn ghost" id="trClear">↺ Pheri <small style="font-weight:500">again</small></button><button class="btn" style="background:var(--green)" id="trDone">✔ Sakiyo <small style="font-weight:500">done</small></button></div>`;
  const wrap=box.querySelector('.trace'),size=Math.round(wrap.getBoundingClientRect().width)||260,dpr=window.devicePixelRatio||1;
  const g=$('#trGuide'),k=$('#trInk');[g,k].forEach(c=>{c.width=size*dpr;c.height=size*dpr;});
  const gx=g.getContext('2d'),kx=k.getContext('2d');gx.scale(dpr,dpr);kx.scale(dpr,dpr);
  // a 1x copy of the ink for checking
  const ink=document.createElement('canvas');ink.width=ink.height=size;const ix=ink.getContext('2d');
  const font=`700 ${Math.round(size*0.6)}px 'Baloo 2','Nirmala UI','Mangal',sans-serif`,cy=size*0.56;
  const drawGuide=()=>{gx.clearRect(0,0,size,size);gx.font=font;gx.textAlign='center';gx.textBaseline='middle';
    gx.fillStyle='#e6f1fb';gx.fillText(it[1],size/2,cy);gx.setLineDash([5,6]);gx.lineWidth=2;gx.strokeStyle='#9fbfdc';gx.strokeText(it[1],size/2,cy);};
  (document.fonts&&document.fonts.load?document.fonts.load(font):Promise.resolve()).then(drawGuide,drawGuide);
  const lw=size*0.08;
  [kx,ix].forEach(c=>{c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#e8463a';});
  let down=false,last=null,won=false;
  const pt=e=>{const r=k.getBoundingClientRect();return [(e.clientX-r.left)*size/r.width,(e.clientY-r.top)*size/r.height];};
  const line=(a,b)=>[kx,ix].forEach(c=>{c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();});
  k.onpointerdown=e=>{down=true;k.setPointerCapture(e.pointerId);last=pt(e);line(last,last);};
  k.onpointermove=e=>{if(!down)return;const p=pt(e);line(last,p);last=p;};
  k.onpointerup=k.onpointercancel=()=>{if(!down)return;down=false;if(!won&&check(false))celebrate();};
  function check(loud){
    const m=document.createElement('canvas');m.width=m.height=size;const mx=m.getContext('2d');
    mx.font=font;mx.textAlign='center';mx.textBaseline='middle';mx.fillStyle='#000';mx.fillText(it[1],size/2,cy);
    const d=document.createElement('canvas');d.width=d.height=size;const dx=d.getContext('2d');
    dx.font=font;dx.textAlign='center';dx.textBaseline='middle';dx.fillText(it[1],size/2,cy);dx.lineWidth=lw*1.6;dx.lineJoin='round';dx.strokeText(it[1],size/2,cy);
    const M=mx.getImageData(0,0,size,size).data,D=dx.getImageData(0,0,size,size).data,I=ix.getImageData(0,0,size,size).data;
    let letter=0,covered=0,inkN=0,out=0;
    for(let i=3;i<M.length;i+=4*3){const inL=M[i]>100,inI=I[i]>100;if(inL){letter++;if(inI)covered++;}if(inI){inkN++;if(D[i]<60)out++;}}
    const cov=letter?covered/letter:0,outside=inkN?out/inkN:1;
    if(cov>=0.5&&outside<=0.35)return true;
    if(loud){
      if(cov<0.5){speech('Pura lekha!','पूरा लेख!','Trace all of it!');say('Pura lekha!','पूरा लेख!','Trace all of it!');}
      else{speech('Rekha bhitra lekha!','रेखा भित्र लेख!','Stay inside the lines!');say('Rekha bhitra lekha!','रेखा भित्र लेख!','Stay inside the lines!');}
      mood('sad');
    }
    return false;
  }
  function celebrate(){
    won=true;confetti();mood('happy');
    const p=P();if(p){p.traced=p.traced||{};p.traced[it[1]]=(p.traced[it[1]]||0)+1;save();}
    speech('Syabaas! '+it[0]+'!','स्याबास! '+it[1],'You wrote '+it[0]+'!');say('Syabaas! '+it[0],'स्याबास! '+it[1],null);
  }
  $('#trClear').onclick=()=>{kx.clearRect(0,0,size,size);ix.clearRect(0,0,size,size);won=false;};
  $('#trDone').onclick=()=>{if(won||check(true))celebrate();};
  speech('Lekhaun!','लेखौं!','Trace the letter with your finger.');say('Lekhaun!','लेखौं!','Trace the letter with your finger.');
  wrap.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});
}

// play: a round of questions with 2, 3 or 4 big choices
function questionLine(t,it){
  if(t.kind==='num')return ['Kati wota?','कति वटा?','How many?'];
  if(t.q==='kun')return [`${cap(it[0])} kun ho?`,`${it[1]} कुन हो?`,`Which one is ${it[2]}?`];
  if(t.q==='phrase')return [`“${cap(it[0])}” — kun chitra?`,`“${it[1]}” — कुन चित्र?`,`Which picture means “${it[2]}”?`];
  if(t.kind==='letter')return [`“${it[0]}” kun akshar?`,`${it[1]}। ${it[1]} कुन अक्षर?`,`Which letter says “${it[0]}”?`];
  return [`${cap(it[0])} kahaa cha?`,`${it[1]} कहाँ छ?`,`Where is the ${it[2]}?`];
}
function startQuiz(){
  const t=topic,lv=levelOf(t.id),L=LEVELS[lv],words=wordsFor(t,lv),order=[];
  while(order.length<L.n)order.push(...shuffle(words));
  // never the same answer twice in a row
  for(let i=1;i<L.n;i++)if(order[i]===order[i-1]){const j=order.findIndex((x,k)=>k>i&&x!==order[i-1]);if(j>0)[order[i],order[j]]=[order[j],order[i]];}
  Q={t,lv,L,words,order:order.slice(0,L.n),i:0,stars:0,tries:0,lock:false};
  renderQ();
}
// for counting, wrong numbers sit close to the right one so the child really counts
function distractors(t,it,words,n){
  if(t.kind!=='num')return shuffle(words.filter(x=>x!==it)).slice(0,n);
  const near=shuffle(words.filter(x=>x!==it&&Math.abs(x[3]-it[3])<=3));
  const far=shuffle(words.filter(x=>x!==it&&Math.abs(x[3]-it[3])>3));
  return [...near,...far].slice(0,n);
}
// what an answer button shows: easy = picture + Nepali + English, medium = picture + Nepali, hard = picture only.
// Whatever is hidden is revealed (.lab) once the button is answered.
function optionFace(t,o,lv){
  if(t.kind==='letter'){
    const ex=`${o[3]} ${o[5]}`;
    return pictureOf(t,o)+(lv!=='hard'?`<span class="w">${o[0]}</span>`:'')+(lv==='easy'?`<span class="w-en">${ex}</span>`:'')
      +(lv==='hard'?`<span class="lab">${o[0]} · ${ex}</span>`:lv==='medium'?`<span class="lab">${ex}</span>`:'');
  }
  const pic=t.kind==='num'?`<span class="digit">${o[3]}</span>`:pictureOf(t,o);
  const np=lv!=='hard'?`<span class="w">${o[0]}</span>`:'';
  const en=lv==='easy'?`<span class="w-en">${o[2]}</span>`:'';
  const hidden=lv==='hard'?`${o[0]} · ${o[2]}`:lv==='medium'?o[2]:'';
  return pic+np+en+(hidden?`<span class="lab">${hidden}</span>`:'');
}
function renderQ(){
  screen='quiz';const {t,L}=Q,it=Q.order[Q.i];Q.tries=0;Q.lock=false;
  const opts=shuffle([it,...distractors(t,it,Q.words,L.choices-1)]);
  const [rom,dev,en]=questionLine(t,it);
  const hide=L.listen&&canListen()&&t.kind!=='num';
  const pic=rnd(COUNT_PICS);
  main.innerHTML=`<div class="progress" aria-label="Question ${Q.i+1} of ${L.n}"><i style="width:${Q.i/L.n*100}%"></i></div>
   <div class="q${hide?' listenonly':''}"><div class="say" id="qSay">${hide?`Suna ra chhana! <small>सुन र छान · Listen and choose</small>`:`${rom}<small lang="ne">${dev}${S.english&&Q.lv==='easy'?` · ${en}`:''}</small>`}</div>
     <button class="again" id="again" aria-label="Say it again">🔊</button></div>
   ${t.kind==='num'?`<div class="counter">${countHtml(it[3],pic,`aria-label="${it[3]} things"`)}</div>`:''}
   <div class="opts${L.choices===3?' three':''}" style="--cols:${L.choices}">${opts.map((o,k)=>`<button class="opt" data-k="${k}" style="animation-delay:${k*90}ms" aria-label="${t.kind==='num'?o[0]:o[2]}">
     ${optionFace(t,o,Q.lv)}</button>`).join('')}</div>`;
  const ask=()=>{if(!hide)speech(rom,dev,en);else speech('Suna ra chhana!','सुन र छान!','Listen and choose!');say(rom,dev,Q.lv==='easy'?en:null);};
  $('#again').onclick=ask;
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,opts[+b.dataset.k],it,[rom,dev,en]));
  ask();
}
function pick(b,o,it,line){
  if(Q.lock)return;
  const pr=P(),stat=pr?(pr.stat=pr.stat||{plays:0,right:{},miss:{}}):null,key=Q.t.id+'|'+it[0];
  if(o===it){
    Q.lock=true;if(Q.tries===0){Q.stars++;if(stat)stat.right[key]=(stat.right[key]||0)+1;}
    b.classList.add('right');confetti();mood('happy');
    $('#qSay').innerHTML=`${line[0]}<small lang="ne">${line[1]} · ${line[2]}</small>`;
    const p=rnd(PRAISE);speech(p[0]+' '+cap(it[0])+'!',p[1]+' '+it[1],p[2]+' '+cap(it[2])+'!');say(p[0]+' '+it[0],p[1]+' '+it[1],null);
    setTimeout(()=>{if(screen!=='quiz')return;Q.i++;if(Q.i<Q.L.n)renderQ();else endQuiz();},1900);
  }else{
    Q.tries++;b.classList.add('wrong','show');b.disabled=true;mood('sad');
    if(stat&&Q.tries===1){stat.miss[key]=(stat.miss[key]||0)+1;save();}
    const left=[...main.querySelectorAll('.opt')].filter(x=>!x.disabled);
    if(Q.tries>=2||left.length===1){const right=left.find(x=>x.getAttribute('aria-label')===(Q.t.kind==='num'?it[0]:it[2]));right?.classList.add('hint');speech(cap(it[0]),it[1],'This one!');say(it[0],it[1],null);}
    else{speech(RETRY[0],RETRY[1],RETRY[2]);say(RETRY[0],RETRY[1],RETRY[2]);}
  }
}
function endQuiz(){
  screen='end';const {t,lv,L}=Q,n=Q.stars,p=P(),frac=n/L.n;
  let newBest=false;
  p.stat=p.stat||{plays:0,right:{},miss:{}};p.stat.plays++;p.stat.last=new Date().toISOString().slice(0,10);
  if(n>bestOf(p,t.id,lv)){p.best=p.best||{};p.best[t.id+':'+lv]=n;newBest=true;}
  save();
  renderTop();
  const next=LV_KEYS[LV_KEYS.indexOf(lv)+1];
  const offerNext=next&&frac>=0.7;
  main.innerHTML=`<div class="end">
    <div class="trophy" aria-hidden="true">${frac>=0.9?'🏆':frac>=0.6?'🥇':'🌟'}</div>
    <h1>${frac>=0.9?'Ekdam ramro!':frac>=0.6?'Syabaas!':'Ramro kosis!'}<small>${frac>=0.9?'Amazing!':frac>=0.6?'Well done!':'Good try!'} ${L.icon} ${L.np} · ${L.en}${newBest?' · new best!':''}</small></h1>
    <div class="row" aria-label="${n} of ${L.n} stars">${Array.from({length:L.n},(_,k)=>`<span class="${k<n?'':'off'}">⭐</span>`).join('')}</div>
    <div class="btns">
      ${offerNext?`<button class="btn" style="background:${LEVELS[next].color}" id="nextLv">${LEVELS[next].icon} ${LEVELS[next].np} <small style="font-weight:500">try ${LEVELS[next].en.toLowerCase()}</small></button>`:''}
      <button class="btn" style="background:var(--green)" id="againQ">🔁 Pheri <small style="font-weight:500">again</small></button>
      <button class="btn" style="background:var(--blue)" id="toLearn">👀 Sikaun <small style="font-weight:500">learn</small></button>
      <button class="btn" style="background:var(--red)" id="toHome">⌂ Ghar <small style="font-weight:500">home</small></button>
    </div></div>`;
  $('#againQ').onclick=startQuiz;$('#toLearn').onclick=()=>{learnI=0;renderLearn();};$('#toHome').onclick=()=>goHome();
  if(offerNext)$('#nextLv').onclick=()=>{p.lv=p.lv||{};p.lv[t.id]=next;save();startQuiz();};
  confetti();setTimeout(confetti,500);mood('happy');
  const line=frac>=0.9?['Ekdam ramro!','एकदम राम्रो!','Amazing!']:frac>=0.6?['Syabaas!','स्याबास!','Well done!']:['Ramro kosis!','राम्रो कोसिस!','Good try!'];
  speech(...line);say(...line);
}

// per-player report for grown-ups: stars per topic and level, stories, letters written, words that keep tripping them up
function renderProgress(p){
  if(!p)return;
  const st=p.stat||{plays:0,right:{},miss:{}},cell=(t,k)=>{const b=bestOf(p,t.id,k),n=LEVELS[k].n;return `<td class="${b>=Math.ceil(n*0.7)?'pass':b?'some':''}">${b?`${b}/${n}`:'–'}</td>`;};
  const find=key=>{const [tid,w]=key.split('|'),t=TOPICS.find(x=>x.id===tid),it=t&&t.items.find(x=>x[0]===w);return t&&it?{t,it}:null;};
  const hard=Object.keys(st.miss).map(k=>({k,score:(st.miss[k]||0)-(st.right[k]||0)*0.5,miss:st.miss[k]})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,10).map(x=>({...x,f:find(x.k)})).filter(x=>x.f);
  const traced=Object.keys(p.traced||{});
  $('#progBody').innerHTML=`
   <p><b>${esc(p.name)}</b>: ★ ${starsOf(p)} stars · ${st.plays} game${st.plays===1?'':'s'} played${st.last?` · last played ${st.last}`:''}</p>
   <div class="progwrap"><table class="prog"><thead><tr><th>Topic</th>${LV_KEYS.map(k=>`<th>${LEVELS[k].icon} ${LEVELS[k].np}</th>`).join('')}</tr></thead>
    <tbody>${TOPICS.filter(t=>t.kind!=='story').map(t=>`<tr><td>${t.icon} ${t.np} <small>${t.en}</small></td>${LV_KEYS.map(k=>cell(t,k)).join('')}</tr>`).join('')}</tbody></table></div>
   <p><b>Stories:</b> ${STORIES.map(s=>`${s.icon} ${s.np} ${bestOf(p,'kathaa',s.id)>=2?'✓ read + quiz':bestOf(p,'kathaa',s.id)?'✓ read':'not yet'}`).join(' · ')}</p>
   <p><b>Letters written:</b> ${traced.length?traced.join(' '):'none yet'}</p>
   <h3>Words to practise</h3>
   ${hard.length?`<div class="practise">${hard.map(x=>`<span>${x.f.t.kind==='color'?`<i class="dot" style="background:${x.f.it[3]}"></i>`:x.f.t.kind==='num'?x.f.it[3]:x.f.t.kind==='letter'?x.f.it[1]:x.f.it[3]} <b>${esc(x.f.it[0])}</b> ${esc(x.f.t.kind==='letter'?x.f.it[5]:x.f.it[2])} <small>missed ${x.miss}×</small></span>`).join('')}</div>`:'<p>Nothing stands out yet. Words show up here when they’re missed more often than they’re got right.</p>'}`;
}
// grown-ups panel
function renderGrown(){
  screen='grown';
  const list=voices.filter(v=>/^(ne|hi|mr)/i.test(v.lang)),p=P();
  main.innerHTML=`<div class="grown">
    <h2>For grown-ups</h2>
    <p>The voice comes from this device’s browser. Microsoft Edge has real Nepali voices. Chrome usually uses its Hindi voice, which reads the Nepali (Devanagari) words closely. If no Nepali or Hindi voice is installed, the romanized spelling is read with an English voice, which sounds less accurate.</p>
    <p><b>Voice in use:</b> ${!TTS?'none (this browser cannot speak)':npVoice?`${esc(npVoice.name)} (${npVoice.lang})`:'no Nepali or Hindi voice found'}</p>
    ${list.length>1?`<label>Choose voice <select id="vSel">${list.map(v=>`<option value="${esc(v.name)}" ${npVoice&&v.name===npVoice.name?'selected':''}>${esc(v.name)} (${v.lang})</option>`).join('')}</select></label>`:''}
    <label><input type="checkbox" id="vEn" ${S.english?'checked':''}> Show and say the English too</label>
    <div class="speedrow"><b>Voice speed</b><div class="speeds" role="radiogroup" aria-label="Voice speed">${(()=>{const cur=SPEEDS.reduce((a,s)=>Math.abs(s[2]-S.rate)<Math.abs(a[2]-S.rate)?s:a);
      return SPEEDS.map(s=>`<button type="button" role="radio" aria-checked="${s===cur}" data-r="${s[2]}"><b>${s[0]}</b><small>${s[1]}</small></button>`).join('');})()}</div></div>
    <div class="btns" style="justify-content:flex-start">
      <button class="btn" style="background:var(--red)" id="vTest">🔊 Test voice</button>
      <button class="btn" style="background:var(--blue)" id="vDone">Done</button>
    </div>
    <h2>Progress</h2>
    ${S.profiles.length?`<label>Player <select id="progSel">${S.profiles.map(x=>`<option value="${x.id}" ${p&&x.id===p.id?'selected':''}>${x.icon} ${esc(x.name)}</option>`).join('')}</select></label>
    <div id="progBody"></div>`:'<p>No players yet.</p>'}
    <h2>Levels</h2>
    <table class="lvtable">${LV_KEYS.map(k=>`<tr><th>${LEVELS[k].icon} ${LEVELS[k].np} (${LEVELS[k].en})</th><td>${LEVELS[k].n} questions, ${LEVELS[k].about}.</td></tr>`).join('')}</table>
    <p>A level’s medal on the home screen lights up at 70% of its stars. Each player keeps their own stars and chosen levels. Everything is saved in this browser only.</p>
    ${p?`<div class="btns" style="justify-content:flex-start"><button class="btn ghost" id="resetP">Reset ${esc(p.name)}’s stars</button></div><div class="warn" id="resetBox" hidden><b>Clear every star ${esc(p.name)} has earned?</b><div class="btns" style="justify-content:flex-start"><button class="btn" style="background:var(--red)" id="resetYes">Yes, clear</button><button class="btn ghost" id="resetNo">Keep</button></div></div>`:''}
  </div>`;
  if($('#progSel')){const show=()=>renderProgress(S.profiles.find(x=>x.id===$('#progSel').value));$('#progSel').onchange=show;show();}
  $('#vSel')&&($('#vSel').onchange=e=>{S.voice=e.target.value;save();loadVoices();});
  $('#vEn').onchange=e=>{S.english=e.target.checked;save();};
  main.querySelectorAll('.speeds button').forEach(b=>b.onclick=()=>{S.rate=+b.dataset.r;save();
    main.querySelectorAll('.speeds button').forEach(x=>x.setAttribute('aria-checked',String(x===b)));
    say('Namaste! Ma Habre hu.','नमस्ते! म हाब्रे हुँ।',null);});
  $('#vTest').onclick=()=>say('Namaste! Ma Habre hu.','नमस्ते! म हाब्रे हुँ।','Hello! I am Habre.');
  $('#vDone').onclick=()=>goHome();
  if(p){
    $('#resetP').onclick=()=>{$('#resetBox').hidden=false;$('#resetNo').focus();};
    $('#resetNo').onclick=()=>{$('#resetBox').hidden=true;};
    $('#resetYes').onclick=()=>{p.best={};save();renderTop();renderGrown();};
  }
}

$('#homeBtn').onclick=()=>goHome();
$('#whoBtn').onclick=goWho;
$('#grownBtn').onclick=renderGrown;
function renderSound(){const b=$('#soundBtn');b.setAttribute('aria-pressed',String(S.sound));b.setAttribute('aria-label',S.sound?'Sound on':'Sound off');b.textContent=S.sound?'🔊':'🔇';}
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();renderSound();if(!S.sound)speechSynthesis?.cancel?.();};
save();renderSound();renderTop();
// with more than one player (or none yet), ask who is playing first
if(S.profiles.length===1&&P())goHome();else goWho();
</script>
