<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habre's Nepali</title>
<meta name="description" content="A picture-and-voice Nepali game for children, with Habre the red panda.">
<meta name="theme-color" content="#e8463a">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one bright playroom screen. Habre (mascot) on the left talks; big tap cards fill the rest. Single sunny theme on purpose. */
:root{
  color-scheme:light;
  --sky:#dcf1ff; --sky-2:#f4fbff; --ink:#2b2140; --soft:#6a6280; --card:#ffffff; --line:#cfe3f2;
  --red:#e8463a; --red-dark:#b8321f; --yellow:#ffc93c; --green:#2fae6e; --blue:#3a7bf2; --purple:#8e5be8; --pink:#ff7eb6;
  --good:#2fae6e; --bad:#e8463a;
  --f:'Baloo 2','Nirmala UI','Mangal',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--sky)}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--sky-2),var(--sky) 60%);color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.3;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.app{max-width:980px;margin:0 auto;min-height:100%;overflow-x:clip;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;display:flex;flex-direction:column;gap:14px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.home{background:var(--card);border-radius:999px;padding:6px 16px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.title{font-weight:800;font-size:1.6rem;color:var(--red);margin-right:auto;line-height:1}
.title small{display:block;font-size:.8rem;color:var(--soft);font-weight:500}
.who{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:3px 14px 3px 4px;font-weight:800;box-shadow:0 4px 0 var(--line);max-width:200px}
.who .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:var(--sky)}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{background:var(--yellow);border-radius:999px;padding:4px 14px;font-weight:800;box-shadow:0 4px 0 #e0a800;font-variant-numeric:tabular-nums}
.round{width:52px;height:52px;border-radius:50%;background:var(--card);box-shadow:0 4px 0 var(--line);display:grid;place-items:center;font-size:1.5rem}
.round[aria-pressed="false"]{opacity:.55}

/* stage */
.stage{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.buddy{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.speech{background:var(--card);border-radius:22px;padding:10px 14px;text-align:center;box-shadow:0 5px 0 var(--line);position:relative;min-height:74px;width:100%;display:flex;flex-direction:column;justify-content:center}
.speech::after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-12px;border:12px solid transparent;border-top-color:var(--card);border-bottom:0}
.speech b{font-size:1.25rem;display:block;line-height:1.15}
.speech .dev{font-size:1rem;color:var(--soft)}
.speech .en{font-size:.85rem;color:var(--soft)}
.habre{width:180px;height:190px;cursor:pointer}
.habre svg{width:100%;height:100%;overflow:visible}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}

/* habre animation */
.hb-body{transform-origin:80px 160px;animation:bob 2.6s ease-in-out infinite}
.hb-tail{transform-origin:112px 140px;animation:wag 1.8s ease-in-out infinite}
.hb-eyes{transform-origin:80px 64px;animation:blink 4.2s infinite}
.hb-mouth{transform-origin:80px 86px;transition:transform .1s}
.talking .hb-mouth{animation:talk .22s ease-in-out infinite alternate}
.happy .hb-body{animation:jump .7s cubic-bezier(.3,1.6,.5,1) 2}
.happy .hb-armL{transform-origin:50px 120px;animation:waveL .35s ease-in-out 4 alternate}
.happy .hb-armR{transform-origin:110px 120px;animation:waveR .35s ease-in-out 4 alternate}
.sad .hb-head{transform-origin:80px 100px;animation:tilt 1s ease-in-out}
.wave .hb-armR{transform-origin:110px 120px;animation:waveR .4s ease-in-out 6 alternate}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes wag{50%{transform:rotate(12deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes talk{to{transform:scaleY(1.9)}}
@keyframes jump{40%{transform:translateY(-34px) scale(1.04,.96)}70%{transform:translateY(0) scale(1.06,.94)}}
@keyframes waveL{to{transform:rotate(-38deg)}}
@keyframes waveR{to{transform:rotate(38deg)}}
@keyframes tilt{30%,70%{transform:rotate(-10deg)}}

/* screens */
h1{margin:0;font-size:2rem;line-height:1.1;text-wrap:balance}
h1 small{display:block;font-size:1rem;color:var(--soft);font-weight:500}
h2.sub{margin:0;font-size:1.2rem}
h2.sub small{font-size:.9rem;color:var(--soft);font-weight:500;margin-left:6px}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.topic{background:var(--card);border-radius:26px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 7px 0 var(--tc,var(--line));transition:transform .12s;animation:pop .45s cubic-bezier(.3,1.5,.5,1) backwards}
.topic:hover{transform:translateY(-3px)}
.topic:active{transform:translateY(4px);box-shadow:0 3px 0 var(--tc)}
.topic .ic{font-size:3.2rem;line-height:1.1}
.topic b{font-size:1.45rem;line-height:1}
.topic .dev{color:var(--soft)}
.topic .en{font-size:.85rem;color:var(--soft)}
.medals{display:flex;gap:4px;font-size:1.1rem;margin-top:2px}
.medals span{filter:grayscale(1);opacity:.3}
.medals span.on{filter:none;opacity:1}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lv{background:var(--card);border-radius:22px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 5px 0 var(--line);border:4px solid transparent}
.lv span{font-size:2rem;line-height:1.1}
.lv b{font-size:1.2rem;line-height:1.1}
.lv small{font-size:.8rem;color:var(--soft)}
.lv .best{font-weight:700;color:#b98900}
.lv[aria-pressed="true"]{border-color:var(--lc);box-shadow:0 5px 0 var(--lc)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cards{background:#00a6b8}
.rule{display:flex;gap:10px;align-items:center;text-align:left;background:#fff7d6;border-radius:20px;padding:10px 14px;box-shadow:0 4px 0 #f0d77a}
.rule>span:first-child{font-size:2rem}
.rule b{display:block;font-size:1.05rem;line-height:1.25}
.rule small{color:var(--soft);font-size:.95rem}
/* picture grammar */
.sz-l{font-size:1.25em;display:inline-block}
.sz-s{font-size:.5em;display:inline-block}
.place{display:inline-flex;align-items:center;justify-content:center;font-size:.62em;line-height:1}
.place.v{flex-direction:column}
.place.h{gap:.6em}
.place.in{position:relative}
.place.in .inner{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);font-size:.5em}
/* kids flashcards */
.kfc{display:block;width:100%;border:0;background:none;padding:0;perspective:1200px;min-height:300px}
.kfc-in{position:relative;display:block;width:100%;min-height:300px;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.kfc.flipped .kfc-in{transform:rotateY(180deg)}
.kfc-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;border-radius:32px;background:var(--card);box-shadow:0 8px 0 var(--line);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}
.kfc-back{transform:rotateY(180deg);background:#fff7d6;box-shadow:0 8px 0 #f0d77a}
.kfc-face .pic{font-size:6rem;line-height:1.1}
.kfc-face b{font-size:2.4rem;line-height:1.1}
.kfc-face .dev{font-size:1.5rem;color:var(--soft)}
.kfc-face .en{font-size:1rem;color:var(--soft)}
.kfc-face .hint{position:absolute;bottom:12px;font-size:.9rem;color:var(--soft)}
.kfc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.kfc-top label{display:flex;align-items:center;gap:6px;font-weight:500;font-size:.95rem}
.kfc-top input{width:22px;height:22px;accent-color:var(--red)}
@media (prefers-reduced-motion: reduce){.kfc-in{transition:none}}
.mode{border-radius:28px;padding:20px 12px;color:#fff;font-weight:800;font-size:1.6rem;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.18);animation:pop .45s cubic-bezier(.3,1.5,.5,1) backwards}
.mode span{font-size:3rem;line-height:1}
.mode small{font-size:.95rem;font-weight:500;opacity:.92}
.mode:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.learn{background:var(--blue)} .play{background:var(--green)}

/* profiles */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.person{position:relative;background:var(--card);border-radius:26px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 7px 0 var(--pc,var(--line));animation:pop .45s cubic-bezier(.3,1.5,.5,1) backwards}
.person .av{font-size:3.6rem;line-height:1.1}
.person b{font-size:1.3rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person small{color:#b98900;font-weight:700}
.person.add{box-shadow:0 7px 0 var(--line);border:3px dashed var(--line)}
.person.add .av{color:var(--soft)}
.edit-row{display:flex;gap:8px;justify-content:center;margin-top:4px}
.mini{border-radius:999px;padding:2px 12px;font-size:.9rem;font-weight:700;background:var(--sky);box-shadow:0 3px 0 var(--line)}
.mini.del{color:var(--red)}
.form{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 7px 0 var(--line);display:flex;flex-direction:column;gap:12px}
.form label{font-weight:800;font-size:1.1rem}
.form input[type=text]{font:inherit;font-size:1.4rem;padding:8px 14px;border-radius:16px;border:3px solid var(--line);width:100%;max-width:360px}
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.avatars button{font-size:2.4rem;height:68px;border-radius:18px;background:var(--sky);border:4px solid transparent}
.avatars button[aria-pressed="true"]{border-color:var(--red);background:#ffe9e6}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.langpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.langpick button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:20px;background:var(--sky);border:4px solid transparent}
.langpick button span{font-size:2rem;font-weight:800;line-height:1.1}
.langpick button small{color:var(--soft)}
.langpick button[aria-pressed="true"]{border-color:var(--green);background:#e4f7ec}
.langpick.ages{grid-template-columns:repeat(3,minmax(0,1fr))}
.langpick.diffs{grid-template-columns:repeat(4,minmax(0,1fr))}
.langpick.diffs button span{font-size:1.5rem}
.warn{background:#fff1ef;border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:10px}

/* learn card */
.big{background:var(--card);border-radius:32px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 0 var(--line);text-align:center;min-height:300px;justify-content:center}
.big .pic{font-size:7rem;line-height:1.1;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.big b{font-size:2.6rem;line-height:1}
.big .dev{font-size:1.5rem;color:var(--soft)}
.big .en{font-size:1rem;color:var(--soft)}
.swatch{width:150px;height:150px;border-radius:44% 56% 52% 48%/50% 44% 56% 50%;border:5px solid rgba(0,0,0,.08);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.count{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:2.6rem;max-width:360px;line-height:1.1}
.count.many{font-size:1.8rem;max-width:300px}
.count.tens{flex-direction:column;align-items:flex-start;gap:2px;font-size:1.15rem;max-width:none}
.ten-row{display:flex;gap:2px;padding:1px 6px;border-radius:10px;background:var(--sky)}
.count i{font-style:normal;animation:drop .4s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes drop{from{transform:translateY(-40px) scale(.4);opacity:0}}
.digit{font-size:4rem;font-weight:800;line-height:1;color:var(--blue)}
.nav{display:flex;gap:12px;justify-content:center;align-items:center}
.arrow{width:76px;height:76px;border-radius:50%;background:var(--yellow);font-size:2rem;font-weight:800;box-shadow:0 6px 0 #e0a800}
.arrow:active{transform:translateY(4px);box-shadow:0 2px 0 #e0a800}
.listen{background:var(--red);color:#fff;border-radius:999px;padding:12px 26px;font-weight:800;font-size:1.3rem;box-shadow:0 6px 0 var(--red-dark)}
.listen:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red-dark)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--blue)}

/* quiz */
.q{background:var(--card);border-radius:26px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 0 var(--line)}
.q .say{font-size:1.8rem;font-weight:800;line-height:1.1}
.q .say small{display:block;font-size:1rem;color:var(--soft);font-weight:500}
.q .again{margin-left:auto;flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;font-size:1.8rem;box-shadow:0 5px 0 var(--red-dark)}
.q.listenonly .again{width:84px;height:84px;font-size:2.4rem;animation:glow 1s ease-in-out infinite alternate}
.progress{height:16px;border-radius:99px;background:var(--card);overflow:hidden;box-shadow:inset 0 2px 0 var(--line)}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),#ff9f1c);border-radius:99px;transition:width .4s}
.opts{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:14px}
.opt{background:var(--card);border-radius:28px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 7px 0 var(--line);animation:pop .4s cubic-bezier(.3,1.5,.5,1) backwards;transition:transform .12s}
.opt:active{transform:translateY(4px)}
.opt .pic{font-size:5rem;line-height:1.1}
.opt .swatch{width:110px;height:110px}
.opt .digit{font-size:3.6rem}
.opt .w{font-size:1.2rem;font-weight:700;line-height:1.1}
.opt .w-en{font-size:.95rem;color:var(--soft);line-height:1.1}
.opt .lab{font-size:.85rem;color:var(--soft);visibility:hidden}
.opt.right{box-shadow:0 7px 0 var(--good),0 0 0 6px var(--good);animation:yay .6s cubic-bezier(.3,1.6,.5,1)}
.opt.right .lab,.opt.show .lab{visibility:visible}
.opt.wrong{animation:shake .5s;opacity:.55}
.opt.hint{box-shadow:0 7px 0 var(--good),0 0 0 6px var(--yellow);animation:glow 1s ease-in-out infinite alternate}
@keyframes yay{40%{transform:scale(1.15) rotate(-4deg)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes glow{to{transform:scale(1.05)}}
.counter{background:var(--card);border-radius:26px;padding:12px;box-shadow:0 6px 0 var(--line);display:flex;justify-content:center}

/* end */
.end{background:var(--card);border-radius:32px;padding:24px;text-align:center;box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:8px}
.end .trophy{font-size:6rem;line-height:1;animation:jump .8s cubic-bezier(.3,1.6,.5,1) 2}
.end .row{font-size:2.2rem;letter-spacing:3px;line-height:1.2;display:flex;flex-wrap:wrap;justify-content:center;max-width:100%}
.end .row .off{filter:grayscale(1);opacity:.3}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{border-radius:999px;padding:12px 24px;font-weight:800;font-size:1.2rem;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line)}

/* grown-ups */
.grown{background:var(--card);border-radius:24px;padding:16px 18px;box-shadow:0 6px 0 var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:10px;font-size:1rem}
.grown h2{margin:0;font-size:1.3rem}
.grown p{margin:0;color:var(--soft)}
.grown label{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grown select{font:inherit;font-size:1rem;padding:4px 8px;border-radius:10px;border:2px solid var(--line);max-width:100%}
.grown input[type=checkbox]{width:22px;height:22px;accent-color:var(--red)}
.grown input[type=range]{accent-color:var(--red)}
.progwrap{overflow-x:auto}
.prog{border-collapse:collapse;font-size:.92rem;width:100%}
.prog th,.prog td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.prog th{color:var(--soft);font-weight:500}
.prog td small{color:var(--soft)}
.prog td.pass{color:var(--good);font-weight:800}
.prog td.some{color:#b98900;font-weight:700}
.practise{display:flex;flex-wrap:wrap;gap:8px}
.practise span{background:var(--sky);border-radius:999px;padding:4px 12px;font-size:.95rem}
.practise small{color:var(--soft)}
.practise .dot,.cd .dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;border:1px solid var(--line)}
/* letters and stories */
.letter{font-family:'Mukta','Nirmala UI','Mangal',var(--f);font-size:6.5rem;line-height:1.05;font-weight:700;color:var(--ink);animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.opt .letter{font-size:4rem}
.ex{font-size:1.1rem;color:var(--soft)}
.ex b{font-size:1.2rem;color:var(--ink)}
.write{align-self:center;background:var(--purple);box-shadow:0 6px 0 #6a3fbe}
.trace{position:relative;width:min(300px,82vw);aspect-ratio:1;margin:0 auto;background:var(--card);border-radius:24px;box-shadow:0 6px 0 var(--line);overflow:hidden}
.trace canvas{position:absolute;inset:0;width:100%;height:100%}
#trInk{touch-action:none;cursor:crosshair}
#traceBox{display:flex;flex-direction:column;gap:12px;align-items:center}
.story .story-pic{font-size:5.5rem;line-height:1.15;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.story b{font-size:1.9rem;line-height:1.2;text-wrap:balance}
.arrow:disabled{opacity:.35}
.speedrow{display:flex;flex-direction:column;gap:6px}
.speeds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.speeds button{display:flex;flex-direction:column;align-items:center;background:var(--sky);border:3px solid transparent;border-radius:16px;padding:6px 4px;line-height:1.15;box-shadow:0 3px 0 var(--line)}
.speeds button small{color:var(--soft);font-size:.8rem}
.speeds button[aria-checked="true"]{border-color:var(--red);background:#fff}
@media (max-width:680px){.speeds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lvtable{border-collapse:collapse;font-size:.95rem}
.lvtable td,.lvtable th{padding:4px 10px 4px 0;text-align:left;vertical-align:top}
.lvtable th{color:var(--soft);font-weight:500}

/* home: six doors with a progress ring each */
.back{align-self:flex-start;background:var(--card);border-radius:999px;padding:4px 16px;font-weight:800;box-shadow:0 4px 0 var(--line)}
/* Habre's house: a two-tier Nepali roof, brick walls, two floors of three doors; a door swings open when tapped */
.house{width:100%;max-width:660px;margin:4px auto 0;filter:drop-shadow(0 8px 0 rgba(43,33,64,.08))}
.roof{position:relative;height:118px}
.roof .tier{position:absolute;background:linear-gradient(#8f4527,#6e3019);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.roof .t2{bottom:58px;left:24%;right:24%;height:52px;clip-path:polygon(16% 0,84% 0,100% 100%,0 100%)}

/* vakya: sentence train */
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend span{border-radius:999px;padding:3px 12px;color:#fff;font-weight:700;font-size:.95rem}
.legend small{font-weight:500}

.car.plain{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line)}

.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;min-height:60px}

.ansopt.right{box-shadow:0 5px 0 var(--good),0 0 0 5px var(--good)}
.ansopt.wrong{animation:shake .5s;opacity:.55}

/* kathaa: read-along, picture guess, order */
.tok{display:inline;padding:0 3px;border-radius:8px;font:inherit;color:inherit;line-height:inherit;transition:background .15s}

.deckrow{display:flex;gap:10px;flex-wrap:wrap}
.cd{display:flex;flex-wrap:wrap;gap:6px}

}

/* gems, shop, and Habre's backdrop + magic */
.gems{background:#d9f3ff;border-radius:999px;padding:4px 14px;font-weight:800;box-shadow:0 4px 0 #8fd0f0;font-variant-numeric:tabular-nums;position:relative}
.gems.pop{animation:yay .6s cubic-bezier(.3,1.6,.5,1)}
.gems.pop::after{content:attr(data-plus);position:absolute;left:50%;top:100%;transform:translateX(-50%);background:var(--blue);color:#fff;border-radius:999px;padding:0 8px;font-size:.85rem;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
.habre{position:relative}
.habre svg{position:relative;z-index:1}
.scene{position:absolute;inset:6% 2% 0;border-radius:50% 50% 44% 44%;overflow:hidden;z-index:0;container-type:size;opacity:0;transition:opacity .3s}
.scene.on{opacity:1}

.fx{position:absolute;inset:0;z-index:2;pointer-events:none;container-type:size}
.fx span{position:absolute;bottom:4%;font-size:14cqw;opacity:0;animation:floaty 3.4s ease-in infinite}
@keyframes floaty{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translateY(-95cqh) rotate(25deg) scale(1.05);opacity:0}}
/* petals, leaves and snow drift down instead, swaying side to side */

@keyframes drift{0%{transform:translate(0,0) rotate(0);opacity:0}12%{opacity:1}30%{transform:translate(5cqw,28cqh) rotate(40deg)}55%{transform:translate(-5cqw,52cqh) rotate(-20deg)}80%{transform:translate(4cqw,76cqh) rotate(30deg);opacity:1}100%{transform:translate(0,96cqh) rotate(0);opacity:0}}

// say a Nepali line (Devanagari for a Nepali/Hindi voice, romanized otherwise), then optionally the English
// o.keep: queue after what is already being said; o.onWord(i): called with the index of the word being spoken (-1 at the end),
// from the voice's word boundaries when it reports them, otherwise from a timer that guesses the pace
// For a player learning English, a line that has English is said in English only (the Nepali is on screen);
// a line with no English is said in Nepali, the child's own language.
function say(rom,dev,en,o){
  o=o||{};
  if(!TTS||!S.sound){o.onWord&&o.onWord(-1);return;}
  try{
    if(!o.keep)speechSynthesis.cancel();
    const h=$('#habre'),stop=()=>h.classList.remove('talking'),eng=EN()&&!!en,voice=eng?enVoice:npVoice;
    const text=eng?en:npVoice?dev:rom,u=new SpeechSynthesisUtterance(text);
    if(voice){u.voice=voice;u.lang=voice.lang;}
    else if(eng)u.lang='en-GB';
    u.rate=S.rate;u.pitch=1.15;
    u.onstart=()=>h.classList.add('talking');u.onend=stop;u.onerror=stop;
    if(o.onWord){
      const starts=[],toks=[];text.replace(/\S+/g,(m,i)=>{starts.push(i);toks.push(m);return m;});
      let timer=0,byVoice=false,k=0;
      const step=()=>{if(byVoice||k>=toks.length)return;o.onWord(k);const ms=(toks[k].length*(npVoice&&!eng?95:70)+170)/S.rate;k++;timer=setTimeout(step,ms);};
      const end=()=>{clearTimeout(timer);o.onWord(-1);};
      u.onboundary=e=>{if(e.name&&e.name!=='word')return;byVoice=true;clearTimeout(timer);let j=0;while(j+1<starts.length&&starts[j+1]<=e.charIndex)j++;o.onWord(j);};
      u.addEventListener('start',step);u.addEventListener('end',end);u.addEventListener('error',end);
    }
    speechSynthesis.speak(u);
    if(en&&S.english&&!eng){
      const e=new SpeechSynthesisUtterance(en);
      if(enVoice){e.voice=enVoice;e.lang=enVoice.lang;}
      e.rate=Math.min(1,S.rate+0.1);e.pitch=1.1;
      e.onstart=()=>h.classList.add('talking');e.onend=stop;e.onerror=stop;
      speechSynthesis.speak(e);
    }
  }catch(err){}
}

const stripDeva=t=>t.replace(/["“]?[\u0900-\u097F][\u0900-\u097F\s।॥,.!?:;"“”'’()\-–]*["”]?/g,' ')
  .replace(/(\s*·\s*){2,}/g,' · ').replace(/^\s*·\s*|\s*·\s*$/g,'').replace(/\(\s*\)/g,'').replace(/\s{2,}/g,' ').replace(/^\s+$/,'');
function cleanText(n){if(/[\u0900-\u097F]/.test(n.data)){const v=stripDeva(n.data);if(v!==n.data)n.data=v;}}
function cleanTree(n){
  if(n.nodeType===3){cleanText(n);return;}
  if(n.nodeType!==1)return;const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let t;while((t=w.nextNode()))cleanText(t);
}

function renderOutfit(){
  const svg=$('#habre svg');if(!svg)return;
  svg.querySelectorAll('.hbAcc').forEach(x=>x.remove());
  const p=P(),o={...((p&&p.outfit)||{}),...(tryOn||{})},it=s=>o[s]&&ITEM[o[s]];
  // fur: swap the original colours for the palette's
  const pal=(it('fur')||{}).pal;
  svg.querySelectorAll('[data-of],[data-os]').forEach(el=>{
    for(const [a,d] of [['fill','of'],['stroke','os']]){const orig=el.dataset[d];if(!orig)continue;const k=FUR_KEYS.indexOf(orig);el.setAttribute(a,pal&&k>=0?pal[k]:orig);}
  });
  for(const slot of ['hat','eyes','neck','hand']){
    const x=it(slot);if(!x)continue;
    const [px,py,ps]=x.pos||SLOT_POS[slot],g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','hbAcc');
    g.innerHTML=x.svg?SVG_ITEMS[x.svg]:`<text x="${px}" y="${py}" font-size="${ps}" text-anchor="middle" dominant-baseline="central">${x.e}</text>`;
    // the hat and glasses move with the head; things at the neck sit behind the head
    const host=svg.querySelector(slot==='hat'||slot==='eyes'?'.hb-head':'.hb-body');
    if(slot==='neck')host.insertBefore(g,host.querySelector('.hb-head'));else host.append(g);
  }
  const bg=it('bg'),sc=$('#hbScene');
  sc.style.background=bg?`linear-gradient(180deg,${bg.grad})`:'';sc.classList.toggle('on',!!bg);
  sc.innerHTML=bg?bg.deco.map(([e,x,y,s])=>`<span style="left:${x}%;top:${y}%;font-size:${s}cqw">${e}</span>`).join(''):'';
  const fx=it('fx');
  const fall=!!fx&&FX_FALL.includes(fx.id);$('#hbFx').classList.toggle('fall',fall);
  // falling things drift down more slowly than rising ones float up
  $('#hbFx').innerHTML=fx?Array.from({length:7},(_,k)=>`<span style="left:${8+k*13}%;animation-delay:${(k*(fall?0.7:0.53))%(fall?4.4:3.2)}s;animation-duration:${(fall?4.6:3)+(k%3)*0.6}s">${fx.e}</span>`).join(''):'';
}

function pictureOf(t,it){
  if(t.kind==='letter')return `<span class="letter"${t.id==='abc'?'':' lang="ne"'}>${it[1]}</span>`;
  if(t.kind==='color')return `<span class="swatch" style="background:${it[3]}"></span>`;
  if(t.kind==='num')return `<span class="digit">${it[3]}</span>`;
  return `<span class="pic">${it[3]}</span>`;
}
// the words a level uses
function wordsFor(t,lv){
  if(isRound(lv))return roundWords(t,lv);
  const L=LEVELS[lv];
  if(t.tiers)return t.items.filter(it=>it[4]<=LV_KEYS.indexOf(lv)+1);
  if(t.kind==='num')return t.items.filter(it=>it[3]<=L.count);
  return t.items.slice(0,Math.min(L.words,t.items.length));
}
function countHtml(n,pic,cls){
  // more than 20: rows of ten, so tens can be counted at a glance
  if(n>20){
    const rows=[];for(let r=0;r<n;r+=10)rows.push(Math.min(10,n-r));
    return `<div class="count tens" ${cls||''}>${rows.map((k,r)=>`<div class="ten-row">${Array.from({length:k},()=>`<i style="animation-delay:${Math.min(r,9)*90}ms">${pic}</i>`).join('')}</div>`).join('')}</div>`;
  }
  return `<div class="count${n>10?' many':''}" ${cls||''}>${Array.from({length:n},(_,i)=>`<i style="animation-delay:${Math.min(i,14)*80}ms">${pic}</i>`).join('')}</div>`;
}

function progressOf(p){

    kathaa:avg(STORIES.filter(s=>!storyShelved(s.id)).map(s=>s.choice?Math.min(2,bestOf(p,'kathaa',s.id))/2:(Math.min(2,bestOf(p,'kathaa',s.id))+Math.min(1,bestOf(p,'krama',s.id)))/3)),
    shabda:avg(WORD_T().map(t=>topicDone(p,t))),
    akshar:topicDone(p,ak)*0.7+Math.min(1,Object.keys(p.traced||{}).length/ak.items.length)*0.3,

  };
}

function roomProgress(p,r){
  const seen=((p.rooms||{})[r.id]||[]).length/r.items.length,find=Math.min(1,bestOf(p,'room',r.id)/(findN()-1));
  const ts=roomTopics(r);
  return ts.length?seen*0.25+find*0.35+avg(ts.map(id=>topicDone(p,T(id))))*0.4:seen*0.4+find*0.6;
}
let RF=null;
function openRoom(r){
  if(!P()){goWho();return;}
  screen='room';RF=null;topic=null;
  const p=P();
  main.innerHTML=`${backBtn('Ghar')}<h1>${r.icon} ${nmOf(r)[0]} <small lang="ne">${nmOf(r)[1]}</small></h1>
   <div class="rbar"><button class="mode learn" id="rLook" aria-pressed="true"><span aria-hidden="true">👀</span>Herau<small>Look · tap anything</small></button>

     return `<button class="topic" style="--tc:${r.color};animation-delay:${(r.topics.length+i)*40}ms" data-sec="${id}"><span class="ic" aria-hidden="true">${s.icon}</span><b>${EN()?s.en:s.np}</b><span class="dev" lang="ne">${s.dev}</span>${EN()?'':`<span class="en">${s.en}</span>`}</button>`;}).join('')}</div>

function roomScene(r){
  // furniture drawn into the room first, so the small things sitting on it stay tappable on top
  const btn=(it,k)=>it[3]
    ?`<button class="ritem${it[7]==='u'||(it[7]!=='d'&&it[5]>82)?' up':''}${it[4]<15?' lft':it[4]>85?' rgt':''}" data-k="${k}" style="left:${it[4]}%;top:${it[5]}%;--s:${it[6]}" aria-label="${esc(it[2])}"><span class="e" aria-hidden="true">${it[3]}</span><span class="rl">${esc(tw(it)[0])}</span></button>`
    :`<button class="ritem hot" data-k="${k}" style="left:${it[4]}%;top:${it[5]}%;width:${it[7]}%;height:${it[8]}%" aria-label="${esc(it[2])}"><span class="rl">${esc(tw(it)[0])}</span></button>`;
  return `<div class="room" id="room"><svg class="art" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">${ROOM_ART[r.id]}</svg>
    ${r.items.map((it,k)=>it[3]?'':btn(it,k)).join('')}${r.items.map((it,k)=>it[3]?btn(it,k):'').join('')}</div>`;
}
// a tapped thing shows its name for a moment, so a busy room never fills up with labels
let nameTimer=0;
function showName(b){
  main.querySelectorAll('.ritem.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  clearTimeout(nameTimer);nameTimer=setTimeout(()=>b.classList.remove('on'),2600);

// look: hear each thing; seeing everything in a room once earns a few gems
function roomLook(r,b){
  const k=+b.dataset.k,it=r.items[k],p=P();
  speech(cap(it[0]),it[1],it[2]);say(it[0],it[1],it[2]);mood('happy');
  showName(b);b.classList.remove('bounce');void b.offsetWidth;b.classList.add('bounce');
  p.rooms=p.rooms||{};const s=new Set(p.rooms[r.id]||[]),had=s.size;s.add(k);p.rooms[r.id]=[...s];save();
  if(s.size===r.items.length&&had<s.size){earn(3);confetti();
    setTimeout(()=>{if(screen==='room'){speech('Sabai herisakyau!','सबै हेरिसक्यौ!','You looked at everything! Now play Khoja: find it.');say('Sabai herisakyau!','सबै हेरिसक्यौ!',null);}},1500);}
}
// find it: Habre names a thing, the child taps it in the room
function roomFind(r){
  RF={r,list:spread(r.items.map((_,k)=>k),findN()),i:0,stars:0};
  $('#room').classList.add('find');$('#rLook').setAttribute('aria-pressed','false');$('#rFind').setAttribute('aria-pressed','true');
  $('#rQ').hidden=false;$('#rProg').hidden=false;$('#again').onclick=roomAsk;
  $('#room').scrollIntoView({block:'center',behavior:RM?'auto':'smooth'});
  roomAsk();
}
function roomAsk(){
  const it=RF.r.items[RF.list[RF.i]];RF.tries=0;RF.lock=false;
  main.querySelectorAll('.ritem').forEach(b=>b.classList.remove('right','wrong','hint','on'));
  $('#rProg i').style.width=RF.i/findN()*100+'%';
  // an English learner finds it from the English alone; the Nepali shows once it is found
  if(isLittle()){$('#qSay').innerHTML=EN()?`${esc(cap(it[2]))}?`:`${esc(cap(it[0]))}?<small lang="ne">${it[1]}${S.english?` · ${esc(it[2])}`:''}</small>`;
    speech(cap(it[0])+'?',EN()?'':it[1]+'?',cap(it[2])+'?');say(it[0],it[1],EN()?it[2]:null);}
  else{$('#qSay').innerHTML=EN()?`${esc(whereEn(it[2]))}`:`${esc(cap(it[0]))} kahaa cha?<small lang="ne">${it[1]} कहाँ छ?${S.english?` · ${esc(whereEn(it[2]))}`:''}</small>`;
  speech(cap(it[0])+' kahaa cha?',EN()?'':it[1]+' कहाँ छ?',whereEn(it[2]));say(it[0]+' kahaa cha?',it[1]+' कहाँ छ?',EN()?whereEn(it[2]):null);}
}
function roomPick(b){
  if(RF.lock)return;
  const k=+b.dataset.k,want=RF.list[RF.i],it=RF.r.items[want],rf=RF;
  if(k===want){
    RF.lock=true;if(!RF.tries)RF.stars++;b.classList.add('right');showName(b);confetti();mood('happy');
    const pr=rnd(PRAISE);speech(pr[0]+' '+cap(it[0])+'!',pr[1]+' '+it[1],EN()?pr[2]+' '+cap(it[2])+'!':pr[2]);say(pr[0]+' '+it[0],pr[1]+' '+it[1],EN()?pr[2]+' '+cap(it[2])+'!':null);
    setTimeout(()=>{if(screen!=='room'||RF!==rf)return;RF.i++;if(RF.i<findN())roomAsk();else roomEnd();},1500);
  }else{
    RF.tries++;b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');mood('sad');
    const o=RF.r.items[k];speech(cap(o[0])+'!',o[1],`That’s the ${o[2]}. Try again!`);sayT(o[0],o[1],`That’s the ${o[2]}.`);
    if(RF.tries>=2)main.querySelector(`.ritem[data-k="${want}"]`).classList.add('hint');
  }
}
function roomEnd(){
  const r=RF.r,n=RF.stars,p=P();let nb=false;
  if(n>bestOf(p,'room',r.id)){p.best=p.best||{};p.best['room:'+r.id]=n;nb=true;}

}

let trip=null;
function stopDone(p,s){
  // rounds also count as done from the easy/medium/hard levels they replaced: any level for round 1, medium or hard for 2
  if(s.k==='play')return passed(p,s.t,s.lv)||({r1:LV_KEYS,r2:['medium','hard']}[s.lv]||[]).some(l=>bestOf(p,s.t,l)>=Math.ceil(LEVELS[l].n*0.7));
  if(s.k==='check')return checked(p,T(s.t));
  if(s.k==='story'){
    if(bestOf(p,'kathaa',s.id)>=1||littleSkip(p,s))return true;
    // a journey part counts as done for players who were already past it before the story was added
    const i=s.j?STOPS.indexOf(s):-1,nx=STOPS[i+1];return i>=0&&!!nx&&nx.k!=='story'&&stopDone(p,nx);
  }
  if(s.k==='vakya')return bestOf(p,'vakya:'+s.a,s.lv)>=V_N-1;
  if(s.k==='boss')return bestOf(p,'yatra',s.r.id)>=bossN()-2;
  return !!((p.yatra||{}).chest||{})[s.r.id];
}
// the stop a player is on: the first one not done yet
const yatraAt=p=>{const i=STOPS.findIndex(s=>!stopDone(p,s));return i<0?STOPS.length:i;};
// what a stop looks like: [picture, romanized, devanagari, english, badge]
function stopFace(s){

  if(s.k==='play'){const t=T(s.t),L=LEVELS[s.lv];return [t.id==='akshar'?'<span lang="ne">अ</span>':t.icon,t.np,t.dev,`${t.en} · ${L.en.toLowerCase()}`,L.icon];}
  if(s.k==='check'){const t=T(s.t);return [t.icon,'Jaanch: '+t.np,'जाँच: '+t.dev,`Check: ${t.en.toLowerCase()}`,'✅'];}
  if(s.k==='story'&&s.j&&isLittle()){const m=MOMENTS[s.r.id];return [m[0],m[1],m[2],m[3],'👀'];}
  if(s.k==='story'){const st=storyOf(s.id);return st.journey?[st.icon,JOURNEY_PART[st.part][0],JOURNEY_PART[st.part][1],'Story: '+JOURNEY_PART[st.part][2].toLowerCase(),'📖']:[st.icon,st.np,st.dev,'Story: '+st.en,'📖'];}
  if(s.k==='vakya'){const a=V_ACTS.find(x=>x.id===s.a),L=LEVELS[s.lv];return [a.icon,a.np,a.dev,`${a.en} · ${L.en.toLowerCase()}`,L.icon];}

  return ['🎁','Upahaar','उपहार',`A present of ${s.r.gems} gems`,'💎'];
}
// start a stop; when it ends, the way back leads to the trail again

    const t=T(s.t),lk=s.t+':'+s.lv,learn=p.yatra.learn=p.yatra.learn||{};
    // the first time a round is played, see its new words first
    if(!learn[lk]){learn[lk]=1;save();topic=t;learnI=0;renderLearn();}else{save();startQuiz({mode:'play',t,round:s.lv});}
  }else if(s.k==='check')startQuiz({mode:'check',t:T(s.t)});

const MAP_DECO=[['☀️',10,6],['☁️',48,2.5],['☁️',8,27],['🦅',92,17],['🦒',92,33],['🌲',8,46],['🌳',92,50],['🍊',92,64],['🪔',8,62],['🐐',8,78],['🌷',92,83],['🐄',8,94]];
function openMap(){
  if(!P()){goWho();return;}
  {const pc=newPostcard(P());if(pc){openPostcard(pc,true);return;}}
  if(!P().introSeen){P().introSeen=1;save();if(isLittle())openMoment('ghar',()=>goHome());else readStory(JOURNEY_INTRO);return;}
  screen='map';topic=null;trip=null;shopSel=null;clearTry();
  const p=P(),y=p.yatra=p.yatra||{},stars=starsOf(p),at=yatraAt(p),gate=stars>=GATE;
  const open=YATRA.map((_,i)=>placeOpen(p,i)),nOpen=open.filter(Boolean).length;
  const curI=!gate?-1:at>=STOPS.length?YATRA.length-1:YATRA.indexOf(STOPS[at].r);
  // a place that opened since the map was last shown gets a little party
  const fresh=y.open!=null&&nOpen>y.open?nOpen-1:-1,first=!y.mapSeen;
  y.open=nOpen;y.mapSeen=1;save();
  const d=p.daily||{},done=d.last===today(),streak=(done||d.last===yesterday())&&d.streak>1?` · 🔥 ${d.streak} days in a row`:'';
  const known=allCards().filter(c=>boxOf(p,c)===2).length;
  const gl=GIFTS(),nx=gl.find(g=>g.gift>stars),from=nx?((gl[gl.indexOf(nx)-1]||{gift:0}).gift):0;
  const nodes=[{icon:'🏠',np:'Habreko ghar',dev:'हाब्रेको घर',en:'Habre’s house',open:true,pct:Math.min(1,stars/GATE),done:gate,cur:curI<0},
    ...YATRA.map((r,i)=>{const f=regionFirst(r),n=regionEnd(i)-f;return {icon:r.icon,np:r.np,dev:r.dev,en:r.en,open:open[i],pct:open[i]?Math.max(0,Math.min(at-f,n))/n:0,done:at>=regionEnd(i),cur:curI===i,fresh:fresh===i};})];
  const road=MAP_POS.slice(1).map(([x2,y2],k)=>{const [x1,y1]=MAP_POS[k],m=(y1+y2)/2,on=nodes[k+1].open;
    return `<path d="M${x1} ${y1}C${x1} ${m} ${x2} ${m} ${x2} ${y2}" fill="none" stroke="${on?'#c9a97a':'#b9b3a8'}" stroke-width="${on?14:10}" stroke-linecap="round" ${on?'':'stroke-dasharray="1 14"'} vector-effect="non-scaling-stroke"/>`;}).join('');
  main.innerHTML=`<h1>🗺️ Naksa <small>नक्सा · Where shall we go?</small></h1>
   <div class="wmap">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${road}</svg>
    ${MAP_DECO.map(([e,x,yy])=>`<span class="deco" style="left:${x}%;top:${yy}%" aria-hidden="true">${e}</span>`).join('')}
    ${nodes.map((o,k)=>{const [x,yy]=MAP_POS[k],cls=!o.open?'lock':o.done?'done':'open';
      return `<button class="place ${cls}${o.cur?' now':''}${o.fresh?' fresh':''}${x<50?' r':''}" style="left:${x}%;top:${yy}%;--p:${Math.round(o.pct*100)}" data-n="${k}" aria-label="${esc(o.en)}${o.open?'':' (locked)'}">
       ${o.cur?`<span class="me" aria-hidden="true">${p.icon}</span>`:''}
       <span class="disc"><span class="in" aria-hidden="true">${o.icon}</span>${!o.open?'<span class="badge" aria-hidden="true">🔒</span>':o.done?'<span class="badge" aria-hidden="true">⭐</span>':''}</span>
       <span class="lb">${EN()?o.en:o.np}<small${EN()?' lang="ne"':''}>${EN()?o.dev:o.en}</small></span></button>`;}).join('')}
   </div>
   <p class="maphint">Tap a place to go there. 🔒 places open one by one as you learn.</p>
   <button class="daily" id="dailyBtn"><span class="ic" aria-hidden="true">${done?'✅':'⏱️'}</span><span><b>Aajako abhyas</b><small>${done?'Done today! Play again?':'Today’s practice: 5 minutes, a bit of everything'}${streak}</small></span></button>
   ${isLittle()?'':`<button class="daily jstory" id="jBtn"><span class="ic" aria-hidden="true">📖</span><span><b>Habreko kathaa</b><small>The story so far: hear it again any time</small></span></button>`}
   ${shelved('patti')?'':`<button class="daily patti" id="pattiBtn"><span class="ic" aria-hidden="true">🃏</span><span><b>Patti</b><small>Flashcards and memory match: train any time${known?` · ${known} words known`:''}</small></span></button>`}
   <button class="reward" id="wardBtn"><span class="next" aria-hidden="true">${nx?(nx.e||nx.icon):'🏆'}</span>
     <span style="flex:1;min-width:150px"><b>${nx?`${nx.gift-stars} more ★ and Habre gets a free ${nx.en}!`:'Habre has every free gift!'}</b><span class="bar2"><i style="width:${nx?Math.round((stars-from)/(nx.gift-from)*100):100}%"></i></span></span>
     <span class="mini">🛍️ Pasal · 💎 ${gemsOf(p)}</span></button>`;
  $('#dailyBtn').onclick=startDaily;
  if($('#pattiBtn'))$('#pattiBtn').onclick=openPatti;
  if($('#jBtn'))$('#jBtn').onclick=openJourney;
  $('#wardBtn').onclick=()=>openShop();
  main.querySelectorAll('.place').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.n,o=nodes[k];
    if(k===0){speech(o.np,o.dev,'Pick a room.');say(o.np,o.dev,null);mood('happy');setTimeout(()=>{if(screen==='map')goHome(true);},RM?0:450);return;}
    if(!o.open){
      const msg=!gate?['Pahile gharma tara jammaa gara!','पहिले घरमा तारा जम्मा गर!',`Collect ${GATE-stars} more ★ in the rooms of the house to open the garden!`]
        :[`Pahile ${YATRA[k-2].np} sakau!`,`पहिले ${YATRA[k-2].dev} सकौं!`,`Finish ${YATRA[k-2].en.toLowerCase()} first!`];
      speech(...msg);say(...msg);mood('sad');b.classList.remove('fresh');void b.offsetWidth;b.classList.add('fresh');return;
    }
    speech(o.np,o.dev,o.en);sayT(o.np,o.dev,o.en);mood('happy');
    setTimeout(()=>{if(screen==='map')openPath(YATRA[k-1].id);},RM?0:450);
  });
  if(fresh>=0){const r=YATRA[fresh];speech('Naya thaau khulyo: '+r.np+'!','नयाँ ठाउँ खुल्यो: '+r.dev+'!',`A new place is open: ${r.en.toLowerCase()}!`);say('Naya thaau khulyo: '+r.np+'!','नयाँ ठाउँ खुल्यो: '+r.dev+'!',null);confetti();setTimeout(confetti,500);mood('happy');}
  else if(first&&!gate){speech('Yo hamro naksa ho!','यो हाम्रो नक्सा हो!','This is our map! Let’s start at the house.');say('Yo hamro naksa ho! Gharbaata suru garau.','यो हाम्रो नक्सा हो! घरबाट सुरु गरौं।','This is our map! Let’s start at the house.');mood('wave');}
  else if(at>=STOPS.length){speech('Himal pugyau!','हिमाल पुग्यौ!','You climbed all the way to the mountains!');say('Himal pugyau!','हिमाल पुग्यौ!',null);mood('happy');}
  else{const o=nodes[curI+1];speech('Kahaa jaane?','कहाँ जाने?',`Where shall we go? ${o.en} is waiting!`);say('Kahaa jaane?','कहाँ जाने?',null);mood('wave');}
}

// ---------- screens ----------
function goHome(quiet){

  screen='home';topic=null;shopSel=null;trip=null;clearTry();if(!quiet)speechSynthesis?.cancel?.();
  const p=P(),stars=starsOf(p),gate=stars>=GATE,y=p.yatra||{},at=yatraAt(p);
  const door=(o,i)=>{const v=Math.round(roomProgress(p,o)*100);return `<button class="hdoor" style="--dc:${o.color};animation-delay:${i*70}ms" data-d="${o.id}" aria-label="${o.en}, ${v}% done">
       <span class="plaque">${nmOf(o)[0]}<small lang="ne">${nmOf(o)[1]}</small></span>
       <span class="frame" aria-hidden="true"><span class="leaf"><span class="wreath" style="--p:${v}"><span>${o.icon}</span></span><span class="knob"></span></span></span>
       <span class="step" aria-hidden="true"></span><span class="mat">${v}%</span></button>`;};
  main.innerHTML=`${backBtn('🗺️ Naksa')}<h1>Habreko ghar <small>हाब्रेको घर · Pick a room</small></h1>
   ${gate?'':isLittle()?`<button class="why" id="whyBtn" aria-label="${stars} of ${GATE} stars to go to Grandma"><span aria-hidden="true">👵🏔️</span><span><b>⭐ ${stars} / ${GATE}</b></span></button>`:`<button class="why" id="whyBtn"><span aria-hidden="true">👵🏔️</span><span><b>Hajuraamalaai bhetna jaana, pahile shabda sikau!</b><small lang="ne">हजुरआमालाई भेट्न जान, पहिले शब्द सिकौं!</small><small>To visit Grandma, first learn words here. Find things in the rooms for ★ stars: ${stars} of ${GATE}. Tap to hear the story.</small></span></button>`}
   <div class="house">
    <div class="roof" aria-hidden="true"><span class="gajur"></span><span class="tier t2"></span><span class="tier t1"><span class="sign">Habreko ghar<small>हाब्रेको घर · Habre’s house</small></span></span></div>
    <div class="walls">
     <div class="flags" aria-hidden="true">${'<i></i>'.repeat(19)}</div>
     <div class="floor">${ROOMS.slice(0,3).map(door).join('')}</div>
     <div class="beam" aria-hidden="true"></div>
     <div class="floor">${ROOMS.slice(3).map((o,i)=>door(o,i+3)).join('')}</div>
    </div>
    <div class="ground" aria-hidden="true"></div>
   </div>
   <button class="gate${gate?'':' shut'}${gate&&!y.seen?' fresh':''}" id="gateBtn"><span class="ic" aria-hidden="true">${gate?'🗺️':'🔒'}</span>
     <span style="flex:1;min-width:150px"><b>Habreko yatra</b>${gate
       ?`<small>Habre’s journey · ${at>=STOPS.length?'you reached the mountains!':`stop ${at+1} of ${STOPS.length}: ${esc(stopFace(STOPS[at])[3])}`}</small>`
       :`<small>Habre’s journey · ${GATE-stars} more ★ from the rooms to open the gate</small><span class="bar2"><i style="width:${Math.round(stars/GATE*100)}%"></i></span>`}</span></button>`;
  main.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const o=ROOMS.find(x=>x.id===b.dataset.d);if(b.classList.contains('open'))return;b.classList.add('open');mood('happy');sayT(o.np,o.dev,o.en);setTimeout(()=>{if(screen==='home')openRoom(o);},RM?0:520);});
  $('#backBtn').onclick=openMap;
  if($('#whyBtn'))$('#whyBtn').onclick=()=>isLittle()?openMoment('ghar',()=>goHome()):readStory(JOURNEY_INTRO);
  $('#gateBtn').onclick=()=>{
    if(gate){openPath();return;}
    const en=`Collect ${GATE-stars} more stars in the rooms to open the gate!`;
    speech('Aru tara jammaa gara!','अरू तारा जम्मा गर!',en);say('Aru tara jammaa gara!','अरू तारा जम्मा गर!',en);mood('wave');
  };
  if(!quiet&&gate&&!y.seen){speech('Dhoka khulyo!','ढोका खुल्यो!','The gate is open! Come on a journey with Habre!');say('Dhoka khulyo!','ढोका खुल्यो!','The gate is open!');mood('happy');confetti();}
  else if(!quiet){speech('Namaste, '+p.name+'!','नमस्ते, '+p.name+'!','Pick a room.');mood('wave');}

function topicTile(t,i,p){
  return `<button class="topic" style="--tc:${t.color};animation-delay:${Math.min(i,12)*40}ms" data-t="${t.id}">
   <span class="ic" aria-hidden="true">${t.icon}</span><b>${EN()?t.en:t.np}</b><span class="dev" lang="ne">${t.dev}</span>${EN()?'':`<span class="en">${t.en}</span>`}
   <span class="medals" aria-label="Levels finished">${LV_KEYS.map(k=>`<span class="${passed(p,t.id,k)?'on':''}" title="${LEVELS[k].en}">${LEVELS[k].icon}</span>`).join('')}<span class="${checked(p,t)?'on':''}" title="Check">✅</span></span></button>`;
}

  screen='words';topic=null;const p=P(),st=stat(p),all=stickerItems(),got=all.filter(c=>(st.right[keyOf(c.t,c.it)]||0)>=STICKER_AT).length;

// a topic goes back to the room it lives in; the trip topics go back to the list of every word topic
const topicBack=t=>t.section==='gram'||t.section==='gramEn'?[EN()?'Grammar':'Vyakaran',openGram]:roomOf(t.id)?[roomOf(t.id).np,toRoom(t.id)]:wordsBack();
// a topic: pick a level, then learn → play → check, plus memory match and flashcards
function openTopic(t){
  if(tripBack())return;
  if(t.kind==='story'){openStories();return;}
  topic=t;screen='topic';
  const p=P(),cur=levelOf(t.id),[bl,bf]=topicBack(t),tick='<em>✔</em>';
  const seen=(p.seen||{})[t.id],played=LV_KEYS.some(k=>passed(p,t.id,k));
  main.innerHTML=`${backBtn(bl)}<h1>${t.id==='akshar'?'<span lang="ne">अ</span>':t.icon} ${nmOf(t)[0]} <small>${nmOf(t)[1]}</small></h1>
   ${t.rule?`<button class="rule" id="ruleCard" type="button"><span aria-hidden="true">💡</span><span>${t.section==='gramEn'?`<b lang="ne">${t.rule[1]}</b><small>${esc(t.rule[2])}</small>`:`<b>${esc(t.rule[0])}</b><small lang="ne">${t.rule[1]}</small>`}</span></button>`:''}
   <h2 class="sub">Kati gaaro? <small>How hard?</small></h2>
   <div class="levels">${LV_KEYS.map(k=>{const L=LEVELS[k];return `<button class="lv" style="--lc:${L.color}" aria-pressed="${k===cur}" data-lv="${k}">
     <span aria-hidden="true">${L.icon}</span><b>${L.np}</b><small>${L.en}</small><small class="best">★ ${bestOf(p,t.id,k)}/${L.n}</small></button>`;}).join('')}</div>
   <div class="path">
    <button class="mode learn" id="mLearn"><span aria-hidden="true">👀</span>Sikaun<small>1 · Learn</small>${seen?tick:''}</button>
    <button class="mode play" id="mPlay" style="animation-delay:80ms"><span aria-hidden="true">🎯</span>Khelaun<small>2 · Play</small>${played?tick:''}</button>
    <button class="mode check" id="mCheck" style="animation-delay:160ms"><span aria-hidden="true">✅</span>Jaanch<small>3 · Check · ★ ${bestOf(p,'check',t.id)}/${checkN()}</small>${checked(p,t)?tick:''}</button>
   </div>
   <div class="extras">
    ${t.kind!=='yesno'?`<button class="mode memo" id="mMemo" style="animation-delay:240ms"><span aria-hidden="true">🧠</span>Jodi<small>Memory match · ★ ${bestOf(p,'jodi',t.id)}/3</small></button>`:''}
    <button class="mode cards" id="mCards" style="animation-delay:300ms"><span aria-hidden="true">🃏</span>Patti<small>Flashcards</small></button>
   </div>`;
  $('#backBtn').onclick=bf;
  // an English lesson's rule is explained in Nepali first (said in Nepali), with the English example under it
  if(t.rule)$('#ruleCard').onclick=()=>{if(t.section==='gramEn'){speech('',t.rule[1],null);say(t.rule[1],t.rule[1],null);}else{speech(...t.rule);say(...t.rule);}mood('happy');};
  main.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{
    p.lv=p.lv||{};p.lv[t.id]=b.dataset.lv;save();
    main.querySelectorAll('.lv').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    const L=LEVELS[b.dataset.lv];speech(L.np,L.dev,L.en);say(L.np,L.dev,L.en);
  });
  const cards=()=>wordsFor(t,levelOf(t.id)).map(it=>({t,it}));
  $('#mLearn').onclick=()=>{learnI=0;renderLearn();};
  $('#mPlay').onclick=()=>startQuiz({mode:'play',t});
  $('#mCheck').onclick=()=>startQuiz({mode:'check',t});
  if($('#mMemo'))$('#mMemo').onclick=()=>startMemory(cards(),{key:'jodi:'+t.id,title:t.np,pairs:MEM_PAIRS[levelOf(t.id)],back:()=>openTopic(t)});
  $('#mCards').onclick=()=>startKCards(cards(),()=>openTopic(t),t.np);
  speech(t.np,t.dev,t.en);say(t.np,t.dev,t.en);
}

// learn: one big card at a time, through this level's words
function renderLearn(){
  screen='learn';const t=topic,words=trip&&trip.k==='play'&&trip.t===t.id&&isRound(trip.lv)?roundLearn(t,trip.lv):wordsFor(t,levelOf(t.id)),it=words[learnI],isL=t.kind==='letter',yn=t.kind==='yesno'?ynOf(t,it):null;
  const pic=t.kind==='num'?`${countHtml(it[3],COUNT_PICS[learnI%COUNT_PICS.length],'aria-hidden="true"')}<span class="digit">${it[3]} · ${npDigits(it[3])}</span>`:pictureOf(t,it);
  const text=isL?`<b>${it[0]}</b><span class="ex"><span aria-hidden="true">${it[3]}</span> <b>${it[5]}</b> <span class="dev" lang="ne">${it[6]}</span>${S.english&&t.id!=='abc'?` · ${it[7]}`:''}</span>`
    :EN()&&!yn?`<b>${esc(it[2])}</b><span class="dev" lang="ne">${it[1]}</span>`:`<b>${esc(it[0])}</b><span class="dev" lang="ne">${it[1]}</span>${S.english?`<span class="en">${esc(it[2])}</span>`:''}${yn?`<span class="ans">→ ${yn[0]}!<small lang="ne">${yn[1]}${S.english?' · '+esc(yn[2]):''}</small></span>`:''}`;
  main.innerHTML=`${backBtn(t.np)}<div class="big" id="card" role="button" tabindex="0" aria-label="Hear it again">${pic}${text}</div>
   ${isL?`<button class="listen write" id="writeBtn">✏️ Lekhaun <small style="font-weight:500">let’s write it</small></button><div id="traceBox" hidden></div>`:''}
   <div class="nav">
    <button class="arrow" id="prev" aria-label="Previous">◀</button>
    <button class="listen" id="listen">🔊 Suna <small style="font-weight:500">listen</small></button>
    <button class="arrow" id="next" aria-label="Next">▶</button>
   </div>
   <div class="dots">${words.map((_,i)=>`<i class="${i===learnI?'on':''}"></i>`).join('')}</div>`;
  const hear=isL?()=>{say(it[0]+', '+it[5],`${it[1]}। ${it[6]}`,(t.id==='abc'?it[1]:it[0])+', as in '+it[7]);mood('happy');}
    :yn?()=>{say(it[0]+' '+yn[0],it[1]+' '+yn[1],it[2]+' '+yn[2]);mood('happy');}:()=>{say(it[0],it[1],it[2]);mood('happy');};
  $('#backBtn').onclick=()=>openTopic(t);
  if(isL)$('#writeBtn').onclick=()=>{$('#writeBtn').hidden=true;openTrace(it);};
  $('#card').onclick=hear;$('#card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hear();}};
  $('#listen').onclick=hear;
  $('#prev').onclick=()=>{learnI=(learnI-1+words.length)%words.length;renderLearn();};
  $('#next').onclick=()=>{
    if(learnI===words.length-1){
      const p=P();p.seen=p.seen||{};if(!p.seen[t.id])earn(2);p.seen[t.id]=1;save();
      speech('Syabaas!','स्याबास!','You saw them all! Now let’s play.');say('Syabaas!','स्याबास!','You saw them all!');confetti();mood('happy');learnI=0;setTimeout(()=>{if(screen==='learn'){if(trip)startQuiz({mode:'play',t});else openTopic(t);}},1600);return;
    }
    learnI++;renderLearn();
  };
  speech(it[0],it[1],it[2]);hear();
}

// generic finish card: stars, then buttons
function endCard(n,N,o){
  screen='end';if(trip)o.backLabel='🗺️ Yatra';const frac=N?n/N:1;
  const line=frac>=0.9?['Ekdam ramro!','एकदम राम्रो!','Amazing!']:frac>=0.6?['Syabaas!','स्याबास!','Well done!']:['Ramro kosis!','राम्रो कोसिस!','Good try!'];
  main.innerHTML=`<div class="end"><div class="trophy" aria-hidden="true">${o.trophy||(frac>=0.9?'🏆':frac>=0.6?'🥇':'🌟')}</div>

let M=null;
function memFace(x){
  const {t,it}=x.c;
  if(x.side==='pic')return t.kind==='num'?`<span class="digit">${it[3]}</span>`:pictureOf(t,it);
  if(t.kind==='letter')return `<span class="pic" style="font-size:2rem">${it[3]}</span><b>${esc(it[5])}</b><span class="dev" lang="ne">${it[6]}</span>`;
  const [w,help]=tw(it);
  if(EN())return `<b>${esc(w)}</b>`;
  return `<b>${esc(w)}</b><span class="dev" lang="ne">${help}</span>`;
}
function startMemory(cards,o){
  const uniq=shuffle(cards).filter((c,i,a)=>a.findIndex(x=>x.it[3]===c.it[3]||keyOf(x.t,x.it)===keyOf(c.t,c.it))===i);
  const pick=uniq.slice(0,o.pairs||4);
  M={cards,deck:shuffle(pick.flatMap((c,i)=>[{c,i,side:'pic'},{c,i,side:'word'}])),o,open:[],done:0,moves:0,lock:false,pairs:pick.length};
  drawMemory();
}
function drawMemory(){
  screen='memory';const cols=M.deck.length<=6?3:4;
  main.innerHTML=`${backBtn('Back')}<h2 class="sub">🧠 Jodi milau <small>${esc(M.o.title||'')} · find each picture’s word · tries: <span id="mMoves">0</span></small></h2>
   <div class="mem" style="--mc:${cols}">${M.deck.map((x,k)=>`<button class="mc" data-k="${k}" aria-label="Card ${k+1}"><span class="mc-in"><span class="mc-f mc-back" aria-hidden="true">?</span><span class="mc-f mc-face">${memFace(x)}</span></span></button>`).join('')}</div>`;
  $('#backBtn').onclick=M.o.back;
  main.querySelectorAll('.mc').forEach(b=>b.onclick=()=>memFlip(b,+b.dataset.k));
  speech('Jodi milau!','जोडी मिलाऊ!','Find each picture and its word.');say('Jodi milau!','जोडी मिलाऊ!','Find each picture and its word.');mood('wave');
}
function memFlip(b,k){
  if(M.lock||b.classList.contains('up')||b.classList.contains('done'))return;
  b.classList.add('up');M.open.push(k);
  const x=M.deck[k];if(x.side==='word')hearItem(x.c.t,x.c.it);
  if(M.open.length<2)return;
  M.moves++;$('#mMoves').textContent=M.moves;
  const [a,c]=M.open,A=M.deck[a],C=M.deck[c],btns=main.querySelectorAll('.mc');M.open=[];
  if(A.i===C.i){
    btns[a].classList.add('done');btns[c].classList.add('done');M.done++;
    const {t,it}=A.c;speech(t.kind==='letter'?it[5]:it[0],t.kind==='letter'?it[6]:it[1],t.kind==='letter'?it[7]:it[2]);hearItem(t,it);mood('happy');
    if(M.done===M.pairs){const m=M;setTimeout(()=>{if(screen==='memory'&&M===m)memEnd();},1100);}
  }else{M.lock=true;mood('sad');setTimeout(()=>{btns[a].classList.remove('up');btns[c].classList.remove('up');M.lock=false;},1000);}
}
function memEnd(){
  const n=M.moves<=M.pairs+2?3:M.moves<=M.pairs*2+1?2:1,p=P(),o=M.o;let nb=false;
  if(o.key&&n>((p.best||{})[o.key]||0)){p.best=p.best||{};p.best[o.key]=n;nb=true;save();}
  earn(n);
  endCard(n,3,{newBest:nb,sub:`${M.pairs} pairs in ${M.moves} tries`,again:()=>startMemory(M.cards,o),back:o.back});
}

// every card sits in one of Habre's three baskets: 0 = new / again, 1 = practising, 2 = I know it
const boxOf=(p,c)=>((p.box||{})[keyOf(c.t,c.it)])||0;
const allCards=()=>[...WORD_T(),...AKSHAR_ON(),...GRAM_ON(),...(shelved('vakya')?[]:[vakyaT()])].flatMap(t=>t.items.map(it=>({t,it})));
function deckSession(cards,p){
  const by=[[],[],[]];cards.forEach(c=>by[boxOf(p,c)].push(c));
  if(!by[0].length&&!by[1].length)return shuffle(cards).slice(0,12);
  return [...shuffle(by[0]),...shuffle(by[1]),...shuffle(by[2]).slice(0,2)].slice(0,12);
}
function trickyCards(p){
  const st=stat(p);
  return Object.keys(st.miss).map(k=>({k,score:(st.miss[k]||0)-(st.right[k]||0)*0.5})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,12).map(x=>findCard(x.k)).filter(Boolean);
}
// picture words from the stories the child has read
function storyWordCards(p){
  const out=[],seen=new Set();
  STORIES.filter(s=>bestOf(p,'kathaa',s.id)>=1).forEach(s=>pagesOf(s).forEach(pg=>pg[1].split(' ').forEach(w=>{const L=lookup(w);if(L&&!seen.has(keyOf(L.t,L.it))){seen.add(keyOf(L.t,L.it));out.push(L);}})));
  return out;
}

function kDone(ok){
  const c=KF.queue.shift(),first=!KF.missed.has(c),p=P(),key=keyOf(c.t,c.it);
  if(p&&first){
    const st=stat(p),s=ok?st.right:st.miss;s[key]=(s[key]||0)+1;

  KF.flipped=false;drawKCard();
}

const pagesOf=s=>[...s.pages,...(s.branches||[]).flat()];
// picture words, so a tapped story word can show its meaning
const ENDINGS=['haru','sanga','lai','ko','ma','le'];
let LEX=null;
function lookup(w){
  if(!LEX){LEX={};ALL_WORD_T().forEach(t=>t.items.forEach(it=>{if(!/\s/.test(it[0])&&!LEX[it[0]])LEX[it[0]]={t,it};}));}
  w=w.toLowerCase().replace(/[^a-z]/g,'');
  if(LEX[w])return LEX[w];
  for(const e of ENDINGS)if(w.endsWith(e)&&LEX[w.slice(0,-e.length)])return LEX[w.slice(0,-e.length)];
  return null;
}
// the same for an English story word (apples → apple)
let LEXE=null;
function lookupEn(w){
  if(!LEXE){LEXE={};ALL_WORD_T().forEach(t=>t.items.forEach(it=>{const k=it[2].toLowerCase();if(!/\s/.test(k)&&!LEXE[k])LEXE[k]={t,it};}));}
  w=w.toLowerCase().replace(/[^a-z]/g,'');
  return LEXE[w]||LEXE[w.replace(/s$/,'')]||LEXE[w.replace(/es$/,'')]||null;
}

  screen='storyq';const [rom,dev,en,ans,opts]=story.quiz;let tries=0,done=false;
  main.innerHTML=`${backBtn('Kathaa')}<div class="q"><div class="say">${qLine(rom,dev,en)}</div><button class="again" id="again" aria-label="Say it again">🔊</button></div>

// put four scenes from the story in order: tap what happened first
function storyOrder(){
  screen='storyo';const pg=story.pages,mid=shuffle(pg.slice(1,-1).map((_,i)=>i+1)).slice(0,2).sort((a,b)=>a-b),pick=[0,...mid,pg.length-1];
  const cards=shuffle(pick.map((pi,ord)=>({pi,ord})));let nextOrd=0;
  main.innerHTML=`${backBtn('Kathaa')}<h2 class="sub">🧩 Kun pahile? <small>Tap what happened first, then next…</small></h2>
   <div class="order">${cards.map((c,k)=>`<button class="ocard" data-k="${k}" style="animation:pop .45s ${k*80}ms backwards"><span class="pic" aria-hidden="true">${pg[c.pi][0]}</span><span>${esc(pg[c.pi][EN()?3:1])}</span></button>`).join('')}</div>`;
  $('#backBtn').onclick=openStories;
  main.querySelectorAll('.ocard').forEach(b=>b.onclick=()=>{
    const c=cards[+b.dataset.k];if(b.classList.contains('done'))return;
    if(c.ord===nextOrd){
      nextOrd++;b.classList.add('done');b.insertAdjacentHTML('beforeend',`<span class="num">${nextOrd}</span>`);const l=pg[c.pi];sayT(l[1],l[2],l[3]);mood('happy');
      if(nextOrd===pick.length){
        const p=P();if(!bestOf(p,'krama',story.id)){p.best=p.best||{};p.best['krama:'+story.id]=1;save();}
        earn(2);
        confetti();speech('Ekdam ramro!','एकदम राम्रो!','You put the story in order!');setTimeout(()=>{say('Ekdam ramro!','एकदम राम्रो!','You put the story in order!');},1400);
        setTimeout(()=>{if(screen==='storyo')openStories();},3600);
      }
    }else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');mood('sad');speech(nextOrd?'Ani ke bhayo?':'Pahile ke bhayo?',nextOrd?'अनि के भयो?':'पहिले के भयो?',nextOrd?'What happened next?':'What happened first?');say(nextOrd?'Ani ke bhayo?':'Pahile ke bhayo?',nextOrd?'अनि के भयो?':'पहिले के भयो?',null);}
  });
  speech('Kun pahile?','कुन पहिले?','What happened first?');say('Kun pahile?','कुन पहिले?','What happened first?');mood('wave');
}

const V_ABOUT={easy:'2-word sentences, the colours show where each word goes',medium:'3-word sentences',hard:'4-word sentences, one extra tile that doesn’t belong'};

    :['Kaam janaaune shabda sadhai antyama aauchha.','काम जनाउने शब्द सधैं अन्त्यमा आउँछ।','The doing word always comes last, like the engine of a train.'];

   <button class="rule" id="ruleCard" type="button"><span aria-hidden="true">💡</span><span>${en?`<b lang="ne">${rule[1]}</b><small>${rule[2]}</small>`

   <div class="legend">${Object.values(ROLES).map(r=>`<span style="background:${r[3]}">${en?`${r[2]} <small lang="ne">${r[1]}</small>`:`${r[0]} <small>${r[2]}</small>`}</span>`).join('')}</div>
   <h2 class="sub">Kati gaaro? <small>How hard?</small></h2>
   <div class="levels">${LV_KEYS.map(k=>{const L=LEVELS[k];return `<button class="lv" style="--lc:${L.color}" aria-pressed="${k===cur}" data-lv="${k}"><span aria-hidden="true">${L.icon}</span><b>${L.np}</b><small>${V_ABOUT[k]}</small></button>`;}).join('')}</div>
   <div class="topics">${V_ACTS.map((a,i)=>`<button class="topic" style="--tc:#ff9f1c;animation-delay:${i*50}ms" data-a="${a.id}"><span class="ic" aria-hidden="true">${a.icon}</span><b>${en?a.en:a.np}</b><span class="dev" lang="ne">${a.dev}</span>${en?'':`<span class="en">${a.en}</span>`}
      <span class="medals">${LV_KEYS.map(k=>`<span class="${bestOf(p,'vakya:'+a.id,k)>=V_N-1?'on':''}" title="${LEVELS[k].en}">${LEVELS[k].icon}</span>`).join('')}</span></button>`).join('')}

  $('#backBtn').onclick=toRoom('vakya');
  $('#ruleCard').onclick=()=>{if(en){speech('',rule[1],null);say(rule[1],rule[1],null);}else{speech(...rule);say(...rule);}mood('happy');};
  main.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{p.lv=p.lv||{};p.lv.vakya=b.dataset.lv;save();

let V=null;
function vStart(act){
  const lv=levelOf('vakya');
  if(act==='chitra'){startQuiz({mode:'vchitra',back:openVakya});return;}
  if(act==='grow'){vGrowStart();return;}
  const pool=act==='sodhau'?qas():vSents(lv);
  V={act,lv,list:shuffle(pool).slice(0,V_N),i:0,stars:0,cur:null};
  vNext();
}
function vNext(){if(V.i>=V.list.length){vEnd();return;}V.tries=0;V.cur=null;({build:vBuild,ulto:vSilly,sodhau:vAsk})[V.act]();}
const vBar=()=>`<div class="progress" aria-label="Sentence ${V.i+1} of ${V.list.length}"><i style="width:${V.i/V.list.length*100}%"></i></div>`;
// the engine is the car where the doing word belongs: last in Nepali, straight after "who" in English
const engAt=w=>EN()?w.findIndex(x=>x.r==='d'):w.length-1;
function carHtml(tile,k,eng,o){
  const col=tile?(o.colour?ROLES[tile.r][3]:''):(o.hint?ROLES[o.want[k].r][3]:'');
  const cls=['car',tile?'':'empty',tile&&!o.colour?'plain':'',k===eng?'engine':'',o.cls&&o.cls[k]||''].filter(Boolean).join(' ');
  return `<button class="${cls}" data-c="${k}" ${col?`style="--rc:${col}"`:''} aria-label="${tile?esc(tile.rom):'Empty car '+(k+1)}">${k===eng?'<span class="chim" aria-hidden="true"></span>':''}${tile?`${esc(tile.rom)}<small lang="ne">${tile.dev}</small>`:(o.hint?`<small${EN()?' lang="ne"':''}>${ROLES[o.want[k].r][EN()?1:0]}</small>`:'')}</button>`;
}
// build: tap the word tiles into the train cars in the right order
function vBuild(){
  screen='vbuild';const s=V.list[V.i],n=s.w.length,colour=V.lv!=='hard',hint=V.lv==='easy';
  if(!V.cur){
    const tiles=[...s.w];
    if(V.lv==='hard'){const dec=shuffle(sents().flatMap(x=>x.w)).find(x=>!s.w.some(y=>y.rom===x.rom));if(dec)tiles.push(dec);}
    V.cur={slots:Array(n).fill(null),pool:shuffle(tiles).map(t=>({...t,used:false})),cls:[]};
  }
  const C=V.cur;
  main.innerHTML=`${backBtn('Vakya')}${vBar()}
   <div class="q"><span class="pic" style="font-size:3.4rem;line-height:1" aria-hidden="true">${s.pic}</span><div class="say" style="font-size:1.3rem">${EN()?`<span lang="ne">${s.dev}</span><small lang="ne">अंग्रेजीमा रेल बनाऊ</small>`:`${S.english?esc(s.en):'Rel banau!'}<small>Rel banau · build the sentence train</small>`}</div><button class="again" id="again" aria-label="Hear the sentence">🔊</button></div>
   <div class="train">${C.slots.map((t,k)=>carHtml(t&&t.tile,k,engAt(s.w),{colour,hint,want:s.w,cls:C.cls})).join('')}</div>
   <div class="pool">${C.pool.map((t,k)=>t.used?'':`<button class="tile${colour?'':' plain'}" data-p="${k}" ${colour?`style="--rc:${ROLES[t.r][3]}"`:''}>${esc(t.rom)}<small lang="ne">${t.dev}</small></button>`).join('')}</div>`;
  const hear=()=>sayT(s.rom,s.dev,s.en);
  $('#backBtn').onclick=openVakya;$('#again').onclick=hear;
  main.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    if(C.done)return;const k=+b.dataset.p,slot=C.slots.findIndex(x=>!x);if(slot<0)return;
    C.pool[k].used=true;C.slots[slot]={tile:C.pool[k],p:k};C.cls=[];sayT(C.pool[k].rom,C.pool[k].dev,C.pool[k].rom);
    if(C.slots.every(Boolean))vCheckBuild();else vBuild();
  });
  main.querySelectorAll('.car').forEach(b=>b.onclick=()=>{
    if(C.done)return;const k=+b.dataset.c,x=C.slots[k];if(!x)return;C.pool[x.p].used=false;C.slots[k]=null;C.cls=[];vBuild();
  });
  if(!C.spoke){C.spoke=true;if(V.lv!=='hard')hear();speech('Rel banau!','रेल बनाऊ!','Put the words in the train. The doing word is the engine!');mood('wave');}
}
function vCheckBuild(){
  const s=V.list[V.i],C=V.cur,ok=C.slots.every((x,k)=>x.tile.rom===s.w[k].rom);
  if(ok){
    C.done=true;C.cls=s.w.map(()=>'good');if(V.tries===0)V.stars++;vBuild();confetti();mood('happy');
    const p=rnd(PRAISE);speech(p[0]+' '+s.rom,p[1]+' '+s.dev,s.en);sayT(s.rom,s.dev,s.en);
    const v=V;setTimeout(()=>{if(screen==='vbuild'&&V===v){V.i++;vNext();}},2300);return;
  }
  V.tries++;mood('sad');
  if(V.tries>=2){
    C.done=true;C.slots=s.w.map(w=>({tile:C.pool.find(t=>t.rom===w.rom),p:-1}));C.cls=s.w.map(()=>'good');vBuild();
    speech(s.rom,s.dev,'Like this!');sayT(s.rom,s.dev,s.en);const v=V;setTimeout(()=>{if(screen==='vbuild'&&V===v){V.i++;vNext();}},3200);return;
  }
  // send the wrong ones back to the pile, keep the right ones
  const engineWrong=C.slots[engAt(s.w)].tile.r!=='d',where=EN()?['Kaam garne shabda ko pachhi!','काम गर्ने शब्द “को?” पछि!','The doing word comes right after who!']:['Kaam garne shabda antyama!','काम गर्ने शब्द अन्त्यमा!','The doing word goes at the end!'];
  C.cls=C.slots.map((x,k)=>x.tile.rom===s.w[k].rom?'good':'bad');
  C.slots=C.slots.map((x,k)=>{if(x.tile.rom===s.w[k].rom)return x;C.pool[x.p].used=false;return null;});
  vBuild();
  if(engineWrong){speech(...where);say(...where);}
  else{speech(RETRY[0],RETRY[1],RETRY[2]);say(RETRY[0],RETRY[1],RETRY[2]);}
}
// silly sentence: Habre muddled the order; tap two cars to swap them
function vSilly(){
  screen='vsilly';const s=V.list[V.i],n=s.w.length,colour=V.lv!=='hard';
  if(!V.cur){let o;do{o=shuffle(s.w);}while(o.every((x,k)=>x.rom===s.w[k].rom));V.cur={order:o,sel:-1,swaps:0};}

   <div class="q"><span class="pic" style="font-size:3.4rem;line-height:1" aria-hidden="true">${s.pic}</span><div class="say" style="font-size:1.3rem">Ulto-pulto bhayo!<small>${EN()?`<span lang="ne">${s.dev}</span> · `:S.english?esc(s.en)+' · ':''}Tap two cars to swap them</small></div><button class="again" id="again" aria-label="Hear it">🔊</button></div>
   <div class="train">${C.order.map((t,k)=>carHtml(t,k,engAt(s.w),{colour,cls:C.order.map((x,j)=>right?'good':j===C.sel?'sel':'')})).join('')}</div>`;

    if(right)return;const k=+b.dataset.c;

    if(C.sel!==k){[C.order[C.sel],C.order[k]]=[C.order[k],C.order[C.sel]];C.swaps++;}
    C.sel=-1;
    if(C.order.every((x,j)=>x.rom===s.w[j].rom)){
      if(C.swaps<=n-1)V.stars++;vSilly();confetti();mood('happy');speech('Milyo! '+s.rom,s.dev,s.en);sayT(s.rom,s.dev,s.en);
      const v=V;setTimeout(()=>{if(screen==='vsilly'&&V===v){V.i++;vNext();}},2300);
    }else vSilly();
  });
  if(!C.spoke){C.spoke=true;speech('Ulto-pulto bhayo!','उल्टोपुल्टो भयो!','Oops, I mixed it up! Can you fix it?');say('Ulto-pulto bhayo!','उल्टोपुल्टो भयो!','Oops, I mixed it up!');mood('sad');}
}
// ask and answer: hear the question, pick the answer that fits
function vAsk(){
  screen='vask';const qa=V.list[V.i],c=Math.min(3,LEVELS[V.lv].choices),hide=V.lv==='hard'&&canListen();
  if(!V.cur)V.cur={opts:shuffle([qa,...shuffle(qas().filter(x=>x!==qa)).slice(0,c-1)]),lock:false};
  const C=V.cur;
  main.innerHTML=`${backBtn('Vakya')}${vBar()}
   <div class="q${hide?' listenonly':''}"><span class="pic" style="font-size:3.4rem;line-height:1" aria-hidden="true">${qa[3]}</span><div class="say" id="qSay">${hide?'Suna ra jawaaf deu!<small>Listen and answer</small>':`${esc(qa[0])}<small lang="ne">${!EN()||V.lv==='easy'?qa[1]:''}${S.english&&V.lv==='easy'&&!EN()?` · ${esc(qa[2])}`:''}</small>`}</div><button class="again" id="again" aria-label="Say it again">🔊</button></div>
   <button class="btn ghost" id="hearAns" style="align-self:center">👂 Hear the answers</button>
   <div class="ansopts">${C.opts.map((o,k)=>`<button class="ansopt" data-k="${k}" style="animation-delay:${k*80}ms">${esc(o[4])}<small lang="ne">${!EN()||V.lv==='easy'?o[5]:''}${S.english&&V.lv==='easy'&&!EN()?` · ${esc(o[6])}`:''}</small></button>`).join('')}</div>`;
  // an English learner sees the Nepali help on the easy level only, like the English help for a Nepali learner
  const ask=()=>{if(!hide)speech(qa[0],!EN()||V.lv==='easy'?qa[1]:'',qa[2]);say(qa[0],qa[1],V.lv==='easy'||EN()?qa[2]:null);};
  $('#backBtn').onclick=openVakya;$('#again').onclick=ask;
  $('#hearAns').onclick=()=>C.opts.forEach((o,k)=>sayT(o[4],o[5],o[6],{keep:k>0}));
  main.querySelectorAll('.ansopt').forEach(b=>b.onclick=()=>{
    if(C.lock)return;const o=C.opts[+b.dataset.k];
    if(o===qa){
      C.lock=true;if(V.tries===0)V.stars++;b.classList.add('right');confetti();mood('happy');
      $('#qSay').innerHTML=EN()?`${esc(qa[2])}<small lang="ne">${qa[1]}</small>`:`${esc(qa[0])}<small lang="ne">${qa[1]} · ${esc(qa[2])}</small>`;
      speech(qa[4],qa[5],qa[6]);sayT(qa[4],qa[5],qa[6]);const v=V;setTimeout(()=>{if(screen==='vask'&&V===v){V.i++;vNext();}},2300);

      else{speech(RETRY[0],RETRY[1],RETRY[2]);say(RETRY[0],RETRY[1],RETRY[2]);}
    }
  });
  ask();
}
function vEnd(){
  const p=P(),key='vakya:'+V.act+':'+V.lv;let nb=false;
  if(V.stars>((p.best||{})[key]||0)){p.best=p.best||{};p.best[key]=V.stars;nb=true;}
  stat(p).plays++;stat(p).last=today();save();earn(V.stars);
  const act=V.act;endCard(V.stars,V.list.length,{newBest:nb,sub:`${V_ACTS.find(a=>a.id===act).en} · ${LEVELS[V.lv].en}`,again:()=>vStart(act),back:openVakya,backLabel:'Vakya'});
}
// grow: a sentence gets one more word each time; tap the gap where it goes
function vGrowStart(){
  const p=P();let i=grows().findIndex((_,k)=>bestOf(p,'badhau',k)<3);if(i<0)i=Math.floor(Math.random()*grows().length);
  V={act:'grow',g:i,step:1,stars:0,tries:0};vGrow();
}
function vGrow(){
  screen='vgrow';const g=grows()[V.g],prev=g.steps[V.step-1],next=g.steps[V.step];
  const add=next.find(x=>!prev.some(y=>y.rom===x.rom)),want=next.indexOf(add),n=prev.length,eng=EN()?prev.findIndex(x=>x.r==='d'):prev[n-1].r==='d'?n-1:-1;
  const gap=k=>`<button class="gap${V.tries>=2&&k===want?' hint':''}" data-g="${k}" aria-label="Put it here">+</button>`;
  main.innerHTML=`${backBtn('Vakya')}<div class="progress"><i style="width:${(V.step-1)/(g.steps.length-1)*100}%"></i></div>
   <div class="q"><span class="pic" style="font-size:3.4rem;line-height:1" aria-hidden="true">${g.pic}</span><div class="say" style="font-size:1.3rem">${esc(sRom(prev))}<small lang="ne">${sDev(prev)}${S.english&&!EN()?' · '+esc(g.en[V.step-1]):''}</small></div><button class="again" id="again" aria-label="Hear it">🔊</button></div>
   <div class="train">${gap(0)}${prev.map((t,k)=>carHtml(t,k,eng,{colour:true})+gap(k+1)).join('')}</div>
   <h2 class="sub" style="text-align:center">Yo kahaa jaanchha? <small>Where does this word go?${EN()?' · '+sDev(next):S.english?' · '+esc(g.en[V.step]):''}</small></h2>
   <div class="pool"><span class="tile new" style="--rc:${ROLES[add.r][3]}">${esc(add.rom)}<small lang="ne">${add.dev}</small></span></div>`;
  $('#backBtn').onclick=openVakya;$('#again').onclick=()=>sayT(sRom(prev),sDev(prev),sRom(prev));
  main.querySelectorAll('.gap').forEach(b=>b.onclick=()=>{
    if(+b.dataset.g===want){
      if(V.tries===0)V.stars++;V.step++;V.tries=0;confetti();mood('happy');
      speech(sRom(next),sDev(next),g.en[V.step-1]);sayT(sRom(next),sDev(next),sRom(next));
      const v=V;if(V.step>=g.steps.length){setTimeout(()=>{if(screen==='vgrow'&&V===v)vGrowEnd();},1800);main.querySelectorAll('.gap').forEach(x=>x.disabled=true);}
      else setTimeout(()=>{if(screen==='vgrow'&&V===v)vGrow();},1500);
    }else{V.tries++;b.classList.add('wrong');b.disabled=true;mood('sad');
      if(V.tries>=2)vGrow();
      if(add.r==='d'){if(EN())speech('Kaam garne shabda ko pachhi!','काम गर्ने शब्द “को?” पछि!','The doing word comes right after who!');else speech('Kaam garne shabda antyama!','काम गर्ने शब्द अन्त्यमा!','The doing word goes at the end!');}else speech(RETRY[0],RETRY[1],RETRY[2]);
      say(RETRY[0],RETRY[1],null);}
  });
  if(V.tries===0){sayT(sRom(prev),sDev(prev),sRom(prev));speech(sRom(prev),sDev(prev),'Let’s make it longer!');}
}
function vGrowEnd(){
  const p=P(),key='badhau:'+V.g,g=grows()[V.g],last=g.steps[g.steps.length-1];let nb=false;
  if(V.stars>((p.best||{})[key]||0)){p.best=p.best||{};p.best[key]=V.stars;nb=true;}
  save();earn(V.stars);
  endCard(V.stars,3,{trophy:'🌱',title:sRom(last),titleDev:sDev(last),sub:g.en[g.en.length-1],newBest:nb,again:vGrowStart,back:openVakya,backLabel:'Vakya'});
}


// ---------- letter tracing ----------
// the child traces over a faint letter; it counts when the ink covers most of the letter and stays mostly inside it
function openTrace(it){
  const box=$('#traceBox');box.hidden=false;
  box.innerHTML=`<div class="trace"><canvas id="trGuide" aria-hidden="true"></canvas><canvas id="trInk" aria-label="Trace the letter ${it[1]} with your finger"></canvas></div>
   <div class="btns"><button class="btn ghost" id="trClear">↺ Pheri <small style="font-weight:500">again</small></button><button class="btn" style="background:var(--green)" id="trDone">✔ Sakiyo <small style="font-weight:500">done</small></button></div>`;
  const wrap=box.querySelector('.trace'),size=Math.round(wrap.getBoundingClientRect().width)||260,dpr=window.devicePixelRatio||1;
  const g=$('#trGuide'),k=$('#trInk');[g,k].forEach(c=>{c.width=size*dpr;c.height=size*dpr;});
  const gx=g.getContext('2d'),kx=k.getContext('2d');gx.scale(dpr,dpr);kx.scale(dpr,dpr);
  // a 1x copy of the ink for checking
  const ink=document.createElement('canvas');ink.width=ink.height=size;const ix=ink.getContext('2d');
  const font=`700 ${Math.round(size*0.6)}px 'Baloo 2','Nirmala UI','Mangal',sans-serif`,cy=size*0.56;
  const drawGuide=()=>{gx.clearRect(0,0,size,size);gx.font=font;gx.textAlign='center';gx.textBaseline='middle';
    gx.fillStyle='#e6f1fb';gx.fillText(it[1],size/2,cy);gx.setLineDash([5,6]);gx.lineWidth=2;gx.strokeStyle='#9fbfdc';gx.strokeText(it[1],size/2,cy);};
  (document.fonts&&document.fonts.load?document.fonts.load(font):Promise.resolve()).then(drawGuide,drawGuide);
  const lw=size*0.08;
  [kx,ix].forEach(c=>{c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#e8463a';});
  let down=false,last=null,won=false;
  const pt=e=>{const r=k.getBoundingClientRect();return [(e.clientX-r.left)*size/r.width,(e.clientY-r.top)*size/r.height];};
  const line=(a,b)=>[kx,ix].forEach(c=>{c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();});
  k.onpointerdown=e=>{down=true;k.setPointerCapture(e.pointerId);last=pt(e);line(last,last);};
  k.onpointermove=e=>{if(!down)return;const p=pt(e);line(last,p);last=p;};
  k.onpointerup=k.onpointercancel=()=>{if(!down)return;down=false;if(!won&&check(false))celebrate();};
  function check(loud){
    const m=document.createElement('canvas');m.width=m.height=size;const mx=m.getContext('2d');
    mx.font=font;mx.textAlign='center';mx.textBaseline='middle';mx.fillStyle='#000';mx.fillText(it[1],size/2,cy);

  speech('Lekhaun!','लेखौं!','Trace the letter with your finger.');say('Lekhaun!','लेखौं!','Trace the letter with your finger.');
  wrap.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});
